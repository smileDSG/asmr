name: 部署夜息到阿里云

# 触发条件：push 到 master 分支，或手动在 GitHub 页面点运行
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  precheck:
    name: 上线前门禁检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装 Node 20（用于 JS 语法检查）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装运行依赖
        run: python -m pip install -r requirements.txt

      - name: 运行上线前门禁
        run: python tests/precheck.py

  deploy:
    needs: precheck
    runs-on: ubuntu-latest
    steps:
      - name: SSH 到服务器拉取最新代码并重启
        uses: appleboy/ssh-action@v1
        env:
          YEXI_ALERT_WEBHOOK: ${{ secrets.YEXI_ALERT_WEBHOOK }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 5m
          envs: YEXI_ALERT_WEBHOOK
          script: |
            set -e
            cd /opt/yexi
            echo ">>> 更新前："
            git log -1 --oneline
            echo ">>> 拉取最新代码："
            git fetch origin master
            git reset --hard origin/master
            echo ">>> 更新后："
            git log -1 --oneline
            echo ">>> 写服务端环境配置（强制 prod + 告警 Webhook）："
            {
              echo 'YEXI_PAY_MODE=prod'
              if [ -n "$YEXI_ALERT_WEBHOOK" ]; then
                printf 'YEXI_ALERT_WEBHOOK=%s\n' "$YEXI_ALERT_WEBHOOK"
              fi
            } > /etc/yexi.env
            chmod 600 /etc/yexi.env
            if [ -n "$YEXI_ALERT_WEBHOOK" ]; then
              echo "已写入 YEXI_ALERT_WEBHOOK 到 /etc/yexi.env"
            else
              echo "未配置 YEXI_ALERT_WEBHOOK secret，跳过写入"
            fi
            if grep -q 'EnvironmentFile' /etc/systemd/system/yexi.service 2>/dev/null; then
              echo "service 已引用 EnvironmentFile"
            else
              echo "警告：yexi.service 未引用 /etc/yexi.env，请在 [Service] 段加一行：EnvironmentFile=/etc/yexi.env"
            fi
            systemctl daemon-reload
            systemctl restart yexi
            sleep 3
            echo ">>> 服务状态："
            systemctl is-active yexi
            echo ">>> 页面检查："
            curl -s -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:8000/

  # 部署完不等于部署好：用 check_install.py 从外网完整验一遍
  # （安装页 / HEAD 探文件 / APK 全量下载校验 / 二维码内容），
  # 任何一项失败整个 workflow 标红，GitHub 会自动发邮件通知。
  verify:
    name: 部署后自动自检
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    steps:
      - name: 拉取代码（要 check_install.py）
        uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装二维码校验依赖
        run: python -m pip install pillow qrcode

      - name: 安装 Node 20（用于无头浏览器巡检）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行完整自检（含 APK 下载与接口校验）
        env:
          YEXI_ALERT_WEBHOOK: ${{ secrets.YEXI_ALERT_WEBHOOK }}
        run: python check_install.py

      - name: 无头浏览器页面巡检（0 JS错误 / 0 4xx-5xx）
        run: node tests/browser_smoke.mjs http://47.101.59.166:8000
