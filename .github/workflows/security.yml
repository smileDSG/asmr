name: 安全门禁（CodeQL + 依赖漏洞扫描）

# SDLC 测试构建阶段的自动化安全门禁：
# 每次 push / PR 到 master 自动跑。不阻断部署（deploy.yml 独立）。
# 注意：本仓库是私有仓库且未启用 GitHub Code Scanning（个人账号通常需付费的
# Advanced Security），所以 CodeQL 分析能跑、但结果无法上传到 Security 标签页。
# 因此给 analyze 步骤加 continue-on-error：扫描照跑、日志照看，但不让 workflow 误报失败。
# 将来若开启了 Code Scanning，去掉 continue-on-error 即可恢复上传。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  codeql:
    name: CodeQL 静态分析（Python）
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      # Python 是解释型语言，官方模板用 autobuild；这里没有编译步骤，也写上保持标准
      - name: 自动构建
        uses: github/codeql-action/autobuild@v4

      - name: 分析并上传结果
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: "/language:python"

  dependency-audit:
    name: 依赖漏洞扫描（pip-audit）
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖与扫描器
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit

      - name: 扫描已知漏洞
        run: pip-audit -r requirements.txt
