name: 编译夜息 App APK

# 手动触发，或 push 到 master 且 app/ 目录有改动时自动编译
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖并同步原生工程
        working-directory: app
        run: |
          npm ci --registry=https://registry.npmjs.org
          npx cap sync android

      - name: 编译 Debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: yexi-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      # 把 APK 直接传到服务器下载目录，让 install.html 的下载按钮有真实文件。
      # APK 是编译产物不进 git，deploy.yml 的 git reset 不会碰这里的文件。
      # 先在 CI 里改成简单文件名，避免路径层级数错。
      - name: 准备上传文件
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk yexi.apk

      - name: 传 APK 到服务器下载目录
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: yexi.apk
          target: /opt/yexi/product_site/download/
          overwrite: true

      - name: 确认服务器 APK
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: ls -lh /opt/yexi/product_site/download/
