<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的 ASMR · 夜息</title>
<link rel="stylesheet" href="theme.css?v=12">
<style>

/* =========================================================
   我的 ASMR：沿用首页的夜色，但密度更高
   hero 38vh（首页的 38%），标题 46px（首页 76 × 0.6）
   列表不用圆角卡片，改用一条细线分行的节奏
   ========================================================= */

/* —— 资料头：头像 + 名字 + 一句话简介 —— */
.profile-head{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.avatar-lg{
  width:64px;height:64px;flex:0 0 64px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--y-serif);font-size:28px;line-height:1;
  color:#fbf6ff;background:rgba(233,183,131,.18);
  border:1px solid rgba(233,183,131,.28);
  box-shadow:0 8px 30px -12px rgba(233,183,131,.5);
  transition:background .5s ease;
}
.profile-id{flex:1 1 200px;min-width:0}
.profile-id h1{margin:0}
.profile-bio{
  margin:6px 0 0;font-size:13px;line-height:1.7;
  color:var(--y-text-sub);letter-spacing:.03em;
}
.profile-bio:empty{display:none}
.profile-acts{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.profile-acts .ph-act{background:none;border:none;font-family:inherit;cursor:pointer;padding:0}

/* —— 编辑资料弹窗 —— */
.pf-mask{
  position:fixed;inset:0;z-index:90;display:none;
  align-items:center;justify-content:center;padding:16px;
  background:rgba(7,5,13,.72);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.pf-mask.open{display:flex}
.pf-card{
  width:100%;max-width:440px;max-height:88vh;overflow-y:auto;
  padding:22px;border-radius:18px;
  background:rgba(16,12,26,.96);
  box-shadow:0 30px 80px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.06);
}
.pf-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:4px}
.pf-head h3{margin:0;font-family:var(--y-serif);font-size:19px;font-weight:400;letter-spacing:.1em;color:#fbf7ff}
.pf-close{
  width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:none;
  background:rgba(255,255,255,.06);color:rgba(226,216,244,.7);
  cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;
}
.pf-close:hover{background:rgba(255,255,255,.12);color:#fff}
.pf-label{
  display:block;font-size:12.5px;letter-spacing:.14em;
  color:var(--y-text-sub);margin:18px 0 9px;
}
.pf-preview{display:flex;align-items:center;gap:14px;margin:12px 0 4px}
.pf-preview .avatar-lg{width:56px;height:56px;flex:0 0 56px;font-size:24px}
.pf-preview-tip{font-size:12px;color:var(--y-text-muted);line-height:1.6}
.pf-glyphs{display:flex;flex-wrap:wrap;gap:8px}
.pf-glyph{
  width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);color:rgba(236,228,248,.85);
  font-family:var(--y-serif);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .3s ease,background .3s ease,color .3s ease;
}
.pf-glyph:hover{background:rgba(233,183,131,.14);color:#fff}
.pf-glyph.on{border-color:rgba(233,183,131,.7);background:rgba(233,183,131,.2);color:#fff}
.pf-tones{display:flex;gap:10px;flex-wrap:wrap}
.pf-tone{
  width:30px;height:30px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);
}
.pf-tone.on{border-color:rgba(233,183,131,.85)}
.pf-actions{display:flex;align-items:center;gap:10px;margin-top:24px}
.pf-actions .y-btn-ghost{background:none;border:none;color:var(--y-text-sub);font-family:inherit;cursor:pointer;font-size:13.5px;padding:9px 6px}
.pf-actions .y-btn-ghost:hover{color:#fff}
.pf-msg{font-size:12px;color:rgba(233,183,131,.85);margin-top:10px}
.pf-msg.err{color:rgba(255,160,185,.9)}

/* —— 数据行：不装盒子，直接排在标题下面 —— */
.profile-meta{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  margin-top:18px;font-size:13px;letter-spacing:.08em;color:var(--y-text-sub);
}
.profile-meta b{
  font-family:var(--y-serif);font-size:20px;font-weight:400;
  color:#fbf7ff;margin-right:5px;font-variant-numeric:tabular-nums;
}
.profile-meta i{font-style:normal;color:rgba(255,255,255,.16)}
/* 档案说明跟着数据走，不再挤在页头标题下面 */
.profile-caption{
  margin:10px 0 0;font-size:13px;letter-spacing:.04em;
  color:var(--y-text-sub);line-height:1.75;
}
.guest-line{
  margin:14px 0 0;font-size:13px;letter-spacing:.04em;
  color:var(--y-text-sub);line-height:1.75;
}
.guest-line a{
  color:var(--y-warm);text-decoration:none;
  border-bottom:1px solid rgba(var(--y-warm-rgb),.35);padding-bottom:1px;
}
.guest-line a:hover{border-bottom-color:rgba(var(--y-warm-rgb),.9)}

/* 权益卡：一眼看清免费还剩几次、全库什么时候到期 */
.ent-box{
  margin-top:16px;padding:13px 15px;border-radius:12px;
  border:1px solid rgba(var(--y-warm-rgb),.22);
  background:rgba(var(--y-warm-rgb),.05);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.ent-box .ent-main{flex:1;min-width:0}
.ent-box .ent-title{font-size:13px;color:var(--y-warm);letter-spacing:.06em}
.ent-box .ent-desc{font-size:12px;color:var(--y-text-sub);margin-top:4px;line-height:1.6}
.ent-box .ent-btn{
  border:1px solid rgba(var(--y-warm-rgb),.5);border-radius:9px;
  background:transparent;color:var(--y-warm);padding:7px 14px;
  font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap;
}
.ent-box .ent-btn:hover{background:rgba(var(--y-warm-rgb),.12)}

/* —— 分组标签 —— */
.sub-tabs{
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  margin:clamp(28px,5vh,46px) 0 2px;padding:0;
  border-bottom:none;
}
.sub-tab{
  position:relative;background:transparent;border:none;border-radius:0;
  padding:6px 0 12px;font-family:var(--y-serif);font-size:14.5px;
  letter-spacing:.16em;color:var(--y-text-muted);cursor:pointer;
  transition:color .6s ease;
}
.sub-tab:hover{color:var(--y-text-sub)}
.sub-tab.sel{color:var(--y-text)}
.sub-tab.sel::after{
  content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;
  margin-left:-2px;border-radius:50%;background:var(--y-warm);
  box-shadow:0 0 10px var(--y-warm);
}

/* —— 分类入口矩阵（我的页首层）：像音乐App那样按类进入独立列表 —— */
.lib-entry-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;margin:18px 0 6px;
}
@media(min-width:620px){ .lib-entry-grid{grid-template-columns:repeat(3,minmax(0,1fr));} }
.lib-entry{
  position:relative;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;
  padding:16px 15px 14px;border-radius:16px;
  border:1px solid rgba(255,255,255,.07);
  background:linear-gradient(150deg,rgba(var(--y-warm-rgb),.09),rgba(255,255,255,.02));
  color:var(--y-text);font-family:inherit;
  transition:border-color .35s ease,background .35s ease,transform .25s ease;
}
.lib-entry:hover{border-color:rgba(var(--y-warm-rgb),.4);transform:translateY(-2px)}
.lib-entry .le-ico{width:22px;height:22px;color:var(--y-warm)}
.lib-entry .le-ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lib-entry .le-name{font-family:var(--y-serif);font-size:15px;letter-spacing:.08em}
.lib-entry .le-sub{font-size:11px;line-height:1.5;color:var(--y-text-muted)}
.lib-entry .le-count{
  position:absolute;right:13px;top:14px;font-size:11px;
  color:var(--y-warm);font-variant-numeric:tabular-nums;
}
.lib-entry.featured{grid-column:1 / -1;background:linear-gradient(120deg,rgba(var(--y-warm-rgb),.18),rgba(var(--y-warm-rgb),.04))}

/* —— 独立列表视图：点分类后进入，带返回 —— */
.list-view{display:none}
.list-view.open{display:block}
.list-view-head{
  display:flex;align-items:center;gap:12px;margin:8px 0 4px;
}
.list-back{
  background:rgba(255,255,255,.05);border:none;border-radius:999px;
  color:var(--y-text-sub);font-family:inherit;font-size:12.5px;
  padding:7px 14px;cursor:pointer;
}
.list-back:hover{color:#fff;background:rgba(var(--y-warm-rgb),.18)}
.list-view-title{font-family:var(--y-serif);font-size:17px;letter-spacing:.1em;color:var(--y-text)}

/* —— 小节标题：一行小字，不是卡片标题 —— */
.sec-title{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin:26px 0 0;padding:0 0 10px;
  font-size:13px;letter-spacing:.18em;color:var(--y-text-sub);
  border-bottom:1px solid rgba(255,255,255,.07);
}

/* —— 列表行：去卡片化 —— */
.item-card{
  background:none;
  backdrop-filter:none;-webkit-backdrop-filter:none;
  border:none;border-radius:0;
  border-bottom:1px solid rgba(255,255,255,.07);
  box-shadow:none;
  margin:0;padding:18px 0 16px;
}
.item-head{display:flex;align-items:flex-start;gap:14px}
.item-main{flex:1;min-width:0}
.item-title-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.item-title{
  font-family:var(--y-serif);font-size:17px;font-weight:400;
  letter-spacing:.07em;color:#fbf7ff;
}
.item-meta{font-size:13px;letter-spacing:.04em;color:var(--y-text-muted);margin-top:5px}
.item-story{
  font-size:13.5px;line-height:1.7;color:var(--y-text-sub);margin-top:8px;
}

/* 标记一律压成中性小字，暖色留给"正在发生" */
.badge-pill{
  font-size:12px;letter-spacing:.06em;color:var(--y-text-sub);
  background:rgba(255,255,255,.055);border:none;border-radius:999px;
  padding:2px 8px;
}
.badge-pill.soft{background:transparent;color:var(--y-text-muted);padding:2px 0}

/* 参数条 */
.param-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.param-pill{
  font-size:12px;letter-spacing:.02em;color:var(--y-text-muted);
  background:rgba(255,255,255,.04);border:none;border-radius:999px;
  padding:2px 8px;font-variant-numeric:tabular-nums;
}
.diff-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.diff-pill{
  font-size:12px;color:rgba(233,183,131,.82);
  background:rgba(var(--y-warm-rgb),.08);border:none;border-radius:999px;
  padding:2px 8px;
}

/* 许可选择：只在选中时上一点暖色 */
.policy-bar{
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  margin-top:10px;padding-top:0;border-top:none;
}
.policy-lbl{font-size:12px;letter-spacing:.08em;color:var(--y-text-muted);margin-right:6px}
.policy-opt{
  font-size:12.5px;color:var(--y-text-sub);background:transparent;
  border:none;border-bottom:1px solid transparent;border-radius:0;
  padding:2px 0 3px;margin-right:12px;cursor:pointer;font-family:inherit;
  transition:color .45s ease,border-color .45s ease;
}
.policy-opt:hover{color:var(--y-text-sub)}
.policy-opt.on{color:var(--y-warm);border-bottom-color:rgba(var(--y-warm-rgb),.55)}

/* —— 操作：全部降为文字，一屏最多一个实心暖按钮 —— */
.card-acts{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:12px}
.card-acts button,.card-acts a{
  padding:0;font-size:13.5px;letter-spacing:.06em;line-height:1.6;
  background:none;border:none;box-shadow:none;border-radius:0;
  cursor:pointer;font-family:inherit;text-decoration:none;
  display:inline-flex;align-items:center;gap:5px;
  transition:color .45s ease;
}
.card-acts .y-btn-primary{color:var(--y-warm)}
.card-acts .y-btn-primary:hover{color:#ffe9cd;box-shadow:none;filter:none}
.card-acts .y-btn-ghost{color:var(--y-text-sub)}
.card-acts .y-btn-ghost:hover{color:#fff;background:none}
.card-acts .btn-danger-ghost{color:rgba(226,216,244,.34);margin-left:6px}
.card-acts .btn-danger-ghost:hover{color:rgba(255,160,185,.85);background:none}

.item-msg{
  font-size:12.5px;color:rgba(var(--y-warm-rgb),.8);
  margin-top:8px;min-height:0;line-height:1.6;
}
.item-msg:empty{display:none}

/* 空状态：一句话 + 一个动作，不居中长文案 */
.empty-card{
  background:none;backdrop-filter:none;-webkit-backdrop-filter:none;
  border:none;border-radius:0;border-bottom:1px solid rgba(255,255,255,.07);
  padding:20px 0;text-align:left;
  font-size:13.5px;line-height:1.9;color:var(--y-text-sub);
}
.empty-card a{color:rgba(233,183,131,.9);text-decoration:none}
.empty-card a:hover{color:var(--y-warm)}

/* —— 我的配方空状态：一句说明 + 一个主按钮 + 一个次要入口 —— */
.empty-guide{
  position:relative;overflow:hidden;
  margin-top:4px;padding:24px 24px 22px;
  border:1px solid rgba(255,255,255,.07);border-radius:12px;
  background:rgba(255,255,255,.022);
}
.empty-guide::before{
  content:"";position:absolute;right:-30px;top:-40px;
  width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--y-warm-rgb),.10),transparent 70%);
  pointer-events:none;
}
.empty-guide-ico{
  font-size:20px;line-height:1;color:var(--y-warm);
  opacity:.85;display:block;margin-bottom:12px;
}
.empty-guide-title{
  margin:0 0 6px;font-family:var(--y-serif);
  font-size:16px;font-weight:400;letter-spacing:.08em;color:var(--y-text);
}
.empty-guide-sub{
  margin:0 0 18px;font-size:12.5px;line-height:1.75;
  color:var(--y-text-muted);
}
.empty-guide-acts{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.empty-guide-primary{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 18px;border-radius:7px;
  background:rgba(var(--y-warm-rgb),.14);
  border:1px solid rgba(var(--y-warm-rgb),.34);
  color:var(--y-warm);font-size:13px;text-decoration:none;
  transition:background .3s ease,border-color .3s ease;
}
.empty-guide-primary:hover{
  background:rgba(var(--y-warm-rgb),.22);
  border-color:rgba(var(--y-warm-rgb),.6);
}
.empty-guide-secondary{
  font-size:12.5px;color:var(--y-text-muted);text-decoration:none;
  border-bottom:1px solid rgba(255,255,255,.14);padding-bottom:2px;
  transition:color .3s ease,border-color .3s ease;
}
.empty-guide-secondary:hover{color:var(--y-warm);border-color:rgba(var(--y-warm-rgb),.6)}

/* —— 耳朵档案：唯一需要"一块浮起"的地方，单层，不嵌套 —— */
.ear-card{
  background:rgba(255,255,255,.032);
  backdrop-filter:none;-webkit-backdrop-filter:none;
  border:none;border-radius:14px;
  padding:20px;margin:14px 0 12px;
}
.ear-card:first-child{margin-top:18px}
.ear-dim-row{margin-bottom:12px}
.ear-dim-top{
  display:flex;justify-content:space-between;
  font-size:13px;letter-spacing:.06em;color:var(--y-text-sub);margin-bottom:5px;
}
.ear-dim-bar{
  height:3px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;
}
.ear-dim-fill{
  height:100%;border-radius:999px;
  background:linear-gradient(90deg,rgba(var(--y-warm-rgb),.55),var(--y-warm));
}

.locked-tip{
  margin-top:9px;padding:0;background:transparent;border:none;
  font-size:13px;line-height:1.7;color:var(--y-text-muted);
}

@media (max-width:520px){
  .sub-tabs{gap:18px}
  .card-acts{gap:16px}
}
</style>
</head>
<body>
<div class="ambient-stage" id="ambientStage"></div>

<div class="wrap">
  <div class="top">
    <a class="brand" href="home.html">
      <div class="moon"><svg class="y-ico-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></div>
      <div class="name">夜息</div>
    </a>
    <a href="diy.html" class="pill-link">去调一段</a>
  </div>

  <header class="page-hero">
    <div class="profile-head">
      <div class="avatar-lg" id="profileAvatar">☾</div>
      <div class="profile-id">
        <h1 id="profileName">深夜旅人</h1>
        <p class="profile-bio" id="profileBio"></p>
      </div>
      <div class="profile-acts">
        <button type="button" class="ph-act" id="editProfileBtn" style="display:none">编辑资料</button>
        <a class="ph-act" href="diy.html">+ 新调一段</a>
      </div>
    </div>

    <div class="profile-meta">
      <span><b id="statOriginal">0</b>原创</span><i>·</i>
      <span><b id="statStars">0</b>被借走</span><i>·</i>
      <span><b id="statForks">0</b>被改编</span>
    </div>

    <p class="profile-caption" id="profileSub">正在同步你的夜息档案…</p>

    <p class="guest-line" id="guestBanner" style="display:none">数据只存在这台机器的浏览器里 · <a href="auth.html?from=me.html">登录后跨设备同步</a></p>

    <div class="ent-box" id="entBox">
      <div class="ent-main">
        <div class="ent-title" id="entTitle">正在读取权益…</div>
        <div class="ent-desc" id="entDesc"></div>
      </div>
      <button class="ent-btn" id="entBtn" type="button" style="display:none">解锁全库</button>
    </div>
  </header>

  <!-- 编辑资料弹窗 -->
  <div class="pf-mask" id="pfMask" role="dialog" aria-modal="true" aria-labelledby="pfTitle">
    <div class="pf-card">
      <div class="pf-head">
        <h3 id="pfTitle">编辑我的资料</h3>
        <button type="button" class="pf-close" id="pfCloseBtn" aria-label="关闭">×</button>
      </div>

      <div class="pf-preview">
        <div class="avatar-lg" id="pfPreviewAvatar">☾</div>
        <div class="pf-preview-tip">头像从下面的夜空符号里挑一个，<br>不用上传照片，别人也看不到你的真实样子。</div>
      </div>

      <label class="pf-label" for="pfName">昵称</label>
      <input type="text" class="y-input" id="pfName" maxlength="16" placeholder="想让人怎么称呼你">
      <p class="pf-preview-tip" style="margin-top:6px">不填就用登录名。</p>

      <label class="pf-label" for="pfBio">一句话简介（选填）</label>
      <input type="text" class="y-input" id="pfBio" maxlength="40" placeholder="比如：只在雨夜出没">

      <label class="pf-label">选一个头像</label>
      <div class="pf-glyphs" id="pfGlyphs"></div>

      <label class="pf-label">配色</label>
      <div class="pf-tones" id="pfTones"></div>

      <div class="pf-actions">
        <button type="button" class="y-btn-primary" id="pfSaveBtn">保存</button>
        <button type="button" class="y-btn-ghost" id="pfRandomBtn">随机一个</button>
        <button type="button" class="y-btn-ghost" id="pfCancelBtn">取消</button>
      </div>
      <div class="pf-msg" id="pfMsg"></div>
    </div>
  </div>

  <nav class="sub-tabs" id="subTabs" style="display:none">
    <button type="button" class="sub-tab sel" data-tab="mine">我的配方</button>
    <button type="button" class="sub-tab" data-tab="borrowed">借来的夜晚</button>
    <button type="button" class="sub-tab" data-tab="ear">耳朵档案</button>
  </nav>

  <!-- 首层：分类入口矩阵，像音乐App的「我的」 -->
  <div id="libraryHome">
    <div class="lib-entry-grid" id="libEntryGrid"></div>
  </div>

  <!-- 点分类后进入的独立列表视图 -->
  <div class="list-view" id="listView">

function readLocalJson(key, fallback) {
  try {
    var raw = localStorage.getItem(key);
    if (!raw) return fallback;
    var parsed = JSON.parse(raw);
    return parsed !== null && typeof parsed !== "undefined" ? parsed : fallback;
  } catch (e) {
    return fallback;
  }
}

function writeLocalJson(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) {}
}

function formatPanShort(pan) {
  var p = parseFloat(pan) || 0;
  var pct = Math.round(Math.abs(p) * 100);
  if (pct < 5) return "正中";
  return (p < 0 ? "左" : "右") + pct + "%";
}

function formatParamPills(items) {
  var html = "";
  for (var i = 0; i < (items || []).length; i++) {
    var it = items[i];
    var m = ySoundMeta(it.path);
    var txt = m.name + " " + Math.round((it.weight || 0) * 100) + "% · " + formatPanShort(it.pan);
    if (it.mode === "intermittent") {
      txt += " · 偶发";
    }
    html += '<span class="param-pill">' + yEscape(txt) + '</span>';
  }
  return html;
}

function stopPlaying() {
  if (activeAudio) {
    activeAudio.pause();
    activeAudio = null;
  }
  if (activePlayId) {
    var oldBtn = document.getElementById("play_" + activePlayId);
    if (oldBtn) oldBtn.textContent = "试听";
    activePlayId = "";
  }
}

function playRecipe(playKey, opts) {
  var msgEl = document.getElementById("msg_" + playKey);
  var btnEl = document.getElementById("play_" + playKey);
  if (activePlayId === playKey && activeAudio) {
    stopPlaying();
    if (msgEl) msgEl.textContent = "已暂停";
    ySetAmbient(opts.img || "img/night-lake-stars.jpg", opts.accent || "#8e74e8", false);
    return;
  }
  stopPlaying();
  if (msgEl) msgEl.textContent = "正在准备声音…";

  var body = { title: opts.title || "夜息", seconds: 60 };
  if (opts.usePostId) {
    body.post_id = opts.postId;
  } else {
    body.items = opts.items || [];
  }

  yPost("/api/play", body)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d || d.error) {
        if (msgEl) msgEl.textContent = (d && d.error) || "播放失败";
        return;
      }
      if (!sharedMeAudio) {
        sharedMeAudio = new Audio();
        sharedMeAudio.loop = true;
      }
      sharedMeAudio.src = API + d.audio;
      activeAudio = sharedMeAudio;
      if (typeof yBindAmbientAudio === "function") yBindAmbientAudio(activeAudio);
      activePlayId = playKey;
      if (btnEl) btnEl.textContent = "暂停";
      activeAudio.play().catch(function() {});
      ySetAmbient(opts.img || "img/night-lake-stars.jpg", opts.accent || "#8e74e8", true);
      if (msgEl) msgEl.textContent = "正在循环播放「" + (opts.title || "夜息") + "」";
    })
    .catch(function(e) {
      if (msgEl) msgEl.textContent = "连接失败：" + e.message;
    });
}

function openInDiy(recipe, asRemix) {
  if (recipe && Array.isArray(recipe.segments) && recipe.segments.length > 0) {
    try {
      sessionStorage.setItem("yexi_open_stitch", JSON.stringify({
        title: recipe.title || "夜息拼接",
        segments: recipe.segments
      }));
    } catch (e) {}
    location.href = "diy.html?pane=stitch";
    return;
  }
  var items = recipe.items || recipe.tracks || [];
  var code = yEncodeMix({ title: recipe.title || "夜息声景", tracks: items });
  if (!code) {
    location.href = "diy.html";
    return;
  }
  if (asRemix && recipe.id) {
    var qs = "?remix_id=" + encodeURIComponent(recipe.id) +
      "&remix_title=" + encodeURIComponent(recipe.title || "") +
      "&remix_author=" + encodeURIComponent(recipe.author || "夜息");
    location.href = "diy.html" + qs + "#mix=" + encodeURIComponent(code);
  } else {
    location.href = "diy.html#mix=" + encodeURIComponent(code);
  }
}

// 头像：12 个夜空符号 × 6 种配色，不用上传照片
var AVATAR_GLYPHS = ["☾", "✦", "☁", "☂", "❄", "♪", "✧", "◐", "▲", "≈", "✿", "☽"];
var AVATAR_TONES = [
  "rgba(142,116,232,.30)",
  "rgba(95,168,150,.30)",
  "rgba(88,137,214,.30)",
  "rgba(212,151,110,.30)",
  "rgba(155,133,214,.30)",
  "rgba(120,160,120,.30)"
];

function applyAvatarEl(el, glyphIdx, toneIdx) {
  if (!el) return;
  var g = parseInt(glyphIdx, 10);
  var t = parseInt(toneIdx, 10);
  if (isNaN(g) || g < 0 || g >= AVATAR_GLYPHS.length) g = 0;
  if (isNaN(t) || t < 0 || t >= AVATAR_TONES.length) t = 0;
  el.textContent = AVATAR_GLYPHS[g];
  el.style.background = AVATAR_TONES[t];
}

// 编辑弹窗的临时状态
var pfGlyph = 0;
var pfTone = 0;

function renderPfGlyphs() {
  var box = document.getElementById("pfGlyphs");
  var html = "";
  for (var i = 0; i < AVATAR_GLYPHS.length; i++) {
    html += '<button type="button" class="pf-glyph' + (i === pfGlyph ? " on" : "") +
      '" data-g="' + i + '">' + AVATAR_GLYPHS[i] + '</button>';
  }
  box.innerHTML = html;
  var btns = box.querySelectorAll(".pf-glyph");
  for (var k = 0; k < btns.length; k++) {
    btns[k].onclick = function() {
      pfGlyph = parseInt(this.getAttribute("data-g"), 10) || 0;
      renderPfGlyphs();
      applyAvatarEl(document.getElementById("pfPreviewAvatar"), pfGlyph, pfTone);
    };
  }
}

function renderPfTones() {
  var box = document.getElementById("pfTones");
  var html = "";
  for (var i = 0; i < AVATAR_TONES.length; i++) {
    html += '<button type="button" class="pf-tone' + (i === pfTone ? " on" : "") +
      '" data-t="' + i + '" style="background:' + AVATAR_TONES[i] + '"></button>';
  }
  box.innerHTML = html;
  var btns = box.querySelectorAll(".pf-tone");
  for (var k = 0; k < btns.length; k++) {
    btns[k].onclick = function() {
      pfTone = parseInt(this.getAttribute("data-t"), 10) || 0;
      renderPfTones();
      applyAvatarEl(document.getElementById("pfPreviewAvatar"), pfGlyph, pfTone);
    };
  }
}

function setPfMsg(msg, isErr) {
  var el = document.getElementById("pfMsg");
  el.textContent = msg || "";
  el.className = "pf-msg" + (isErr ? " err" : "");
}

function openProfileEditor() {
  if (!(hubData && hubData.logged_in)) return;
  var prof = hubData.profile || {};
  pfGlyph = parseInt(prof.avatar_glyph, 10) || 0;
  pfTone = parseInt(prof.avatar_tone, 10) || 0;
  document.getElementById("pfName").value = prof.display_name || "";
  document.getElementById("pfBio").value = prof.bio || "";
  renderPfGlyphs();
  renderPfTones();
  applyAvatarEl(document.getElementById("pfPreviewAvatar"), pfGlyph, pfTone);
  setPfMsg("", false);
  document.getElementById("pfMask").classList.add("open");
}

function closeProfileEditor() {
  document.getElementById("pfMask").classList.remove("open");
}

function saveProfile() {
  var name = document.getElementById("pfName").value.trim();
  var bio = document.getElementById("pfBio").value.trim();
  var btn = document.getElementById("pfSaveBtn");
  btn.disabled = true;
  setPfMsg("正在保存…", false);
  yPost("/api/profile/update", {
    display_name: name,
    bio: bio,
    avatar_glyph: pfGlyph,
    avatar_tone: pfTone
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    btn.disabled = false;
    if (!d || !d.ok) {
      setPfMsg((d && d.error) || "保存失败", true);
      return;
    }
    closeProfileEditor();
    loadHub();
  })
  .catch(function() {
    btn.disabled = false;
    setPfMsg("连接失败，请稍后再试", true);
  });
}

document.getElementById("pfCloseBtn").onclick = closeProfileEditor;
document.getElementById("pfCancelBtn").onclick = closeProfileEditor;
document.getElementById("pfMask").onclick = function(e) {

document.getElementById("pfSaveBtn").onclick = saveProfile;

function renderProfileHeader() {

  if (aiRecipes.length === 0) {
    html +=
      '<div class="empty-guide">' +
        '<span class="empty-guide-ico">✦</span>' +
        '<div class="empty-guide-title">还没有收藏 AI 配的声音</div>' +
        '<p class="empty-guide-sub">在 AI 配声里听到满意的那版，点「收藏配方」就会存到这里，随时回来听或接着改</p>' +
        '<div class="empty-guide-acts">' +
          '<a class="empty-guide-primary" href="agent.html">去 AI 配一段 →</a>' +
        '</div>' +
      '</div>';
  } else {
    for (var ai = 0; ai < aiRecipes.length; ai++) {
      (function(a) {
        var aiKey = "ai_" + a.key;
        html +=
          '<div class="glass item-card">' +
            '<div class="item-head">' +
              '<div class="item-main">' +
                '<div class="item-title-row">' +
                  '<span class="item-title">' + yEscape(a.title || "AI 配的一段夜色") + '</span>' +
                  '<span class="badge-pill soft">AI 配声</span>' +
                '</div>' +
                (a.say && a.say !== a.title ? '<div class="item-story">' + yEscape(a.say) + '</div>' : '') +
                '<div class="param-row">' + formatParamPills(a.items) + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="card-acts">' +
              '<button type="button" class="y-btn-ghost" id="play_' + aiKey + '">' + (activePlayId === aiKey ? "暂停" : "试听") + '</button>' +
              '<button type="button" class="y-btn-primary" id="diy_' + aiKey + '">去工坊接着改</button>' +
              '<button type="button" class="btn-danger-ghost" id="del_' + aiKey + '">删除</button>' +
            '</div>' +
            '<div class="item-msg" id="msg_' + aiKey + '"></div>' +
          '</div>';
      })(aiRecipes[ai]);
    }
  }

  container.innerHTML = html;

  // AI 收藏的交互绑定
  for (var a2 = 0; a2 < aiRecipes.length; a2++) {
    (function(a) {
      var aiKey = "ai_" + a.key;
      var lead = ySoundMeta(a.items && a.items.length ? a.items[0].path : "");
      document.getElementById("play_" + aiKey).onclick = function() {
        playRecipe(aiKey, { title: a.title, items: a.items, img: lead.img, accent: lead.accent });
      };
      document.getElementById("diy_" + aiKey).onclick = function() {
        openInDiy({ title: a.title, items: a.items, id: "" }, false);
      };
      document.getElementById("del_" + aiKey).onclick = function() {
        var msgEl = document.getElementById("msg_" + aiKey);
        if (msgEl) msgEl.textContent = "正在删除…";
        yPost("/api/good_recipes/delete", { key: a.key })
          .then(function(r) { return r.json(); })
          .then(function(d) {
            if (d && d.ok) loadHub();
            else if (msgEl) msgEl.textContent = (d && d.error) || "删除失败";
          })
          .catch(function() { if (msgEl) msgEl.textContent = "删除失败，请稍后再试"; });
      };
    })(aiRecipes[a2]);
  }

  for (var pi = 0; pi < myPosts.length; pi++) {
    (function(p) {
      var pKey = "post_" + p.id;
      document.getElementById("play_" + pKey).onclick = function() {
        var lead = ySoundMeta(p.lead_path || (p.items && p.items[0] ? p.items[0].path : ""));
        playRecipe(pKey, { title: p.title, items: p.items, img: lead.img, accent: lead.accent });
      };
      document.getElementById("diy_" + pKey).onclick = function() {
        openInDiy(p, false);
      };
      document.getElementById("del_" + pKey).onclick = function() {
        var tokens = readLocalJson(POST_TOKENS_KEY, {});
        yPost("/api/community_posts/delete", { id: p.id, delete_token: tokens[p.id] || "" })
          .then(function(r) { return r.json(); })
          .then(function(d) {
            if (d && d.ok) loadHub();
          }).catch(function() {});
      };
    })(myPosts[pi]);
  }

  var polBtns = container.querySelectorAll(".policy-opt");
  for (var bi = 0; bi < polBtns.length; bi++) {
    polBtns[bi].onclick = function() {
      var pid = this.getAttribute("data-pid");
      var pol = this.getAttribute("data-pol");
      var msgEl = document.getElementById("msg_post_" + pid);
      if (msgEl) msgEl.textContent = "正在更新许可…";
      yPost("/api/community_posts/policy", { id: pid, remix_policy: pol })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (!d || !d.ok) {
            if (msgEl) msgEl.textContent = (d && d.error) || "更新失败";
            return;
          }
          loadHub();
        })
        .catch(function() {
          if (msgEl) msgEl.textContent = "更新失败，请稍后重试";
        });
    };
  }

  for (var di2 = 0; di2 < customs.length; di2++) {
    (function(c) {
      var dKey = "draft_" + c.id;
      var cTracks = c.tracks || c.items || [];
      var cLead = ySoundMeta(cTracks.length ? cTracks[0].path : "");
      document.getElementById("play_" + dKey).onclick = function() {
        playRecipe(dKey, { title: c.title, items: cTracks, img: cLead.img, accent: cLead.accent });
      };
      document.getElementById("diy_" + dKey).onclick = function() {
        openInDiy(c, false);
      };
      document.getElementById("del_" + dKey).onclick = function() {
        yPost("/api/recipes/delete", { id: c.id })
          .then(function(r) { return r.json(); })
          .then(function() { loadHub(); })
          .catch(function() {
            var local = readLocalJson(LOCAL_WORKS_KEY, []);
            var next = [];
            for (var k = 0; k < local.length; k++) {
              if (local[k].id !== c.id) next.push(local[k]);
            }
            writeLocalJson(LOCAL_WORKS_KEY, next);
            loadHub();
          });
      };
    })(customs[di2]);
  }
}

function renderBorrowedTab(container) {
  var list = [];
  var seen = {};
  var starredPosts = (hubData && hubData.starred_posts) ? hubData.starred_posts : [];
  for (var i = 0; i < starredPosts.length; i++) {
    var sp = starredPosts[i];
    seen[sp.id] = true;
    list.push({ kind: "post", data: sp });
  }
  var builtinIds = (hubData && hubData.starred_builtin_ids) ? hubData.starred_builtin_ids : [];
  for (var j = 0; j < builtinIds.length; j++) {
    var bid = builtinIds[j];
    if (BUILTIN_RECIPES[bid] && !seen[bid]) {
      seen[bid] = true;
      list.push({ kind: "builtin", data: BUILTIN_RECIPES[bid] });
    }
  }
  var localVoted = readLocalJson(VOTED_KEY, {});
  for (var vk in localVoted) {
    if (!localVoted[vk]) continue;
    var parts = vk.split(":");
    if (parts.length === 2 && parts[1] === "borrow") {
      var rid = parts[0];
      if (BUILTIN_RECIPES[rid] && !seen[rid]) {
        seen[rid] = true;
        list.push({ kind: "builtin", data: BUILTIN_RECIPES[rid] });
      }
    }
  }

  var html = '<div class="sec-title"><span>借来的夜晚</span><span>' + list.length + ' 张</span></div>';
  if (list.length === 0) {
    html += '<div class="glass empty-card">还没有借过配方 · 去 <a href="community.html" style="color:#d9c4ff">配方广场</a> 点一下「借我一晚」，就会安静收在这里</div>';
    container.innerHTML = html;
    return;
  }

  for (var k = 0; k < list.length; k++) {
    var entry = list[k];
    var r = entry.data;
    var isBuiltin = entry.kind === "builtin";
    var lead = isBuiltin
      ? { img: r.img, accent: r.accent }
      : ySoundMeta(r.lead_path || (r.items && r.items[0] ? r.items[0].path : ""));
    var policy = r.remix_policy || "star_to_fork";
    var canRemix = isBuiltin || (r.unlocked && policy !== "listen_only");
    var paramHtml = (!isBuiltin && r.items_locked)
      ? '<div class="locked-tip">作者设为「' + yEscape(POLICY_LABELS[policy] || "仅限聆听") + '」· 可直接整段循环播放</div>'
      : '<div class="param-row">' + formatParamPills(r.items) + '</div>';

    html +=
      '<div class="glass item-card">' +
        '<div class="item-head">' +
          '<div class="item-main">' +
            '<div class="item-title-row">' +
              '<span class="item-title">' + yEscape(r.title) + '</span>' +
              '<span class="badge-pill soft">by ' + yEscape(r.author || "夜息") + '</span>' +
              (!isBuiltin ? '<span class="badge-pill">' + yEscape(POLICY_LABELS[policy] || "完全公开") + '</span>' : '') +
            '</div>' +
            (r.story ? '<div class="item-story">' + yEscape(r.story) + '</div>' : '') +
            paramHtml +
          '</div>' +
        '</div>' +
        '<div class="card-acts">' +
          '<button type="button" class="y-btn-ghost" id="play_star_' + yEscape(r.id) + '">' + (activePlayId === ("star_" + r.id) ? "暂停" : "试听") + '</button>' +
          (canRemix ? '<button type="button" class="y-btn-primary" id="remix_star_' + yEscape(r.id) + '">↻ Remix 微调</button>' : '') +
          '<button type="button" class="btn-danger-ghost" id="unstar_' + yEscape(r.id) + '">移出夜藏</button>' +
        '</div>' +
        '<div class="item-msg" id="msg_star_' + yEscape(r.id) + '"></div>' +
      '</div>';
  }
  container.innerHTML = html;

  for (var m = 0; m < list.length; m++) {
    (function(entry) {
      var r = entry.data;
      var isBuiltin = entry.kind === "builtin";
      var lead = isBuiltin
        ? { img: r.img, accent: r.accent }
        : ySoundMeta(r.lead_path || (r.items && r.items[0] ? r.items[0].path : ""));
      var key = "star_" + r.id;

      document.getElementById("play_" + key).onclick = function() {
        playRecipe(key, {
          title: r.title,
          postId: r.id,
          usePostId: !isBuiltin && r.items_locked,
          items: r.items,
          img: lead.img,
          accent: lead.accent
        });
      };

      var rmxBtn = document.getElementById("remix_" + key);
      if (rmxBtn) {
        rmxBtn.onclick = function() {
          openInDiy(r, true);
        };
      }

      document.getElementById("unstar_" + key).onclick = function() {
        if (yNeedLogin("给广场的配方投票", "me.html")) return;
        var voted = readLocalJson(VOTED_KEY, {});
        delete voted[r.id + ":borrow"];
        writeLocalJson(VOTED_KEY, voted);
        yPost("/api/community_vote", { recipe_id: r.id, tag: "borrow", delta: -1 })
          .then(function() { loadHub(); })
          .catch(function() { loadHub(); });
      };
    })(list[m]);
  }
}

      '<div class="card-acts">' +
        '<a class="y-btn-primary" href="ear_test.html">开启听觉图鉴（5 组盲测）</a>' +
      '</div>';
  }
  html += '</div>';

  var prefKeys = Object.keys(prefs);
  html += '<div class="glass ear-card">';
  html += '<div class="item-title" style="margin-bottom:6px">AI 记住的日常听感</div>';
  html += '<div class="item-meta" style="margin-bottom:10px">已验证满意配方 ' + (mem.good_count || 0) + ' 次 · 避坑反馈 ' + (mem.bad_count || 0) + ' 次</div>';
  if (prefKeys.length === 0) {
    html += '<div class="item-story" style="margin-top:0">多去「AI 配声」听几轮并点「就这个」，夜息就会慢慢认出你的耳朵。</div>';
  } else {
    html += '<div class="param-row">';
    for (var j = 0; j < prefKeys.length; j++) {
      var k = prefKeys[j];
      var lbl = PREF_LABELS[k] || k;
      html += '<span class="param-pill">' + yEscape(lbl) + ' × ' + prefs[k] + '</span>';
    }
    html += '</div>';
  }
  html += '</div>';
  container.innerHTML = html;
}

function renderActiveTab() {
  var box = document.getElementById("tabContent");
  if (currentTab === "mine") {
    renderMineTab(box);
  } else if (currentTab === "borrowed") {
    renderBorrowedTab(box);
  } else {
    renderEarTab(box);
  }
  wireTonightButtons();
}

/* 「听我保存的」闭环：把列表里的「试听」改成「今晚听这个」——
   点了写入 sessionStorage，跳回首页自动播放，不用再点第二次。 */
function wireTonightButtons() {
  var box = document.getElementById("tabContent");
  if (!box) return;
  var d = hubData || {};

  // 把当前分类下的配方整理成统一结构，按按钮 id 匹配
  var map = {};
  function add(key, title, items, img, accent) {
    if (key && items && items.length) map[key] = { title: title || "夜息", items: items, img: img || "", accent: accent || "" };
  }

  if (currentTab === "mine") {
    var posts = d.my_posts || [];
    for (var i = 0; i < posts.length; i++) {
      var p = posts[i];
      var leadP = ySoundMeta(p.lead_path || (p.items && p.items[0] ? p.items[0].path : ""));
      add("post_" + p.id, p.title, p.items, p.img || leadP.img, p.accent || leadP.accent);
    }
    var customs = d.custom_recipes || readLocalJson(LOCAL_WORKS_KEY, []);
    for (var j = 0; j < customs.length; j++) {
      var c = customs[j];
      var itemsC = c.tracks || c.items || [];
      var leadC = ySoundMeta(itemsC.length ? itemsC[0].path : "");
      add("draft_" + c.id, c.title, itemsC, c.img || leadC.img, c.accent || leadC.accent);
    }
    var ais = d.ai_recipes || [];
    for (var a = 0; a < ais.length; a++) {
      var rec = ais[a];
      var leadA = ySoundMeta(rec.items && rec.items.length ? rec.items[0].path : "");
      add("ai_" + rec.key, rec.title, rec.items, rec.img || leadA.img, rec.accent || leadA.accent);
    }
  } else if (currentTab === "borrowed") {
    var stars = d.starred_posts || [];
    for (var s = 0; s < stars.length; s++) {
      var r = stars[s];
      var leadS = ySoundMeta(r.lead_path || (r.items && r.items[0] ? r.items[0].path : ""));
      add("star_" + r.id, r.title, r.items, r.img || leadS.img, r.accent || leadS.accent);
    }
    // 内置收藏：数据在 BUILTIN_RECIPES，不在 starred_posts 里
    var bids = d.starred_builtin_ids || [];
    for (var bi = 0; bi < bids.length; bi++) {
      var br = BUILTIN_RECIPES[bids[bi]];
      if (br) add("star_" + bids[bi], br.title, br.items, br.img, br.accent);
    }
    // 游客态本地点过「借我一晚」的：从 RECIPES 里找
    var localVoted = readLocalJson(VOTED_KEY, {});
    for (var vk in localVoted) {
      if (!localVoted[vk] || vk.indexOf(":borrow") < 0) continue;
      var vid = vk.split(":")[0];
      var lr = BUILTIN_RECIPES[vid];
      if (lr && !map["star_" + vid]) add("star_" + vid, lr.title, lr.items, lr.img, lr.accent);
    }
  }

  var btns = box.querySelectorAll('[id^="play_"]');
  for (var b = 0; b < btns.length; b++) {
    (function(btn) {
      var key = btn.id.replace(/^play_/, "");
      var data = map[key];
      if (!data) return;                       // 没有配方数据的按钮（如普通试听）保持原样
      btn.textContent = "今晚听这个 ›";
      btn.onclick = function() {
        try {
          sessionStorage.setItem("yezi_play", JSON.stringify({
            fromSaved: true,
            key: key,
            title: data.title,
            items: data.items,
            img: data.img,
            accent: data.accent
          }));
        } catch (e) {}
        location.href = "home.html";
      };
    })(btns[b]);
  }
}

var subTabs = document.querySelectorAll("#subTabs .sub-tab");
for (var si = 0; si < subTabs.length; si++) {

    currentTab = this.getAttribute("data-tab") || "mine";

function renderLibraryHome() {

  html += '<button type="button" class="lib-entry" data-key="create">' +
    '<span class="le-ico"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>' +

function openListView(key) {
  var view = document.getElementById("listView");
  var home = document.getElementById("libraryHome");
  var title = document.getElementById("listViewTitle");
  if (!view || !home) return;
  home.style.display = "none";
  view.classList.add("open");
  currentTab = key;
  for (var k = 0; k < subTabs.length; k++) {
    subTabs[k].classList.toggle("sel", subTabs[k].getAttribute("data-tab") === key);
  }
  var names = { mine: "我喜欢的", borrowed: "借来的夜晚", ear: "耳朵档案" };
  title.textContent = names[key] || "我的";
  renderActiveTab();
  location.hash = key;
  window.scrollTo(0, 0);
}

function closeListView() {
  var view = document.getElementById("listView");
  var home = document.getElementById("libraryHome");
  if (!view || !home) return;
  view.classList.remove("open");
  home.style.display = "block";
  location.hash = "";
  renderLibraryHome();
  window.scrollTo(0, 0);
}

var listBack = document.getElementById("listBackBtn");
if (listBack) listBack.onclick = closeListView;
// 支持从首页用 me.html#mine 直接进列表
window.addEventListener("hashchange", function() {
  var h = (location.hash || "").replace("#", "");
  if (h === "mine" || h === "borrowed" || h === "ear") openListView(h);
  else if (!h && document.getElementById("listView").classList.contains("open")) closeListView();
});

function loadHub() {
  yGet("/api/me/hub")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      hubData = d || {};
      renderProfileHeader();
      renderLibraryHome();
      // 有 #mine/#borrowed/#ear 就直接进对应列表，否则停在分类首页
      var h = (location.hash || "").replace("#", "");
      if (h === "mine" || h === "borrowed" || h === "ear") openListView(h);
      else renderActiveTab();
      // 支持用 #edit 直接打开编辑资料（方便从别处跳过来改）
      if (location.hash === "#edit" && hubData.logged_in) openProfileEditor();
    })
    .catch(function() {
      hubData = {
        logged_in: false,
        stats: { original_count: 0, fork_count: 0, total_stars_received: 0, total_forks_received: 0 },
        my_posts: [],
        starred_posts: [],
        starred_builtin_ids: [],
        custom_recipes: readLocalJson(LOCAL_WORKS_KEY, []),
        ai_recipes: [],
        ear_profile: readLocalJson(EAR_PROFILE_KEY, null),
        memory: {}
      };
      renderProfileHeader();
      renderLibraryHome();
      renderActiveTab();
    });
}

function formatExpire(ts) {
  var d = new Date(ts * 1000);
  return d.getFullYear() + "-" +
    ("0" + (d.getMonth() + 1)).slice(-2) + "-" +
    ("0" + d.getDate()).slice(-2);
}

function loadEntitlement() {
  var titleEl = document.getElementById("entTitle");
  var descEl = document.getElementById("entDesc");
  var btnEl = document.getElementById("entBtn");

  btnEl.onclick = function() { yexiPayWall("trial3"); };

  if (!yToken()) {
    titleEl.textContent = "游客模式 · 每天可生成 2 次";
    descEl.textContent = "登录后跨设备同步，解锁全库可用全部素材。";
    btnEl.style.display = "";
    return;
  }

  yGet("/api/entitlement").then(function(r) { return r.json(); }).then(function(d) {
    var ent = d.entitlements || {};
    var full = ent.full && ent.full.active;
    var commercial = ent.commercial && ent.commercial.active;
    if (full) {
      titleEl.textContent = commercial ? "全库永久 · 商用授权已开通" : "全库已解锁";
      var parts = [];
      if (full.expire_at) parts.push("有效期至 " + formatExpire(full.expire_at));
      else parts.push("永久有效");
      parts.push("全部素材可用");
      parts.push(full.quota > 0 ? "还可生成 " + full.quota + " 段" : "生成不限次");
      descEl.textContent = parts.join(" · ");
      btnEl.style.display = commercial ? "none" : "";
      if (!commercial) btnEl.textContent = "续期 / 商用";
    } else {
      titleEl.textContent = "免费版 · 每天 2 次生成";
      descEl.textContent = "当前可用 12 段素材。解锁后全库 41 段随便挑，生成不限次。";
      btnEl.style.display = "";
      btnEl.textContent = "解锁全库";
    }
  }).catch(function() {
    titleEl.textContent = "权益读取失败";
    descEl.textContent = "刷新页面重试，不影响已有权益。";
  });

  // 即刻收：再查一次支付宝托管的次数，有就显示出来
  yGet("/api/nowpay/quota").then(function(r) { return r.json(); }).then(function(q) {
    if (!q.available || !(q.remaining > 0)) return;
    titleEl.textContent = "已购 " + q.total + " 次 · 剩余 " + q.remaining + " 次";
    descEl.textContent = "3 段音频 + 全库 30 天已到账，出声才扣、追问不扣。";
    btnEl.style.display = "";
    btnEl.textContent = "再加次数";
  }).catch(function() {});
}

loadHub();
loadEntitlement();
</script>
</body>
</html>
