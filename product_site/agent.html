<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>夜息 · AI 配声</title>
<link rel="stylesheet" href="theme.css?v=12">
<style>
  .wrap-agent {
    position: relative;
    z-index: 1;
    max-width: 920px;
    margin: 0 auto;
    padding: 0 clamp(18px, 4vw, 32px) 132px;
    transition: opacity 0.8s var(--y-ease);
  }
  .wrap-agent.in-chat {
    padding-bottom: 220px;
  }

  @media (min-width: 720px) {
    .wrap-agent {
      padding-bottom: 72px;
    }
    .wrap-agent.in-chat {
      padding-bottom: 148px;
    }
    .designer-box {
      margin-top: 28px;
    }
  }

  /* 页头只留标题与状态：状态并到标题右侧，不单独占一行 */
  .ph-right {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  .agent-mem-tag {
    margin: 0;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: rgba(var(--y-warm-rgb), 0.82);
  }
  .agent-mem-tag:empty {
    display: none;
  }
  .new-chat-btn {
    display: none;
    background: none;
    border: none;
    border-radius: 0;
    padding: 0 0 3px;
    color: var(--y-text-muted);
    font-size: 13.5px;
    letter-spacing: 0.1em;
    cursor: pointer;
    font-family: inherit;
    border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    transition: color 0.5s ease, border-color 0.5s ease;
  }
  .new-chat-btn.show {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .new-chat-btn:hover {
    color: var(--y-text);
    background: none;
    border-bottom-color: rgba(var(--y-warm-rgb), 0.6);
  }

  /* 阶段一：夜色对话入口 —— 不装卡片，输入框自己浮在场景上 */
  .designer-box.hide {
    display: none;
  }
  /* 文字压在照片最亮的地方会发灰：垫一层没有边缘的墨，不是卡片 */
  .designer-box {
    position: relative;
  }
  .designer-box::before {
    content: "";
    position: absolute;
    left: -26px;
    right: -26px;
    top: -46px;
    bottom: -34px;
    background: radial-gradient(64% 74% at 34% 48%,
      rgba(7, 5, 13, 0.78) 0%,
      rgba(7, 5, 13, 0.52) 48%,
      rgba(7, 5, 13, 0) 82%);
    pointer-events: none;
    z-index: -1;
  }
  .designer-card {
    padding: 0;
    border: none;
    border-radius: 0;
    background: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    box-shadow: none;
  }
  .designer-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .designer-title {
    font-family: inherit;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.18em;
    color: var(--y-text-sub);
  }
  .designer-tools {
    display: flex;
    gap: 14px;
  }
  .tiny-btn {
    background: none;
    border: none;
    color: rgba(226, 216, 244, 0.5);
    border-radius: 0;
    padding: 0;
    font-size: 14px;
    letter-spacing: 0.1em;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.45s ease;
  }
  .tiny-btn:hover {
    color: var(--y-text-sub);
    background: none;
  }

  #promptDraft {
    min-height: 0;
    height: 38px;
    font-size: 19px;
    line-height: 1.6;
    padding: 0 0 8px;
    border: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 0;
    background: transparent;
    overflow: hidden;
  }
  #promptDraft::placeholder {
    color: rgba(236, 228, 248, 0.56);
  }
  #promptDraft:focus {
    background: transparent;
    box-shadow: none;
    border-bottom-color: rgba(var(--y-warm-rgb), 0.65);
  }

  .builder-rows {
    display: flex;
    flex-direction: column;
    gap: 11px;
    margin-top: 24px;
  }
  .builder-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  .builder-dim {
    width: 36px;
    flex: 0 0 36px;
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--y-text-sub);
  }
  .builder-chips {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
  }
  .dim-chip {
    background: none;
    border: none;
    border-radius: 0;
    padding: 0 0 2px;
    font-size: 13.5px;
    letter-spacing: 0.04em;
    color: rgba(236, 228, 248, 0.8);
    cursor: pointer;
    font-family: inherit;
    border-bottom: 1px solid transparent;
    transition: color 0.45s ease, border-color 0.45s ease;
  }
  .dim-chip:hover {
    background: none;
    color: var(--y-text);
  }
  .dim-chip.on {
    background: none;
    color: var(--y-warm);
    border-bottom-color: rgba(var(--y-warm-rgb), 0.55);
  }

  .designer-actions {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-top: 28px;
    flex-wrap: wrap;
  }
  .designer-actions .y-btn-primary {
    flex: 0 0 auto;
    min-width: 172px;
    padding: 12px 26px;
  }
  .designer-actions .y-btn-ghost {
    flex: 0 0 auto;
    min-width: 0;
    background: none;
    padding: 0 0 3px;
    color: var(--y-text-muted);
    font-size: 13.5px;
    letter-spacing: 0.08em;
    border-radius: 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.14);
  }
  .designer-actions .y-btn-ghost:hover {
    background: none;
    color: var(--y-text);
    border-bottom-color: rgba(var(--y-warm-rgb), 0.6);
  }

  .designer-err {
    margin-top: 8px;
    font-size: 13px;
    color: #ff9eb5;
    min-height: 16px;
  }
  .designer-err:empty {
    display: none;
  }

  /* 对话时间线 */
  .chat-stream {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg-user-wrap {
    display: flex;
    justify-content: flex-end;
  }
  .msg-user {
    max-width: 84%;
    padding: 11px 16px;
    border-radius: 18px 18px 6px 18px;
    background: linear-gradient(135deg, rgba(var(--y-warm-rgb), 0.24), rgba(32, 22, 46, 0.78));
    border: none;
    box-shadow: 0 10px 26px rgba(4, 2, 12, 0.3);
    color: #fbf7ff;
    font-size: 14.5px;
    line-height: 1.6;
  }

  /* 简洁思考状态气泡 */
  .msg-thinking {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    align-self: flex-start;
    padding: 10px 15px;
    border-radius: 18px 18px 18px 6px;
    background: rgba(14, 10, 24, 0.74);
    border: none;
    box-shadow: 0 10px 26px rgba(4, 2, 12, 0.34);
    font-size: 13.5px;
    color: var(--y-text-sub);
  }

  /* 阶段二：聚焦核心问题的 AI 追问卡片 */
  .msg-ask-box {
    padding: 20px;
    border-radius: 22px;
    background: rgba(14, 10, 24, 0.74);
    border: none;
    box-shadow: 0 18px 44px rgba(4, 2, 12, 0.42);
  }
  .collected-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .col-pill {
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
    border: none;
    background: rgba(142, 224, 197, 0.14);
    color: #cef7e8;
  }
  .ask-question {
    font-size: 15.5px;
    font-weight: 500;
    color: #fff;
    line-height: 1.5;
    margin-bottom: 13px;
  }
  .qa-options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }
  @media (min-width: 500px) {
    .qa-options {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  .qa-opt-item {
    display: flex;
    align-items: stretch;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.055);
    overflow: hidden;
    transition: background 0.35s ease, box-shadow 0.35s ease;
  }
  .qa-opt-item:hover {
    background: rgba(var(--y-warm-rgb), 0.14);
  }
  .qa-opt-item.previewing {
    background: rgba(var(--y-warm-rgb), 0.18);
    box-shadow: 0 0 0 1px rgba(var(--y-warm-rgb), 0.38) inset;
  }
  .qa-opt-item.picked-item {
    background: rgba(var(--y-warm-rgb), 0.22);
  }
  .qa-opt-item.locked-item {
    opacity: 0.45;
  }
  .qa-opt-item.locked-item.picked-item {
    opacity: 1;
  }
  .qa-opt-btn {
    flex: 1;
    min-width: 0;
    text-align: left;
    padding: 11px 13px;
    border-radius: 0;
    background: transparent;
    border: none;
    color: var(--y-text);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 3px;
    transition: color 0.3s ease;
  }
  .qa-opt-btn:disabled {
    cursor: default;
  }
  .qa-opt-btn.picked {
    color: #fff7eb;
  }
  .qa-opt-sub {
    font-size: 11.5px;
    color: var(--y-text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .qa-opt-item.previewing .qa-opt-sub {
    color: var(--y-warm);
  }
  .qa-opt-preview {
    flex: 0 0 44px;
    border: none;
    border-left: 1px solid rgba(255, 255, 255, 0.07);
    background: rgba(255, 255, 255, 0.03);
    color: var(--y-text-sub);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .qa-opt-preview:hover:not(:disabled) {
    background: rgba(var(--y-warm-rgb), 0.24);
    color: #fff7eb;
  }
  .qa-opt-preview.playing {
    background: rgba(var(--y-warm-rgb), 0.28);
    color: #fff7eb;
  }
  .qa-opt-preview:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .qa-skip-row {
    margin-top: 9px;
    display: flex;
    justify-content: flex-end;
  }
  .qa-skip-btn {
    background: transparent;
    border: none;
    color: #c8b6ee;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    padding: 3px 4px;
  }
  .qa-skip-btn:hover:not(:disabled) {
    color: #fff;
  }
  .qa-skip-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  /* 阶段三：声景版本卡居主位 + 折叠思考 */
  .msg-ai-wrap {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .ver-card {
    border-radius: 22px;
    overflow: hidden;
    background: var(--y-glass);
    border: none;
    box-shadow: 0 22px 54px rgba(4, 2, 12, 0.46);
    transition: box-shadow 0.8s ease;
  }
  .ver-card.is-playing-card {
    box-shadow: 0 22px 54px rgba(4, 2, 12, 0.54), 0 0 42px rgba(var(--y-warm-rgb), 0.2);
  }
  .ver-hero {
    position: relative;
    padding: 20px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    background-size: cover;
    background-position: center;
  }
  .ver-hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(10, 7, 18, 0.86), rgba(10, 7, 18, 0.68));
  }
  .ver-hero > * {
    position: relative;
    z-index: 1;
  }
  .ver-orb-wrap {
    position: relative;
    width: 50px;
    height: 50px;
    flex: 0 0 50px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ver-orb-ring {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px solid rgba(var(--y-warm-rgb), 0.45);
    opacity: 0.22;
    pointer-events: none;
  }
  .ver-card.is-playing-card .ver-orb-ring {
    opacity: 0.88;
    animation: yBreath 4.6s ease-in-out infinite;
  }
  .ver-play-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(255, 244, 228, 0.36);
    background:
      radial-gradient(circle at 38% 32%, rgba(255, 246, 232, 0.26), rgba(255, 255, 255, 0.04) 60%),
      rgba(20, 14, 30, 0.45);
    color: #fff8ee;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 22px rgba(var(--y-warm-rgb), 0.24);
  }
  .ver-head-meta {
    flex: 1;
    min-width: 0;
  }
  .ver-title-line {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }
  .ver-num {
    font-size: 12px;
    font-weight: 600;
    color: #1d120a;
    background: var(--y-warm);
    border-radius: 999px;
    padding: 1px 7px;
  }
  .ver-title {
    font-family: var(--y-serif);
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: #fff;
  }
  .ver-mode-badge {
    margin-left: auto;
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
    border: none;
    background: rgba(255, 255, 255, 0.08);
    color: #d6c9ef;
  }
  .ver-mode-badge.ai {
    background: rgba(142, 224, 197, 0.16);
    color: #cef7e8;
  }
  .ver-final-sub {
    margin-top: 4px;
    font-size: 13px;
    color: #ccefe2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ver-tracks {
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .ver-contains-head {
    font-size: 13px;
    color: #dfd1ff;
    padding: 2px 2px 4px;
    font-weight: 500;
  }
  .ver-track-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 11px;
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.04);
    border: none;
  }
  .vt-thumb {
    width: 38px;
    height: 38px;
    flex: 0 0 38px;
    border-radius: 10px;
  }
  .vt-layer {
    font-size: 12px;
    padding: 1px 6px;
    border-radius: 999px;
    border: 1px solid currentColor;
    flex: 0 0 auto;
    opacity: 0.9;
  }
  .vt-meta {
    flex: 1;
    min-width: 0;
  }
  .vt-name {
    font-size: 13.5px;
    color: #fff;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .vt-desc {
    font-size: 12.5px;
    color: var(--y-text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .vt-right {
    display: flex;
    align-items: center;
    gap: 7px;
    flex: 0 0 auto;
  }
  .vt-pos {
    font-size: 12px;
    color: #d6c2ff;
    white-space: nowrap;
  }
  .vt-bar-wrap {
    width: 42px;
    height: 5px;
    border-radius: 999px;
    background: rgba(218, 200, 255, 0.14);
    overflow: hidden;
  }
  .vt-bar-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(var(--y-warm-rgb), 0.72), var(--y-warm));
  }
  .vt-pct {
    font-size: 12.5px;
    color: var(--y-text-sub);
    min-width: 30px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .ver-reply-note {
    padding: 0 14px 10px;
    font-size: 13px;
    color: var(--y-text-sub);
    line-height: 1.5;
  }

  .ver-actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    padding: 2px 14px 12px;
  }
  .ver-act-btn {
    border: none;
    background: rgba(255, 255, 255, 0.06);
    color: #efe5ff;
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .ver-act-btn:hover {
    background: rgba(var(--y-accent-rgb), 0.24);
  }
  .ver-act-btn.on {
    background: rgba(142, 224, 197, 0.20);
    color: #d9fff1;
  }
  .ver-act-btn.primary {
    background: rgba(var(--y-accent-rgb), 0.28);
  }

  .followup-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .followup-strip .y-chip {
    font-size: 13px;
    padding: 5px 12px;
  }

  /* 底部悬浮操作区 */
  .agent-dock-fixed {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: calc(86px + env(safe-area-inset-bottom));
    max-width: 920px;
    margin: 0 auto;
    z-index: 38;
    display: flex;
    flex-direction: column;
    gap: 7px;
    pointer-events: none;
    transition: opacity 0.8s var(--y-ease);
  }
  @media (min-width: 720px) {
    .agent-dock-fixed {
      bottom: 18px;
    }
  }
  .agent-dock-fixed > * {
    pointer-events: auto;
  }
  .mini-bar {
    display: none;
    align-items: center;
    gap: 9px;
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(12, 9, 20, 0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: none;
    box-shadow: 0 14px 38px rgba(4, 2, 12, 0.48);
  }
  .mini-bar.show {
    display: flex;
  }
  .mini-play-btn {
    width: 30px;
    height: 30px;
    flex: 0 0 30px;
    border-radius: 50%;
    border: 1px solid rgba(var(--y-warm-rgb), 0.42);
    background: rgba(var(--y-warm-rgb), 0.16);
    color: #fff;
    font-size: 12.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mini-title {
    font-size: 13px;
    color: #fff;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 130px;
  }
  .mini-vol-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 60px;
  }
  .mini-vol-pct {
    font-size: 12px;
    color: var(--y-text-muted);
    min-width: 28px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .mini-tools {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 0 0 auto;
  }
  .mini-tools .hero-tool-btn {
    padding: 4px 9px;
    font-size: 12.5px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .chat-dock-box {
    display: none;
    padding: 6px;
    border-radius: 999px;
    background: rgba(16, 12, 28, 0.90);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: none;
    box-shadow: 0 14px 38px rgba(4, 2, 12, 0.48);
  }
  .chat-dock-box.show {
    display: block;
  }
  .chat-dock-box .ai-capsule {
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 2px 4px 2px 10px;
  }
  .chat-dock-status {
    font-size: 12.5px;
    color: #d6c2ff;
    padding: 2px 12px 3px;
    min-height: 16px;
  }
  .chat-dock-status.err {
    color: #ff9eb5;
  }
  .chat-dock-status:empty {
    display: none;
  }

  body.lights-out .wrap-agent,
  body.lights-out .agent-dock-fixed {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="ambient-stage" id="ambientStage"></div>

<div class="wrap-agent" id="wrapAgent">
  <div class="top">
    <a class="brand" href="home.html">
      <div class="moon"><svg class="y-ico-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></div>
      <div class="name">夜息</div>
    </a>
    <a class="pill-link" id="earBadgeLink" href="ear_test.html">听觉图鉴</a>
  </div>

  <header class="page-hero">
    <div class="ph-row">
      <h1>AI 配声</h1>
      <div class="ph-right">
        <p class="agent-mem-tag" id="profileHintTag"></p>
        <button type="button" class="new-chat-btn" id="newChatBtn">重来</button>
      </div>
    </div>
    <p class="ph-sub">说一句现在的状态，配一段今晚的声音。</p>
  </header>

  <!-- 阶段一：首屏主操作区（提示词设计台） -->

  <div class="lights-out-title" id="lightsOutTitle">夜息 AI 配声</div>

<script>
var API = YEXI_API;
initAuthBar("agent.html");
initYexiTabbar("agent.html");
initAmbientStage("img/night-lake-stars.jpg", "#e9b783");

var PROMPT_DIMS = [
  { label: "画面", chips: ["夜雨", "远海浪", "夏夜虫鸣", "山涧溪流"] },
  { label: "听感", chips: ["暖一点", "轻柔不吵", "雨打树叶", "清透干净"] },
  { label: "细节", chips: ["别打雷", "加点夜风", "偶尔点缀", "稳一点"] }
];

var RANDOM_DRAFTS = [
  "失眠睡不着，想要窗外夜雨",
  "好累想放空，想要远海浪",
  "深夜写东西，想要山涧溪流，清透干净",
  "想要夏夜虫鸣的感觉，轻柔不吵"
];

var COLLECTED_LABELS = [
  { key: "state", name: "状态" },
  { key: "scene", name: "画面" },
  { key: "texture", name: "听感" },
  { key: "spatial_rhythm", name: "节奏" },
  { key: "avoid", name: "避雷" }
];

var versions = [];
var chatHistory = [];
var initialPrompt = "";
var qaRound = 0;
var inConversation = false;
var activeVersionIdx = -1;
var isPlaying = false;
var isSending = false;
var masterVolume = 0.85;
var fadeFactor = 1.0;
var fallbackAudio = null;
var usingFallback = false;
var randDraftIdx = 0;

var TIMER_STEPS = [0, 15, 30, 60];
var timerStepIdx = 0;
var sleepTimerId = null;
var sleepEndAt = 0;

var wrapAgent = document.getElementById("wrapAgent");
var promptDesigner = document.getElementById("promptDesigner");
var promptDraft = document.getElementById("promptDraft");
var startQaBtn = document.getElementById("startQaBtn");
var skipQaBtn = document.getElementById("skipQaBtn");
var designerStatus = document.getElementById("designerStatus");
var chatDockBox = document.getElementById("chatDockBox");
var sayInput = document.getElementById("say");
var genBtn = document.getElementById("genBtn");
var statusEl = document.getElementById("status");
var chatStream = document.getElementById("chatStream");
var newChatBtn = document.getElementById("newChatBtn");
var miniBar = document.getElementById("miniBar");
var miniPlayBtn = document.getElementById("miniPlayBtn");
var miniTitle = document.getElementById("miniTitle");
var timerBtn = document.getElementById("timerBtn");

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

function setStatus(msg, isErr) {
  statusEl.textContent = msg || "";
  statusEl.className = "chat-dock-status" + (isErr ? " err" : "");
}

function formatPanLabel(pan) {
  var pct = Math.round(Math.abs(pan || 0) * 100);
  if (pct < 8) return "正中";
  return (pan < 0 ? "左 " : "右 ") + pct + "%";
}

function enrichTracks(items) {
  var out = [];
  for (var i = 0; i < (items || []).length; i++) {
    var it = items[i];
    if (!it || !it.path) continue;
    var base = String(it.path).split("/").pop().split("\\").pop();
    var w = parseFloat(it.weight);
    if (!base || isNaN(w) || w <= 0) continue;
    var m = ySoundMeta(base);
    out.push({
      path: base,
      weight: clamp(w, 0.08, 1.0),
      pan: typeof it.pan === "number" ? clamp(it.pan, -0.9, 0.9) : (m.defaultPan || 0),
      mode: it.mode === "intermittent" ? "intermittent" : (it.mode === "loop" ? "loop" : (m.defaultMode || "loop")),
      density: typeof it.density === "number" ? clamp(it.density, 0.15, 0.85) : (m.defaultDensity || 0.4),
      role_note: String(it.role_note || m.desc || "")
    });
  }
  return out;
}

// ===== 阶段一：3 行 12 词块拼装器 =====
function renderPromptBuilder() {
  var grid = document.getElementById("promptBuilderGrid");
  grid.innerHTML = "";
  for (var i = 0; i < PROMPT_DIMS.length; i++) {
    (function(dim) {
      var row = document.createElement("div");
      row.className = "builder-row";
      var label = document.createElement("div");
      label.className = "builder-dim";
      label.textContent = dim.label;
      var chips = document.createElement("div");
      chips.className = "builder-chips";

      for (var j = 0; j < dim.chips.length; j++) {
        (function(text) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "dim-chip";
          b.setAttribute("data-chip", text);
          b.textContent = text;
          b.onclick = function() { toggleDraftChip(text); };
          chips.appendChild(b);
        })(dim.chips[j]);
      }

      row.appendChild(label);
      row.appendChild(chips);
      grid.appendChild(row);
    })(PROMPT_DIMS[i]);
  }
}

function toggleDraftChip(chipText) {
  var val = promptDraft.value.trim();
  if (val.indexOf(chipText) !== -1) {
    var parts = val.split(/[，,；;]+/);
    var kept = [];
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i].trim();
      if (!p || p === chipText) continue;
      var cleaned = p.replace(chipText, "").replace(/^[，,\s]+|[，,\s]+$/g, "");
      if (cleaned) kept.push(cleaned);
    }
    promptDraft.value = kept.join("，");
  } else {
    promptDraft.value = val ? (val.replace(/[，,；;\s]+$/, "") + "，" + chipText) : chipText;
  }
  syncBuilderChipsFromDraft();
}

function autoGrowDraft() {
  promptDraft.style.height = "auto";
  promptDraft.style.height = promptDraft.scrollHeight + "px";
}

function syncBuilderChipsFromDraft() {
  var val = promptDraft.value;
  var chips = document.getElementById("promptBuilderGrid").querySelectorAll(".dim-chip");
  for (var i = 0; i < chips.length; i++) {
    var txt = chips[i].getAttribute("data-chip");
    chips[i].classList.toggle("on", val.indexOf(txt) !== -1);
  }
  autoGrowDraft();
}

promptDraft.addEventListener("input", syncBuilderChipsFromDraft);

document.getElementById("randomDraftBtn").onclick = function() {
  promptDraft.value = RANDOM_DRAFTS[randDraftIdx % RANDOM_DRAFTS.length];
  randDraftIdx += 1;
  syncBuilderChipsFromDraft();
};
document.getElementById("clearDraftBtn").onclick = function() {
  promptDraft.value = "";
  syncBuilderChipsFromDraft();
  promptDraft.focus();
};

// ===== Web Audio 分层引擎 =====
var mixer = null;
if (typeof YexiMixer !== "undefined" && YexiMixer.isSupported()) {
  mixer = new YexiMixer({
    apiBase: API,
    onError: function() {
      if (fallbackAudio && fallbackAudio.src && !usingFallback) {
        usingFallback = true;
        if (mixer) mixer.setPlaying(false);
        fallbackAudio.volume = clamp(masterVolume * fadeFactor, 0, 1);
        if (isPlaying) fallbackAudio.play().catch(function() {});
      }
    }
  });
}

function getActiveVersion() {
  if (activeVersionIdx >= 0 && activeVersionIdx < versions.length) {
    return versions[activeVersionIdx];
  }
  return null;
}

function syncEngine() {
  var ver = getActiveVersion();
  var effectiveVol = clamp(masterVolume * fadeFactor, 0, 1);
  if (usingFallback && fallbackAudio) {
    fallbackAudio.volume = effectiveVol;
    return;
  }
  if (mixer && ver) {
    mixer.setMasterVolume(effectiveVol);
    mixer.syncTracks(ver.tracks);
  }
}

function findLeadTrack(tracks) {
  if (!tracks || tracks.length === 0) return null;
  var best = tracks[0];
  for (var i = 1; i < tracks.length; i++) {
    if (tracks[i].weight > best.weight) best = tracks[i];
  }
  return best;
}

function updatePlaybackUI() {
  var ver = getActiveVersion();
  wrapAgent.classList.toggle("in-chat", inConversation);
  promptDesigner.classList.toggle("hide", inConversation);
  chatDockBox.classList.toggle("show", inConversation);
  newChatBtn.classList.toggle("show", inConversation);

  miniBar.classList.toggle("show", versions.length > 0);
  miniPlayBtn.textContent = isPlaying ? "❚❚" : "▶";

  if (ver) {
    miniTitle.textContent = "v" + ver.verNum + " · " + ver.title;
    document.getElementById("lightsOutTitle").textContent = ver.title;
    var lead = findLeadTrack(ver.tracks);
    if (lead) {
      var meta = ySoundMeta(lead.path);
      ySetAmbient("img/night-lake-stars.jpg", meta.accent, isPlaying);
    }
  } else {
    ySetAmbient("img/night-lake-stars.jpg", "#e9b783", false);
  }

  var cards = chatStream.querySelectorAll(".ver-card");
  for (var i = 0; i < cards.length; i++) {
    var idx = parseInt(cards[i].getAttribute("data-ver-idx"), 10);
    var activeNow = isPlaying && idx === activeVersionIdx;
    cards[i].classList.toggle("is-playing-card", activeNow);
    var pBtn = cards[i].querySelector(".ver-play-btn");
    if (pBtn) pBtn.textContent = activeNow ? "❚❚" : "▶";
  }

  if (versions.length > 0) {
    sayInput.placeholder = "哪里不合适？继续说就能改（如：太吵、加夜风、不要雷）";
    genBtn.textContent = "调整";
  } else {
    sayInput.placeholder = "可直接点选项，或自己打字回答…";
    genBtn.textContent = "回答";
  }
}

function updateMediaSession(ver) {
  if (!("mediaSession" in navigator) || !ver) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: ver.title,
      artist: "夜息 AI 配声",
      album: "AI 自然助眠"
    });
    navigator.mediaSession.setActionHandler("play", function() { playVersion(activeVersionIdx); });
    navigator.mediaSession.setActionHandler("pause", function() { pauseAll(); });
  } catch (e) {}
}

function pauseAll() {
  stopOptionPreview();
  isPlaying = false;
  if (mixer) mixer.setPlaying(false);
  if (fallbackAudio) fallbackAudio.pause();
  updatePlaybackUI();
}

function unlockAudioContexts() {
  try { if (mixer) mixer._ensureContext(); } catch (e) {}
  try { if (optPreviewMixer) optPreviewMixer._ensureContext(); } catch (e) {}
}
document.addEventListener("pointerdown", unlockAudioContexts, { once: true });
document.addEventListener("keydown", unlockAudioContexts, { once: true });

function playVersion(idx) {
  stopOptionPreview();
  unlockAudioContexts();
  if (idx < 0 || idx >= versions.length) return;
  var ver = versions[idx];
  if (activeVersionIdx === idx && isPlaying) {
    pauseAll();
    return;
  }

  activeVersionIdx = idx;
  usingFallback = false;
  if (fallbackAudio && fallbackAudio.src) {
    fallbackAudio.pause();
  }

  isPlaying = true;
  var effectiveVol = clamp(masterVolume * fadeFactor, 0, 1);

  if (mixer) {
    mixer.syncTracks(ver.tracks);
    mixer.setMasterVolume(effectiveVol);
    mixer.setPlaying(true);
    // 650ms 看门狗：若浏览器自动播放策略拦截导致 AudioContext 仍未运行，绝不假装在播静音，明确提示点 ▶
    var playCheckVerIdx = idx;
    setTimeout(function() {
      if (!isPlaying || activeVersionIdx !== playCheckVerIdx || !mixer || !mixer.ctx) return;
      if (mixer.ctx.state !== "running") {
        mixer.ctx.resume().catch(function() {});
        setTimeout(function() {
          if (isPlaying && activeVersionIdx === playCheckVerIdx && mixer && mixer.ctx && mixer.ctx.state !== "running") {
            isPlaying = false;
            mixer.setPlaying(false);
            updatePlaybackUI();
            setStatus("浏览器拦截了自动发声，点卡片上的 ▶ 即可播放", false);
          }
        }, 250);
      }
    }, 650);
  } else if (fallbackAudio && fallbackAudio.src) {
    usingFallback = true;
    fallbackAudio.volume = effectiveVol;
    fallbackAudio.play().catch(function() {
      isPlaying = false;
      updatePlaybackUI();
    });
  }

  updateMediaSession(ver);
  updatePlaybackUI();
}

// ===== 渲染精简对话与卡片 =====
function appendUserBubble(text) {
  var wrap = document.createElement("div");
  wrap.className = "msg-user-wrap";
  wrap.innerHTML = '<div class="msg-user">' + yEscape(text) + '</div>';
  chatStream.appendChild(wrap);
  wrap.scrollIntoView({ behavior: "smooth", block: "end" });
}

function createThinkingBubble(inQaPhase) {
  var el = document.createElement("div");
  el.className = "msg-thinking";
  el.innerHTML = '<span class="spin"></span><span>' + (inQaPhase ? "AI 正在看你的提示词…" : "AI 正在编排声景…") + '</span>';
  chatStream.appendChild(el);
  el.scrollIntoView({ behavior: "smooth", block: "end" });
  return {
    stop: function() {
      if (el && el.parentNode) el.parentNode.removeChild(el);
    }
  };
}

// ===== 追问选项即时试听（把抽象声音形容词变成点一下就能听的真实素材） =====
var optPreviewMixer = (typeof YexiMixer !== "undefined" && YexiMixer.isSupported())
  ? new YexiMixer({ apiBase: API })
  : null;
var optPreviewActiveBtn = null;
var optPreviewReqId = 0;

function stopOptionPreview() {
  optPreviewReqId += 1;
  if (optPreviewMixer) {
    optPreviewMixer.setPlaying(false);
    optPreviewMixer.syncTracks([]);
  }
  if (optPreviewActiveBtn) {
    optPreviewActiveBtn.classList.remove("playing");
    optPreviewActiveBtn.textContent = "▶";
    var oldItem = optPreviewActiveBtn.closest ? optPreviewActiveBtn.closest(".qa-opt-item") : optPreviewActiveBtn.parentNode;
    if (oldItem) oldItem.classList.remove("previewing");
    optPreviewActiveBtn = null;
  }
}

function resolveOptionPreviewTracks(optText, questionText) {
  var raw = String(optText || "").trim();
  if (!raw) return [];
  // 纯抽象控制项（不含具体声音）不强行配试听
  if (/^(纯净单层|纯近场触发就好|稀疏偶发|不用再加|按目前信息)/.test(raw)) {
    return [];
  }
  // 去掉否定词后面的声源，避免“别打雷”试听到雷声
  var pos = raw
    .replace(/(别|不要|不|无|没有)(打雷|雷声|雷|炉火|火|鸟鸣|鸟|虫鸣|虫|噼啪|雨)/g, "");
  var tracks = [];
  var seen = {};
  function add(path, w, mode) {
    if (!path || seen[path] || tracks.length >= 2) return;
    seen[path] = true;
    tracks.push({ path: path, weight: w || 0.72, pan: tracks.length === 0 ? 0 : 0.25, mode: mode || "loop", density: 0.45 });
  }

  // 1. 优先匹配具体声音质感与组合
  if (/帐篷/.test(pos)) add("帐篷雨_小帐篷大雨_592996.hq.mp3", 0.78);
  else if (/檐下|乡村|小雨|细雨/.test(pos)) add("乡村小雨.hq.mp3", 0.78);
  else if (/树叶|枝叶|雨叶/.test(pos)) add("备选_大雨打树叶_CC0.mp3", 0.75);
  else if (/暖厚|毯子|暖夜雨|暖雨/.test(pos)) {
    add("母带_城市夜雨_CC0.mp3", 0.68);
    add("雨中低鸣.hq.mp3", 0.34);
  } else if (/柔和雨|柔和夜雨|柔雨|绵密柔和/.test(pos)) add("柔和雨.hq.mp3", 0.78);
  else if (/城市夜雨|窗外夜雨|夜雨|雨声|下雨/.test(pos)) add("母带_城市夜雨_CC0.mp3", 0.78);

  if (/黑海/.test(pos)) add("海浪_黑海.hq.mp3", 0.78);
  else if (/沙滩/.test(pos)) add("海浪_沙滩柔浪_325197.hq.mp3", 0.78);
  else if (/湖浪|湖海|柔浪/.test(pos)) add("海浪_湖海柔浪_451532.hq.mp3", 0.78);
  else if (/海浪|远海|潮汐|海/.test(pos)) add("海浪_远海.hq.mp3", 0.78);

  if (/夜营|微火|余烬/.test(pos)) add("炉火_夜营氛围_766127.hq.mp3", 0.78);
  else if (/篝火|噼啪/.test(pos)) add("炉火_营地篝火_62487.hq.mp3", 0.78);
  else if (/壁炉|炉火|炭火|火/.test(pos)) add("炉火_壁炉低燃_836535.hq.mp3", 0.78);

  if (/河水|缓流/.test(pos)) add("溪流_柔和河水_707576.hq.mp3", 0.78);
  else if (/小溪/.test(pos)) add("溪流_小溪循环_767320.hq.mp3", 0.78);
  else if (/野外/.test(pos)) add("溪流_野外溪水_180732.hq.mp3", 0.78);
  else if (/溪|流水/.test(pos)) add("溪流.hq.mp3", 0.78);

  if (/采耳|掏耳/.test(pos)) add("ASMR_采耳_690078.hq.mp3", 0.65);
  if (/梳发|毛刷/.test(pos)) add("ASMR_毛刷梳发_765369.hq.mp3", 0.62);
  else if (/梳头/.test(pos)) add("ASMR_轻柔梳头_825798.hq.mp3", 0.62);
  if (/翻书|书房|翻页/.test(pos)) add("ASMR_翻书多人_575764.hq.mp3", 0.64);
  if (/写字|铅笔|笔记/.test(pos)) add("ASMR_铅笔写字柔_336381.hq.mp3", 0.62);
  if (/羽毛/.test(pos)) add("ASMR_羽毛轻拂_708086.hq.mp3", 0.65);
  if (/麦套|扫麦/.test(pos)) add("ASMR_麦套轻扫抓挠_803595.hq.mp3", 0.65);
  if (/轻敲|敲击|指尖/.test(pos)) add("ASMR_指尖轻敲刮擦_866230.hq.mp3", 0.62);
  if (/海绵/.test(pos)) add("ASMR_海绵抓挠_690084.hq.mp3", 0.62);
  if (/糖纸|揉捏/.test(pos)) add("ASMR_糖纸揉捏_802609.hq.mp3", 0.62);
  if (/搓手|抓挠|轻抚/.test(pos)) add("ASMR_轻抚抓挠_695629.hq.mp3", 0.62);

  if (/麦田/.test(pos)) add("微风_麦田柔风_447810.hq.mp3", 0.74);
  else if (/松林|林间空气|林风|森林/.test(pos)) add("林风_Akacie_73708.hq.mp3", 0.74);
  else if (/夜风|微风|傍晚/.test(pos)) add("夜风.hq.mp3", 0.74);
  if (/夜莺|鸟鸣|鸟/.test(pos)) add("鸟鸣_夜莺鸣叫_853566.hq.mp3", 0.65);
  if (/虫鸣|虫/.test(pos)) add("虫鸣.hq.mp3", 0.68);
  if (/闷雷|远雷|雷/.test(pos)) add("远雷.hq.mp3", 0.68);

  // 2. 兜底匹配目录里的精确声音名
  if (tracks.length === 0 && typeof YEXI_SOUNDS !== "undefined") {
    for (var i = 0; i < YEXI_SOUNDS.length; i++) {
      if (YEXI_SOUNDS[i].name && pos.indexOf(YEXI_SOUNDS[i].name) !== -1) {
        add(YEXI_SOUNDS[i].path, 0.72);
      }
    }
  }
  // 3. 若问题本身在问雨声/纯净平稳，给柔和雨做直观参考
  if (tracks.length === 0 && /纯净平稳/.test(pos)) {
    add("柔和雨.hq.mp3", 0.72);
  }
  return tracks;
}

function toggleOptionPreview(btn, tracks) {
  if (!optPreviewMixer || !tracks || tracks.length === 0) return;
  if (optPreviewActiveBtn === btn) {
    stopOptionPreview();
    return;
  }
  // 暂停主卡片播放，避免两路声景叠在一起吵
  if (isPlaying) {
    isPlaying = false;
    if (mixer) mixer.setPlaying(false);
    if (fallbackAudio) fallbackAudio.pause();
    updatePlaybackUI();
  }
  stopOptionPreview();

  optPreviewActiveBtn = btn;
  var reqId = optPreviewReqId;
  var itemEl = btn.closest ? btn.closest(".qa-opt-item") : btn.parentNode;
  if (itemEl) itemEl.classList.add("previewing");
  btn.classList.add("playing");

  optPreviewMixer._ensureContext();
  var allCached = true;
  for (var i = 0; i < tracks.length; i++) {
    if (!optPreviewMixer.buffers[tracks[i].path]) { allCached = false; break; }
  }
  btn.textContent = allCached ? "❚❚" : "…";

  optPreviewMixer.preloadTracks(tracks).then(function() {
    if (reqId !== optPreviewReqId || optPreviewActiveBtn !== btn) return;
    optPreviewMixer.syncTracks(tracks);
    optPreviewMixer.setMasterVolume(0.92);
    optPreviewMixer.setPlaying(true);
    btn.textContent = "❚❚";
  }).catch(function() {
    if (reqId !== optPreviewReqId) return;
    stopOptionPreview();
  });
}

function buildOptionItemsHtml(opts, questionText) {
  var html = "";
  var previewList = [];
  for (var i = 0; i < opts.length; i++) {
    var txt = opts[i];
    var pTracks = optPreviewMixer ? resolveOptionPreviewTracks(txt, questionText) : [];
    previewList.push(pTracks);
    var subNames = [];
    for (var j = 0; j < pTracks.length; j++) {
      var m = ySoundMeta(pTracks[j].path);
      if (m && m.name) subNames.push(m.name);
    }
    var subHtml = subNames.length ? '<span class="qa-opt-sub">试听 · ' + yEscape(subNames.join(" + ")) + '</span>' : '';
    var prevBtnHtml = pTracks.length
      ? '<button type="button" class="qa-opt-preview" data-idx="' + i + '" title="先听一下这段声音" aria-label="试听声音">▶</button>'
      : '';
    html +=
      '<div class="qa-opt-item">' +
        '<button type="button" class="qa-opt-btn" data-opt="' + yEscape(txt) + '">' +
          '<span>' + yEscape(txt) + '</span>' +
          subHtml +
        '</button>' +
        prevBtnHtml +
      '</div>';
  }
  return { html: html, previewList: previewList };
}

function bindOptionPreviewButtons(box, previewList) {
  if (!optPreviewMixer) return;
  var preloadAll = [];
  var pBtns = box.querySelectorAll(".qa-opt-preview");
  for (var i = 0; i < pBtns.length; i++) {
    (function(btn) {
      var idx = parseInt(btn.getAttribute("data-idx"), 10);
      var trs = previewList[idx] || [];
      for (var k = 0; k < trs.length; k++) preloadAll.push(trs[k]);
      btn.onclick = function(e) {
        if (e && e.stopPropagation) e.stopPropagation();
        toggleOptionPreview(btn, trs);
      };
    })(pBtns[i]);
  }
  // 后台预加载当前追问卡片里的声音，点击 ▶ 秒响
  if (preloadAll.length > 0) {
    optPreviewMixer.preloadTracks(preloadAll).catch(function() {});
  }
}

function lockPreviousAskBoxes(pickedOption) {
  stopOptionPreview();
  var boxes = chatStream.querySelectorAll(".msg-ask-box");
  for (var i = 0; i < boxes.length; i++) {
    var btns = boxes[i].querySelectorAll(".qa-opt-btn");
    for (var j = 0; j < btns.length; j++) {
      var itemEl = btns[j].closest ? btns[j].closest(".qa-opt-item") : btns[j].parentNode;
      if (pickedOption && btns[j].getAttribute("data-opt") === pickedOption && i === boxes.length - 1) {
        btns[j].classList.add("picked");
        if (itemEl) itemEl.classList.add("picked-item");
      }
      if (itemEl) itemEl.classList.add("locked-item");
      btns[j].disabled = true;
    }
    var pBtns = boxes[i].querySelectorAll(".qa-opt-preview");
    for (var p = 0; p < pBtns.length; p++) {
      pBtns[p].disabled = true;
    }
    var skips = boxes[i].querySelectorAll(".qa-skip-btn");
    for (var k = 0; k < skips.length; k++) {
      skips[k].disabled = true;
    }
  }
}

function clearOldFollowups() {
  var olds = chatStream.querySelectorAll(".followup-strip");
  for (var i = 0; i < olds.length; i++) {
    if (olds[i].parentNode) olds[i].parentNode.removeChild(olds[i]);
  }
}

function renderConfirmedPillsHtml(collected) {
  var c = collected || {};
  var html = "";
  for (var i = 0; i < COLLECTED_LABELS.length; i++) {
    var item = COLLECTED_LABELS[i];
    var val = c[item.key];
    if (val) {
      html += '<span class="col-pill">✓ ' + yEscape(val) + '</span>';
    }
  }
  return html;
}

function appendAskCard(d) {
  lockPreviousAskBoxes("");
  var box = document.createElement("div");
  box.className = "msg-ask-box";

  var confirmedHtml = renderConfirmedPillsHtml(d.collected);
  var opts = d.options || [];
  var built = buildOptionItemsHtml(opts, d.question || "");

  box.innerHTML =
    (confirmedHtml ? '<div class="collected-strip">' + confirmedHtml + '</div>' : '') +
    '<div class="ask-question">' + yEscape(d.question) + '</div>' +
    '<div class="qa-options">' + built.html + '</div>' +
    '<div class="qa-skip-row"><button type="button" class="qa-skip-btn">直接生成 ›</button></div>';

  var optBtns = box.querySelectorAll(".qa-opt-btn");
  for (var j = 0; j < optBtns.length; j++) {
    (function(btn) {
      btn.onclick = function() {
        var chosen = btn.getAttribute("data-opt");
        lockPreviousAskBoxes(chosen);
        sendTurn(chosen, false);
      };
    })(optBtns[j]);
  }
  bindOptionPreviewButtons(box, built.previewList);

  box.querySelector(".qa-skip-btn").onclick = function() {
    lockPreviousAskBoxes("");
    sendTurn("按目前信息直接帮我配", true);
  };

  chatStream.appendChild(box);
  box.scrollIntoView({ behavior: "smooth", block: "end" });
}

// 越界问题：显示温暖引导 + 三个可点场景例子，不写进聊天记忆
function appendBlockedCard(d) {
  clearOldFollowups();
  var box = document.createElement("div");
  box.className = "msg-ask-box";

  var opts = d.suggestions || [];
  var reply = d.reply || "我是夜息，只帮你挑配助眠和 ASMR 声音哦。";

  box.innerHTML =
    '<div class="ask-question">' + yEscape(reply) + '</div>' +

  var btns = box.querySelectorAll(".qa-opt-btn");
  for (var j = 0; j < btns.length; j++) {

      btn.onclick = function() {

        sendTurn(btn.getAttribute("data-opt"), false);
      };

        '</div>' +

  chatStream.appendChild(wrap);
  wrap.scrollIntoView({ behavior: "smooth", block: "end" });

// ===== 核心：发起一轮问答或出稿/微调 =====
function launchFromDesigner(forceCompose) {
  var draft = promptDraft.value.trim();
  if (!draft) {
    designerStatus.textContent = "先写几句话或点几个词块";
    promptDraft.focus();
    return;
  }
  designerStatus.textContent = "";
  initialPrompt = draft;
  qaRound = 0;
  sendTurn(draft, !!forceCompose);
}

function sendTurn(rawSay, forceCompose) {
  var say = String(rawSay || "").trim();
  if (!say || isSending) {
    if (!say) {
      setStatus("说说你的想法，或哪里需要调整", true);
      sayInput.focus();
    }
    return;
  }

  isSending = true;
  unlockAudioContexts();
  inConversation = true;
  startQaBtn.disabled = true;
  skipQaBtn.disabled = true;
  genBtn.disabled = true;
  sayInput.value = "";
  setStatus("");
  updatePlaybackUI();

  appendUserBubble(say);
  var thinker = createThinkingBubble(versions.length === 0 && !forceCompose);

  var curVer = getActiveVersion() || (versions.length > 0 ? versions[versions.length - 1] : null);
  var currentTracksPayload = curVer ? curVer.tracks : [];

  yPost("/api/agent_chat", {
    say: say,
    initial_prompt: initialPrompt,
    qa_round: qaRound,
    force_compose: !!forceCompose,
    current_tracks: currentTracksPayload,
    history: chatHistory.slice(-6),
    seconds: 30
  })
  .then(function(r) {
    if (r.status === 404) {
      return fallbackLegacyTurn(say, currentTracksPayload);
    }
    // 先确认响应真的是 JSON，否则把原文片段显示出来，避免笼统的解析报错
    var ctype = r.headers.get("content-type") || "";
    if (ctype.indexOf("json") === -1) {
      return r.text().then(function(txt) {
        throw new Error("服务返回的不是 JSON（" + ctype + "）：" + String(txt || "").replace(/\s+/g, " ").slice(0, 120));
      });
    }
    return r.json();
  })
  .then(function(d) {
    thinker.stop();
    isSending = false;
    startQaBtn.disabled = false;
    skipQaBtn.disabled = false;
    genBtn.disabled = false;

    if (!d || d.error) {
      if (d && d.action === "blocked") {
        appendBlockedCard(d);
        return;
      }
      setStatus((d && d.error) || "编排失败，请再试一次", true);
      return;
    }

    if (d.action === "blocked") {
      appendBlockedCard(d);
      return;
    }

    if (d.action === "ask" && versions.length === 0) {
      chatHistory.push({ role: "user", content: say });
      chatHistory.push({ role: "assistant", content: d.question || "" });
      qaRound += 1;
      appendAskCard(d);
      updatePlaybackUI();
      return;
    }

    var tracks = enrichTracks(d.tracks || []);
    if (tracks.length === 0) {
      setStatus("没找到合适声轨，请换个说法试试", true);
      return;
    }

    fallbackAudio = new Audio(API + "/api/audio?t=" + Date.now());
    fallbackAudio.loop = true;

    var isAiPowered = typeof d.ai_powered === "boolean" ? d.ai_powered : (
      String(d.source || "").indexOf("Qwen") !== -1 || String(d.source || "").indexOf("本地") !== -1
    );

    var ver = {
      verNum: versions.length + 1,
      say: say,
      title: d.title || "夜息声景",
      reply: d.reply || "已为你配好这版夜色。",
      aiPowered: isAiPowered,
      finalPrompt: d.final_prompt || initialPrompt || say,
      collected: d.collected || {},
      intent: d.intent || {},
      tracks: tracks,
      followups: d.followups || ["再轻柔一点", "加点夜风", "稳一点"],
      kept: false
    };
    versions.push(ver);
    chatHistory.push({ role: "user", content: say });
    chatHistory.push({ role: "assistant", content: ver.reply });

    appendAiTurnCard(ver);
    playVersion(versions.length - 1);
  })
  .catch(function(e) {
    thinker.stop();
    isSending = false;
    startQaBtn.disabled = false;
    skipQaBtn.disabled = false;
    genBtn.disabled = false;
    setStatus("连接本地服务失败（" + e.message + "）", true);
  });
}

function fallbackLegacyTurn(say, currentTracks) {
  if (!currentTracks || currentTracks.length === 0) {
    var combined = initialPrompt && initialPrompt !== say ? (initialPrompt + "，" + say) : say;
    return yPost("/api/generate", { say: combined, seconds: 30 })
      .then(function(r) {
        var ctype = r.headers.get("content-type") || "";
        if (ctype.indexOf("json") === -1) {
          return r.text().then(function(txt) {
            throw new Error("老接口返回的不是 JSON（" + ctype + "）：" + String(txt || "").replace(/\s+/g, " ").slice(0, 120));
          });
        }
        return r.json();
      })
      .then(function(d) {
        if (d.error) return d;
        var enriched = enrichTracks(d.items || []);
        var names = [];
        for (var i = 0; i < enriched.length; i++) {
          names.push(ySoundMeta(enriched[i].path).name);
        }
        var srcTxt = String(d.source || "");
        var isAi = typeof d.ai_powered === "boolean" ? d.ai_powered : (
          srcTxt.indexOf("Qwen") !== -1 || srcTxt.indexOf("本地") !== -1
        );
        return {
          ok: true,
          action: "compose",
          ai_powered: isAi,
          title: d.scene_detail || (names[0] || "夜息声景"),
          final_prompt: combined,
          reply: "已选出 " + names.join(" + ") + "。",
          intent: {
            scene: d.scene, scene_detail: d.scene_detail,
            mood: d.mood, warmth: d.warmth, dynamics: d.dynamics, avoid: d.avoid || []
          },
          tracks: enriched,
          followups: ["太吵了轻一点", "声音太闷", "要稳一点"]
        };
      });
  }

  return yPost("/api/feedback", { feedback: say, seconds: 30, items: currentTracks })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.error) return d;
      var enriched = enrichTracks(d.items || []);
      var notes = d.notes || [];
      return {
        ok: true,
        action: "compose",
        ai_powered: false,
        title: "微调版",
        final_prompt: (initialPrompt ? initialPrompt + " · " : "") + say,
        reply: notes.length ? ("已调整：" + notes.join("；") + "。") : "已为你微调配比。",
        intent: {},
        tracks: enriched,
        followups: ["再轻柔一点", "声音杂了", "换城市夜雨"]
      };
    });
}

function saveFeedbackGood(verIdx, btn) {
  var ver = versions[verIdx];
  if (!ver) return;
  btn.classList.add("on");
  btn.textContent = "已收藏";
  yPost("/api/feedback", {
    feedback: "满意",
    items: ver.tracks,
    say: ver.finalPrompt || ver.say || ver.title
  })
  .then(function(r) { return r.json(); })
  .then(function() {
    ver.kept = true;
    setStatus("已记入你的耳朵档案", false);
    loadMemory();
  })
  .catch(function() {
    btn.classList.remove("on");
    btn.textContent = "收藏配方";
    setStatus("本地服务未连接，未能保存", true);
  });
}

function openFullPlayer(ver) {
  yPost("/api/play", { items: ver.tracks, title: ver.title })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.error) { setStatus(d.error, true); return; }
      sessionStorage.setItem("yezi_play", JSON.stringify({
        title: ver.title,
        audio: d.audio,
        items: d.items || ver.tracks
      }));
      pauseAll();
      location.href = "player.html";
    })
    .catch(function() {
      setStatus("本地服务未连接，无法进入全屏助眠页", true);
    });
}

function applyEarProfileUI(prof, goodCount) {
  var link = document.getElementById("earBadgeLink");
  var tag = document.getElementById("profileHintTag");
  if (prof && prof.archetype_name && link) {
    link.textContent = prof.archetype_name;
  }
  if (tag) {
    var parts = [];
    if (prof && prof.archetype_name) parts.push(prof.archetype_name);
    if (goodCount > 0) parts.push("已记 " + goodCount + " 次偏爱");
    tag.textContent = parts.length ? ("· " + parts.join(" · ")) : "";
  }
}

function loadMemory() {
  var localProf = null;
  try {
    var raw = localStorage.getItem("yezi_ear_profile_v1");
    if (raw) localProf = JSON.parse(raw);
  } catch (e) {}
  if (localProf) applyEarProfileUI(localProf, 0);

  yGet("/api/memory")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var prof = (d && d.ear_profile) ? d.ear_profile : localProf;
      if (d && d.ear_profile) {
        try { localStorage.setItem("yezi_ear_profile_v1", JSON.stringify(d.ear_profile)); } catch (e) {}
      }
      applyEarProfileUI(prof, d.good_count || 0);
    })
    .catch(function() {});
}

function clearSleepTimer() {
  if (sleepTimerId) {
    clearInterval(sleepTimerId);
    sleepTimerId = null;
  }
  fadeFactor = 1.0;
  syncEngine();
}

var timerLabelEl = document.getElementById("timerLabel");

function setTimerLabel(txt) {
  if (timerLabelEl) timerLabelEl.textContent = txt;
}

timerBtn.onclick = function() {
  timerStepIdx = (timerStepIdx + 1) % TIMER_STEPS.length;
  var mins = TIMER_STEPS[timerStepIdx];
  clearSleepTimer();

  if (mins <= 0) {
    setTimerLabel("定时");
    timerBtn.classList.remove("on");
    document.getElementById("lightsOutTimer").textContent = "轻触任意处唤醒";
    setStatus("已关闭睡眠定时", false);
    return;
  }

  timerBtn.classList.add("on");
  sleepEndAt = Date.now() + mins * 60 * 1000;
  if (!isPlaying && versions.length > 0) {
    playVersion(activeVersionIdx >= 0 ? activeVersionIdx : versions.length - 1);
  }

  var tick = function() {
    var left = Math.max(0, (sleepEndAt - Date.now()) / 1000);
    fadeFactor = left <= 60 ? Math.max(0, left / 60) : 1.0;
    syncEngine();

    var m = Math.floor(left / 60);
    var s = Math.floor(left % 60);
    var label = m + ":" + (s < 10 ? "0" : "") + s;
    setTimerLabel(label);
    document.getElementById("lightsOutTimer").textContent = "将在 " + label + " 后渐弱熄声";

    if (left <= 0) {
      clearSleepTimer();
      pauseAll();
      timerStepIdx = 0;
      setTimerLabel("定时");
      timerBtn.classList.remove("on");
      document.getElementById("lightsOutTimer").textContent = "晚安，已轻轻停下";
    }
  };
  tick();
  sleepTimerId = setInterval(tick, 1000);
};

document.getElementById("lightsOutBtn").onclick = function() {
  if (!isPlaying && versions.length > 0) {
    playVersion(activeVersionIdx >= 0 ? activeVersionIdx : versions.length - 1);
  }
  document.body.classList.add("lights-out");
};
document.getElementById("lightsOutOverlay").onclick = function() {
  document.body.classList.remove("lights-out");
};

miniPlayBtn.onclick = function() {
  if (isPlaying) {
    pauseAll();
  } else if (versions.length > 0) {
    playVersion(activeVersionIdx >= 0 ? activeVersionIdx : versions.length - 1);
  }
};

document.getElementById("masterVol").oninput = function() {
  var val = parseInt(this.value, 10) || 0;
  masterVolume = val / 100;
  document.getElementById("masterVolPct").textContent = val + "%";
  syncEngine();
};

newChatBtn.onclick = function() {
  pauseAll();
  clearSleepTimer();
  timerStepIdx = 0;
  setTimerLabel("定时");
  timerBtn.classList.remove("on");
  versions = [];
  chatHistory = [];
  qaRound = 0;
  inConversation = false;
  activeVersionIdx = -1;
  chatStream.innerHTML = "";
  setStatus("");
  updatePlaybackUI();
  promptDraft.focus();
};

startQaBtn.onclick = function() { launchFromDesigner(false); };
skipQaBtn.onclick = function() { launchFromDesigner(true); };

genBtn.onclick = function() { sendTurn(sayInput.value, false); };
sayInput.addEventListener("keydown", function(e) {
  if (e.key === "Enter") sendTurn(this.value, false);
});

// 初始化
renderPromptBuilder();
syncBuilderChipsFromDraft();
updatePlaybackUI();
loadMemory();

var params = new URLSearchParams(location.search);
var fromQuery = params.get("say");
if (fromQuery) {
  promptDraft.value = fromQuery;
  syncBuilderChipsFromDraft();
  if (params.get("auto") === "1") {
    initialPrompt = fromQuery;
    sendTurn(fromQuery, false);
  } else {
    promptDraft.focus();
  }
}
</script>
</body>
</html>
