<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>夜息 · AI 配声</title>
<link rel="stylesheet" href="theme.css?v=12">
<style>
  .wrap-agent {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 0 clamp(16px, 4vw, 28px) 176px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    transition: opacity 0.6s var(--y-ease);
  }
  .wrap-agent.has-player {
    padding-bottom: 232px;
  }
  @media (min-width: 720px) {
    .wrap-agent {
      padding-bottom: 112px;
    }
    .wrap-agent.has-player {
      padding-bottom: 168px;
    }
  }

  /* 页头紧凑单行，给对话区留足首屏空间 */
  .page-hero {
    min-height: 0;
    padding: 4px 0 12px;
  }
  .page-hero h1 {
    font-size: clamp(24px, 3.6vw, 32px);
    line-height: 1.25;
  }
  .ph-row {
    align-items: center;
  }
  .ph-sub {
    margin-top: 4px;
    font-size: 12.5px;
  }
  .ph-right {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px 12px;
  }
  .agent-quota-pill {
    display: none;
    align-items: center;
    border-radius: 999px;
    padding: 4px 11px;
    font-size: 12px;
    letter-spacing: 0.04em;
    font-family: inherit;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.06);
    color: var(--y-text-sub);
    cursor: pointer;
    transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
  }
  .agent-quota-pill.show {
    display: inline-flex;
  }
  .agent-quota-pill:hover {
    border-color: rgba(var(--y-warm-rgb), 0.45);
    color: var(--y-text);
  }
  .agent-quota-pill.empty {
    background: rgba(var(--y-warm-rgb), 0.18);
    border-color: rgba(var(--y-warm-rgb), 0.55);
    color: #ffe8cc;
  }
  .agent-mem-tag {
    margin: 0;
    font-size: 12px;
    letter-spacing: 0.05em;
    color: rgba(var(--y-warm-rgb), 0.8);
  }
  .agent-mem-tag:empty {
    display: none;
  }
  .new-chat-btn {
    display: none;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    padding: 4px 11px;
    color: var(--y-text-sub);
    font-size: 12px;
    letter-spacing: 0.06em;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.3s ease, border-color 0.3s ease, background 0.3s ease;
  }
  .new-chat-btn.show {
    display: inline-flex;
    align-items: center;
  }
  .new-chat-btn:hover {
    color: #fff;
    background: rgba(var(--y-warm-rgb), 0.14);
    border-color: rgba(var(--y-warm-rgb), 0.45);
  }

  /* 阶段一：极简对话空态（仅 0 条消息时显示，发第一句立刻隐藏） */
  .chat-empty {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px 8px 16px;
  }
  .wrap-agent.in-chat .chat-empty {
    display: none;
  }
  .chat-empty-moon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle at 36% 34%, #fbf3e6 0%, #e9cfa6 46%, rgba(233, 183, 131, 0.16) 72%, transparent 76%);
    box-shadow: 0 0 32px rgba(var(--y-warm-rgb), 0.28);
    margin-bottom: 16px;
  }
  .chat-empty-title {
    margin: 0;
    font-family: var(--y-serif);
    font-size: clamp(20px, 3vw, 24px);
    font-weight: 400;
    letter-spacing: 0.1em;
    color: #fbf7ff;
  }
  .chat-empty-sub {
    margin: 8px 0 22px;
    max-width: 28em;
    font-size: 13px;
    line-height: 1.7;
    color: var(--y-text-sub);
  }
  .chat-starters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 520px;
  }
  .starter-pill {
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(16, 12, 28, 0.62);
    color: var(--y-text-sub);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
  }
  .starter-pill:hover {
    background: rgba(var(--y-warm-rgb), 0.16);
    border-color: rgba(var(--y-warm-rgb), 0.42);
    color: #fff;
  }

  /* 对话时间线（人机左右分栏气泡） */
  .chat-stream {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-top: 6px;
  }
  .msg-user-wrap {
    display: flex;
    justify-content: flex-end;
  }
  .msg-user {
    max-width: 82%;
    padding: 10px 15px;
    border-radius: 18px 18px 4px 18px;
    background: linear-gradient(135deg, rgba(var(--y-warm-rgb), 0.24), rgba(34, 24, 50, 0.84));
    border: 1px solid rgba(var(--y-warm-rgb), 0.2);
    box-shadow: 0 8px 24px rgba(4, 2, 12, 0.28);
    color: #fbf7ff;
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg-ai-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .ai-avatar {
    width: 28px;
    height: 28px;
    flex: 0 0 28px;
    margin-top: 2px;
    border-radius: 50%;
    background: radial-gradient(circle at 36% 34%, #fbf3e6 0%, #e9cfa6 46%, rgba(233, 183, 131, 0.18) 74%, transparent 78%);
    box-shadow: 0 0 14px rgba(var(--y-warm-rgb), 0.26);
  }
  .msg-ai-col {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 9px;
    max-width: calc(100% - 38px);
  }
  .msg-ai-bubble {
    align-self: flex-start;
    max-width: 100%;
    padding: 10px 14px;
    border-radius: 4px 18px 18px 18px;
    background: rgba(16, 12, 28, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.07);
    color: var(--y-text);
    font-size: 14.5px;
    line-height: 1.65;
    word-break: break-word;
  }
  .msg-thinking {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 4px 18px 18px 18px;
    background: rgba(16, 12, 28, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.07);
    font-size: 13.5px;
    color: var(--y-text-sub);
  }

  /* 追问快捷选项：降级为气泡下方的轻量回复项 */
  .collected-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .col-pill {
    font-size: 11.5px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(142, 224, 197, 0.12);
    color: #c5f5e4;
  }
  .qa-options {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .qa-opt-item {
    display: inline-flex;
    align-items: stretch;
    max-width: 100%;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.055);
    border: 1px solid rgba(255, 255, 255, 0.08);
    overflow: hidden;
    transition: background 0.25s ease, border-color 0.25s ease;
  }
  .qa-opt-item:hover:not(.locked-item) {
    background: rgba(var(--y-warm-rgb), 0.14);
    border-color: rgba(var(--y-warm-rgb), 0.34);
  }
  .qa-opt-item.previewing {
    background: rgba(var(--y-warm-rgb), 0.18);
    border-color: rgba(var(--y-warm-rgb), 0.45);
  }
  .qa-opt-item.picked-item {
    background: rgba(var(--y-warm-rgb), 0.22);
    border-color: rgba(var(--y-warm-rgb), 0.5);
  }
  .qa-opt-item.locked-item {
    opacity: 0.46;
  }
  .qa-opt-item.locked-item.picked-item {
    opacity: 1;
  }
  .qa-opt-btn {
    flex: 1 1 auto;
    min-width: 0;
    text-align: left;
    padding: 7px 12px;
    background: transparent;
    border: none;
    color: var(--y-text);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .qa-opt-btn:disabled {
    cursor: default;
  }
  .qa-opt-sub {
    font-size: 11px;
    color: var(--y-text-muted);
  }
  .qa-opt-preview {
    flex: 0 0 34px;
    border: none;
    border-left: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(255, 255, 255, 0.03);
    color: var(--y-text-sub);
    font-size: 11.5px;
    cursor: pointer;
    font-family: inherit;
  }
  .qa-opt-preview.playing {
    background: rgba(var(--y-warm-rgb), 0.24);
    color: #fff7eb;
  }
  .qa-opt-preview:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .qa-skip-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .qa-skip-btn {
    background: transparent;
    border: none;
    padding: 2px 0;
    color: rgba(var(--y-warm-rgb), 0.85);
    font-size: 12.5px;
    cursor: pointer;
    font-family: inherit;
  }
  .qa-skip-btn:hover:not(:disabled) {
    color: #fff;
  }
  .qa-skip-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .qa-type-tip {
    font-size: 12px;
    color: var(--y-text-muted);
  }

  /* 嵌入式音频版本卡：干净紧凑，去掉大图背景，专注对话流里的可播放作品 */
  .ver-card {
    border-radius: 18px;
    overflow: hidden;
    background: rgba(15, 11, 26, 0.84);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 14px 36px rgba(4, 2, 12, 0.42);
    transition: border-color 0.4s ease, box-shadow 0.5s ease;
  }
  .ver-card.is-playing-card {
    border-color: rgba(var(--y-warm-rgb), 0.42);
    box-shadow: 0 16px 40px rgba(4, 2, 12, 0.48), 0 0 28px rgba(var(--y-warm-rgb), 0.14);
  }
  .ver-head {
    padding: 13px 14px 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.055);
  }
  .ver-play-btn {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    border-radius: 50%;
    border: 1px solid rgba(var(--y-warm-rgb), 0.45);
    background: radial-gradient(circle at 38% 32%, rgba(255, 246, 232, 0.22), rgba(255, 255, 255, 0.03) 65%), rgba(24, 17, 36, 0.72);
    color: #fff8ee;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(var(--y-warm-rgb), 0.2);
  }
  .ver-play-btn svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }
  .ver-head-meta {
    flex: 1 1 auto;
    min-width: 0;
  }
  .ver-title-line {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .ver-num {
    font-size: 11px;
    font-weight: 600;
    color: #1d120a;
    background: var(--y-warm);
    border-radius: 999px;
    padding: 1px 7px;
  }
  .ver-title {
    font-family: var(--y-serif);
    font-size: 15.5px;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: #fff;
  }
  .ver-mode-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    color: #d6c9ef;
  }
  .ver-mode-badge.ai {
    background: rgba(142, 224, 197, 0.14);
    color: #cef7e8;
  }
  .ver-final-sub {
    margin-top: 3px;
    font-size: 12px;
    color: var(--y-text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ver-tracks {
    padding: 10px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .ver-track-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 9px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.035);
  }
  .vt-layer {
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 999px;
    border: 1px solid currentColor;
    flex: 0 0 auto;
    opacity: 0.88;
  }
  .vt-meta {
    flex: 1 1 auto;
    min-width: 0;
  }
  .vt-name {
    font-size: 13px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .vt-desc {
    font-size: 11.5px;
    color: var(--y-text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .vt-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 0 0 auto;
  }
  .vt-pos {
    font-size: 11.5px;
    color: #d6c2ff;
    white-space: nowrap;
  }
  .vt-bar-wrap {
    width: 34px;
    height: 4px;
    border-radius: 999px;
    background: rgba(218, 200, 255, 0.14);
    overflow: hidden;
  }
  .vt-bar-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(var(--y-warm-rgb), 0.72), var(--y-warm));
  }
  .vt-pct {
    font-size: 11.5px;
    color: var(--y-text-sub);
    min-width: 28px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .ver-upgrade-tip {
    display: inline-block;
    margin: 2px 14px 8px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid rgba(var(--y-warm-rgb), 0.35);
    background: rgba(var(--y-warm-rgb), 0.1);
    color: #ffe2ba;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.3s ease, border-color 0.3s ease;
  }
  .ver-upgrade-tip:hover {
    background: rgba(var(--y-warm-rgb), 0.2);
    border-color: rgba(var(--y-warm-rgb), 0.6);
  }
  .ver-actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    padding: 4px 14px 12px;
  }
  .ver-act-btn {
    border: none;
    background: rgba(255, 255, 255, 0.065);
    color: #efe5ff;
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12.5px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .ver-act-btn:hover {
    background: rgba(var(--y-accent-rgb), 0.24);
  }
  .ver-act-btn.on {
    background: rgba(142, 224, 197, 0.20);
    color: #d9fff1;
  }
  .ver-act-btn.primary {
    background: rgba(var(--y-accent-rgb), 0.24);
    color: #ffe9cf;
  }

  .followup-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .followup-strip .y-chip {
    font-size: 12px;
    padding: 4px 11px;
  }

  /* 底部常驻聊天输入区 + 迷你播放条 */
  .agent-dock-fixed {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    max-width: 820px;
    margin: 0 auto;
    z-index: 38;
    display: flex;
    flex-direction: column;
    gap: 7px;
    pointer-events: none;
    transition: opacity 0.6s var(--y-ease);
  }
  @media (min-width: 720px) {
    .agent-dock-fixed {
      bottom: 16px;
    }
  }
  .agent-dock-fixed > * {
    pointer-events: auto;
  }
  .mini-bar {
    display: none;
    align-items: center;
    gap: 9px;
    padding: 7px 12px;
    border-radius: 999px;
    background: rgba(12, 9, 20, 0.90);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 12px 32px rgba(4, 2, 12, 0.45);
  }
  .mini-bar.show {
    display: flex;
  }
  .mini-play-btn {
    width: 30px;
    height: 30px;
    flex: 0 0 30px;
    border-radius: 50%;
    border: 1px solid rgba(var(--y-warm-rgb), 0.42);
    background: rgba(var(--y-warm-rgb), 0.16);
    color: #fff;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mini-title {
    font-size: 12.5px;
    color: #fff;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 128px;
  }
  .mini-vol-wrap {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 56px;
  }
  .mini-vol-pct {
    font-size: 11.5px;
    color: var(--y-text-muted);
    min-width: 28px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .mini-tools {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 0 0 auto;
  }
  .mini-tools .hero-tool-btn {
    padding: 4px 9px;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .chat-dock-box {
    display: block;
    padding: 6px 8px;
    border-radius: 22px;
    background: rgba(16, 12, 28, 0.92);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 14px 38px rgba(4, 2, 12, 0.5);
  }
  .chat-dock-box:focus-within {
    border-color: rgba(var(--y-warm-rgb), 0.42);
  }
  .chat-input-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 2px 2px 2px 8px;
  }
  .chat-textarea {
    flex: 1 1 auto;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--y-text);
    font-size: 15px;
    line-height: 1.45;
    font-family: inherit;
    padding: 6px 0;
    max-height: 112px;
    overflow-y: auto;
  }
  .chat-textarea::placeholder {
    color: rgba(236, 228, 248, 0.46);
  }
  .chat-send-btn {
    flex: 0 0 auto;
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: 0.06em;
    font-family: inherit;
    cursor: pointer;
    color: #1d120a;
    background: linear-gradient(135deg, #f3e2c8 0%, #e4b682 100%);
    box-shadow: 0 4px 14px rgba(var(--y-warm-rgb), 0.24);
    transition: filter 0.25s ease, opacity 0.25s ease;
  }
  .chat-send-btn:hover:not(:disabled) {
    filter: brightness(1.06);
  }
  .chat-send-btn:disabled {
    opacity: 0.5;
    cursor: wait;
  }
  .chat-dock-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 2px 8px 1px;
  }
  .chat-dock-status {
    font-size: 12px;
    color: #d6c2ff;
    min-height: 16px;
    line-height: 1.45;
  }
  .chat-dock-status.err {
    color: #ff9eb5;
  }
  .chat-dock-status:empty {
    display: none;
  }
  .chat-edit-hint {
    font-size: 11.5px;
    color: var(--y-text-muted);
    line-height: 1.45;
  }
  .chat-edit-hint:empty {
    display: none;
  }

  body.lights-out .wrap-agent,
  body.lights-out .agent-dock-fixed {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="ambient-stage" id="ambientStage"></div>

<div class="wrap-agent" id="wrapAgent">
  <div class="top">
    <a class="brand" href="home.html">
      <div class="moon"><svg class="y-ico-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></div>
      <div class="name">夜息</div>
    </a>
    <a class="pill-link" id="earBadgeLink" href="ear_test.html">听觉图鉴</a>
  </div>

  <header class="page-hero">
    <div class="ph-row">
      <h1>AI 配声</h1>
      <div class="ph-right">
        <button type="button" class="agent-quota-pill" id="quotaBadge" title="点击查看或补充生成次数"></button>
        <p class="agent-mem-tag" id="profileHintTag"></p>
        <button type="button" class="new-chat-btn" id="newChatBtn">新对话</button>

<script>
var API = YEXI_API;
initAuthBar("agent.html");
initYexiTabbar("agent.html");
initAmbientStage("img/night-lake-stars.jpg", "#e9b783");

var STARTER_PROMPTS = [
  "睡不着，想要窗外暖一点的夜雨",
  "好累想放空，来一段远海浪声",
  "深夜写东西，山涧溪流配一点夜风",
  "想要轻柔采耳 ASMR，别太刺激"
];

var COLLECTED_LABELS = [
  { key: "state", name: "状态" },
  { key: "scene", name: "画面" },
  { key: "texture", name: "听感" },
  { key: "spatial_rhythm", name: "节奏" },
  { key: "avoid", name: "避雷" }
];

var CONV_KEY = "yexi_agent_conv_v1";
var BG_TASK_KEY = "yexi_bg_gen_task_v1";

var versions = [];
var chatHistory = [];
var chatItems = [];
var initialPrompt = "";
var qaRound = 0;
var inConversation = false;
var activeVersionIdx = -1;
var isPlaying = false;
var isSending = false;
var masterVolume = 0.85;
var fadeFactor = 1.0;
var fallbackAudio = null;
var usingFallback = false;

var bgTaskId = "";
var bgPollTimer = null;
var bgContext = null;
var bgThinker = null;

var TIMER_STEPS = [0, 15, 30, 60];
var timerStepIdx = 0;
var sleepTimerId = null;
var sleepEndAt = 0;

var wrapAgent = document.getElementById("wrapAgent");
var sayInput = document.getElementById("say");
var genBtn = document.getElementById("genBtn");
var statusEl = document.getElementById("status");
var editHintEl = document.getElementById("editHintLine");
var chatStream = document.getElementById("chatStream");
var newChatBtn = document.getElementById("newChatBtn");
var miniBar = document.getElementById("miniBar");
var miniPlayBtn = document.getElementById("miniPlayBtn");
var miniTitle = document.getElementById("miniTitle");
var timerBtn = document.getElementById("timerBtn");

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

function setStatus(msg, isErr) {
  statusEl.textContent = msg || "";
  statusEl.className = "chat-dock-status" + (isErr ? " err" : "");
}

function autoResizeSay() {
  if (!sayInput) return;
  sayInput.style.height = "auto";
  var h = Math.min(112, Math.max(32, sayInput.scrollHeight));
  sayInput.style.height = h + "px";
}
sayInput.addEventListener("input", autoResizeSay);

function formatPanLabel(pan) {
  var pct = Math.round(Math.abs(pan || 0) * 100);
  if (pct < 8) return "正中";
  return (pan < 0 ? "左 " : "右 ") + pct + "%";
}

function enrichTracks(items) {
  var out = [];
  for (var i = 0; i < (items || []).length; i++) {
    var it = items[i];
    if (!it || !it.path) continue;
    var base = String(it.path).split("/").pop().split("\\").pop();
    var w = parseFloat(it.weight);
    if (!base || isNaN(w) || w <= 0) continue;
    var m = ySoundMeta(base);
    out.push({
      path: base,
      weight: clamp(w, 0.08, 1.0),
      pan: typeof it.pan === "number" ? clamp(it.pan, -0.9, 0.9) : (m.defaultPan || 0),
      mode: it.mode === "intermittent" ? "intermittent" : (it.mode === "loop" ? "loop" : (m.defaultMode || "loop")),
      density: typeof it.density === "number" ? clamp(it.density, 0.15, 0.85) : (m.defaultDensity || 0.4),
      role_note: String(it.role_note || m.desc || "")
    });
  }
  return out;
}

function saveConvState() {
  try {
    if (!inConversation && chatItems.length === 0 && versions.length === 0) {
      sessionStorage.removeItem(CONV_KEY);
      return;
    }
    sessionStorage.setItem(CONV_KEY, JSON.stringify({
      hadToken: !!yToken(),
      versions: versions,
      chatHistory: chatHistory,
      chatItems: chatItems.slice(-40),
      initialPrompt: initialPrompt,
      qaRound: qaRound,
      activeVersionIdx: activeVersionIdx
    }));
  } catch (e) {}
}

function clearConvState() {
  try { sessionStorage.removeItem(CONV_KEY); } catch (e) {}
}

function renderStarters() {
  var box = document.getElementById("chatStarters");
  if (!box) return;
  box.innerHTML = "";
  for (var i = 0; i < STARTER_PROMPTS.length; i++) {
    (function(txt) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "starter-pill";
      btn.textContent = txt;
      btn.onclick = function() {
        if (!initialPrompt) initialPrompt = txt;
        sendTurn(txt, false);
      };
      box.appendChild(btn);
    })(STARTER_PROMPTS[i]);
  }
}

// ===== Web Audio 分层引擎 =====
var mixer = null;
if (typeof YexiMixer !== "undefined" && YexiMixer.isSupported()) {
  mixer = new YexiMixer({
    apiBase: API,
    onError: function() {
      if (fallbackAudio && fallbackAudio.src && !usingFallback) {
        usingFallback = true;
        if (mixer) mixer.setPlaying(false);
        fallbackAudio.volume = clamp(masterVolume * fadeFactor, 0, 1);
        if (isPlaying) fallbackAudio.play().catch(function() {});
      }
    }
  });
}

function getActiveVersion() {
  if (activeVersionIdx >= 0 && activeVersionIdx < versions.length) {
    return versions[activeVersionIdx];
  }
  return null;
}

function syncEngine() {
  var ver = getActiveVersion();
  var effectiveVol = clamp(masterVolume * fadeFactor, 0, 1);
  if (usingFallback && fallbackAudio) {
    fallbackAudio.volume = effectiveVol;
    return;
  }
  if (mixer && ver) {
    mixer.setMasterVolume(effectiveVol);
    mixer.syncTracks(ver.tracks);
  }
}

function findLeadTrack(tracks) {
  if (!tracks || tracks.length === 0) return null;
  var best = tracks[0];
  for (var i = 1; i < tracks.length; i++) {
    if (tracks[i].weight > best.weight) best = tracks[i];
  }
  return best;
}

function updatePlaybackUI() {
  var ver = getActiveVersion() || (versions.length > 0 ? versions[versions.length - 1] : null);
  wrapAgent.classList.toggle("in-chat", inConversation);
  wrapAgent.classList.toggle("has-player", versions.length > 0);
  newChatBtn.classList.toggle("show", inConversation || versions.length > 0);

  miniBar.classList.toggle("show", versions.length > 0);
  miniPlayBtn.textContent = isPlaying ? "❚❚" : "▶";

  if (ver) {
    miniTitle.textContent = "v" + ver.verNum + " · " + ver.title;
    document.getElementById("lightsOutTitle").textContent = ver.title;
    var lead = findLeadTrack(ver.tracks);
    if (lead) {
      var meta = ySoundMeta(lead.path);
      ySetAmbient("img/night-lake-stars.jpg", meta.accent, isPlaying);
    }
  } else {
    ySetAmbient("img/night-lake-stars.jpg", "#e9b783", false);
  }

  var cards = chatStream.querySelectorAll(".ver-card");
  for (var i = 0; i < cards.length; i++) {
    var idx = parseInt(cards[i].getAttribute("data-ver-idx"), 10);
    var activeNow = isPlaying && idx === activeVersionIdx;
    cards[i].classList.toggle("is-playing-card", activeNow);
    var playIco = cards[i].querySelector(".ver-play-ico");
    var pauseIco = cards[i].querySelector(".ver-pause-ico");
    if (playIco) playIco.style.display = activeNow ? "none" : "block";
    if (pauseIco) pauseIco.style.display = activeNow ? "block" : "none";
  }

  if (versions.length > 0) {
    var activeEditsLeft = ver ? (typeof ver.freeEditsLeft === "number" ? ver.freeEditsLeft : 0) : 0;
    sayInput.placeholder = "直接打字告诉我哪里要改（如：太吵了轻一点、加点夜风、不要雷）";
    if (editHintEl) {
      editHintEl.textContent = activeEditsLeft > 0
        ? ("本段还可免费让 AI 改 " + activeEditsLeft + " 次")
        : "免费修改已用完 · 继续让 AI 改将扣 1 次换 2 次改";
    }
    genBtn.textContent = "发送";
  } else if (inConversation) {
    sayInput.placeholder = "直接打字回答，或补充想要的声音细节…";
    if (editHintEl) editHintEl.textContent = "追问不扣次数，出声才算";
    genBtn.textContent = "发送";
  } else {
    sayInput.placeholder = "说说你想听什么声音（例：睡不着，想要窗外暖一点的夜雨）";
    if (editHintEl) editHintEl.textContent = "Enter 发送 · Shift+Enter 换行";
    genBtn.textContent = "发送";
  }
}

function updateMediaSession(ver) {
  if (!("mediaSession" in navigator) || !ver) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: ver.title,
      artist: "夜息 AI 配声",
      album: "AI 自然助眠"
    });
    navigator.mediaSession.setActionHandler("play", function() { playVersion(activeVersionIdx); });
    navigator.mediaSession.setActionHandler("pause", function() { pauseAll(); });
  } catch (e) {}
}

function pauseAll() {
  stopOptionPreview();
  isPlaying = false;
  if (mixer) mixer.setPlaying(false);
  if (fallbackAudio) fallbackAudio.pause();
  updatePlaybackUI();
}

function unlockAudioContexts() {
  try { if (mixer) mixer._ensureContext(); } catch (e) {}
  try { if (optPreviewMixer) optPreviewMixer._ensureContext(); } catch (e) {}
}
document.addEventListener("pointerdown", unlockAudioContexts, { once: true });
document.addEventListener("keydown", unlockAudioContexts, { once: true });

function playVersion(idx) {
  stopOptionPreview();
  unlockAudioContexts();
  if (idx < 0 || idx >= versions.length) return;
  var ver = versions[idx];
  if (activeVersionIdx === idx && isPlaying) {
    pauseAll();
    return;
  }

  activeVersionIdx = idx;
  usingFallback = false;
  if (fallbackAudio && fallbackAudio.src) {
    fallbackAudio.pause();
  }

  isPlaying = true;
  var effectiveVol = clamp(masterVolume * fadeFactor, 0, 1);

  if (mixer) {
    mixer.syncTracks(ver.tracks);
    mixer.setMasterVolume(effectiveVol);
    mixer.setPlaying(true);
    var playCheckVerIdx = idx;
    setTimeout(function() {
      if (!isPlaying || activeVersionIdx !== playCheckVerIdx || !mixer || !mixer.ctx) return;
      if (mixer.ctx.state !== "running") {
        mixer.ctx.resume().catch(function() {});
        setTimeout(function() {
          if (isPlaying && activeVersionIdx === playCheckVerIdx && mixer && mixer.ctx && mixer.ctx.state !== "running") {
            isPlaying = false;
            mixer.setPlaying(false);
            updatePlaybackUI();
            setStatus("浏览器拦截了自动发声，点播放按钮即可收听", false);
          }
        }, 250);
      }
    }, 650);
  } else if (fallbackAudio && fallbackAudio.src) {
    usingFallback = true;
    fallbackAudio.volume = effectiveVol;
    fallbackAudio.play().catch(function() {
      isPlaying = false;
      updatePlaybackUI();
    });
  }

  updateMediaSession(ver);
  updatePlaybackUI();
  saveConvState();
}

// ===== 对话气泡渲染 =====
function scrollChatBottom() {
  setTimeout(function() {
    window.scrollTo({ top: document.documentElement.scrollHeight, behavior: "smooth" });
  }, 40);
}

function appendUserBubble(text, skipSave) {
  var wrap = document.createElement("div");
  wrap.className = "msg-user-wrap";
  wrap.innerHTML = '<div class="msg-user">' + yEscape(text) + '</div>';
  chatStream.appendChild(wrap);
  if (!skipSave) {
    chatItems.push({ type: "user", text: text });
    saveConvState();
  }
  scrollChatBottom();
}

function createThinkingBubble(inQaPhase) {
  var row = document.createElement("div");
  row.className = "msg-ai-row";
  row.innerHTML =
    '<div class="ai-avatar" aria-hidden="true"></div>' +
    '<div class="msg-ai-col">' +
      '<div class="msg-thinking"><span class="spin"></span><span>' + (inQaPhase ? "正在理解你的想法…" : "正在挑配声景并生成音频…") + '</span></div>' +
    '</div>';
  chatStream.appendChild(row);
  scrollChatBottom();
  return {
    stop: function() {
      if (row && row.parentNode) row.parentNode.removeChild(row);
    }
  };
}

// ===== 追问选项即时试听 =====
var optPreviewMixer = (typeof YexiMixer !== "undefined" && YexiMixer.isSupported())
  ? new YexiMixer({ apiBase: API })
  : null;
var optPreviewActiveBtn = null;
var optPreviewReqId = 0;

function stopOptionPreview() {
  optPreviewReqId += 1;
  if (optPreviewMixer) {
    optPreviewMixer.setPlaying(false);
    optPreviewMixer.syncTracks([]);
  }
  if (optPreviewActiveBtn) {
    optPreviewActiveBtn.classList.remove("playing");
    optPreviewActiveBtn.textContent = "▶";
    var oldItem = optPreviewActiveBtn.closest ? optPreviewActiveBtn.closest(".qa-opt-item") : optPreviewActiveBtn.parentNode;
    if (oldItem) oldItem.classList.remove("previewing");
    optPreviewActiveBtn = null;
  }
}

function resolveOptionPreviewTracks(optText, questionText) {
  var raw = String(optText || "").trim();
  if (!raw) return [];
  if (/^(纯净单层|纯近场触发就好|稀疏偶发|不用再加|按目前信息)/.test(raw)) {
    return [];
  }
  var pos = raw
    .replace(/(别|不要|不|无|没有)(打雷|雷声|雷|炉火|火|鸟鸣|鸟|虫鸣|虫|噼啪|雨)/g, "");
  var tracks = [];
  var seen = {};
  function add(path, w, mode) {
    if (!path || seen[path] || tracks.length >= 2) return;
    seen[path] = true;
    tracks.push({ path: path, weight: w || 0.72, pan: tracks.length === 0 ? 0 : 0.25, mode: mode || "loop", density: 0.45 });
  }

  if (/帐篷/.test(pos)) add("帐篷雨_小帐篷大雨_592996.hq.mp3", 0.78);
  else if (/檐下|乡村|小雨|细雨/.test(pos)) add("乡村小雨.hq.mp3", 0.78);
  else if (/树叶|枝叶|雨叶/.test(pos)) add("备选_大雨打树叶_CC0.mp3", 0.75);
  else if (/暖厚|毯子|暖夜雨|暖雨/.test(pos)) {
    add("母带_城市夜雨_CC0.mp3", 0.68);
    add("雨中低鸣.hq.mp3", 0.34);
  } else if (/柔和雨|柔和夜雨|柔雨|绵密柔和/.test(pos)) add("柔和雨.hq.mp3", 0.78);
  else if (/城市夜雨|窗外夜雨|夜雨|雨声|下雨/.test(pos)) add("母带_城市夜雨_CC0.mp3", 0.78);

  if (/黑海/.test(pos)) add("海浪_黑海.hq.mp3", 0.78);
  else if (/沙滩/.test(pos)) add("海浪_沙滩柔浪_325197.hq.mp3", 0.78);
  else if (/湖浪|湖海|柔浪/.test(pos)) add("海浪_湖海柔浪_451532.hq.mp3", 0.78);
  else if (/海浪|远海|潮汐|海/.test(pos)) add("海浪_远海.hq.mp3", 0.78);

  if (/夜营|微火|余烬/.test(pos)) add("炉火_夜营氛围_766127.hq.mp3", 0.78);
  else if (/篝火|噼啪/.test(pos)) add("炉火_营地篝火_62487.hq.mp3", 0.78);
  else if (/壁炉|炉火|炭火|火/.test(pos)) add("炉火_壁炉低燃_836535.hq.mp3", 0.78);

  if (/河水|缓流/.test(pos)) add("溪流_柔和河水_707576.hq.mp3", 0.78);
  else if (/小溪/.test(pos)) add("溪流_小溪循环_767320.hq.mp3", 0.78);
  else if (/野外/.test(pos)) add("溪流_野外溪水_180732.hq.mp3", 0.78);
  else if (/溪|流水/.test(pos)) add("溪流.hq.mp3", 0.78);

  if (/采耳|掏耳/.test(pos)) add("ASMR_采耳_690078.hq.mp3", 0.65);
  if (/梳发|毛刷/.test(pos)) add("ASMR_毛刷梳发_765369.hq.mp3", 0.62);
  else if (/梳头/.test(pos)) add("ASMR_轻柔梳头_825798.hq.mp3", 0.62);
  if (/翻书|书房|翻页/.test(pos)) add("ASMR_翻书多人_575764.hq.mp3", 0.64);
  if (/写字|铅笔|笔记/.test(pos)) add("ASMR_铅笔写字柔_336381.hq.mp3", 0.62);
  if (/羽毛/.test(pos)) add("ASMR_羽毛轻拂_708086.hq.mp3", 0.65);
  if (/麦套|扫麦/.test(pos)) add("ASMR_麦套轻扫抓挠_803595.hq.mp3", 0.65);
  if (/轻敲|敲击|指尖/.test(pos)) add("ASMR_指尖轻敲刮擦_866230.hq.mp3", 0.62);
  if (/海绵/.test(pos)) add("ASMR_海绵抓挠_690084.hq.mp3", 0.62);
  if (/糖纸|揉捏/.test(pos)) add("ASMR_糖纸揉捏_802609.hq.mp3", 0.62);
  if (/搓手|抓挠|轻抚/.test(pos)) add("ASMR_轻抚抓挠_695629.hq.mp3", 0.62);

  if (/麦田/.test(pos)) add("微风_麦田柔风_447810.hq.mp3", 0.74);
  else if (/松林|林间空气|林风|森林/.test(pos)) add("林风_Akacie_73708.hq.mp3", 0.74);
  else if (/夜风|微风|傍晚/.test(pos)) add("夜风.hq.mp3", 0.74);
  if (/夜莺|鸟鸣|鸟/.test(pos)) add("鸟鸣_夜莺鸣叫_853566.hq.mp3", 0.65);
  if (/虫鸣|虫/.test(pos)) add("虫鸣.hq.mp3", 0.68);
  if (/闷雷|远雷|雷/.test(pos)) add("远雷.hq.mp3", 0.68);

  if (tracks.length === 0 && typeof YEXI_SOUNDS !== "undefined") {
    for (var i = 0; i < YEXI_SOUNDS.length; i++) {
      if (YEXI_SOUNDS[i].name && pos.indexOf(YEXI_SOUNDS[i].name) !== -1) {
        add(YEXI_SOUNDS[i].path, 0.72);
      }
    }
  }
  if (tracks.length === 0 && /纯净平稳/.test(pos)) {
    add("柔和雨.hq.mp3", 0.72);
  }
  return tracks;
}

function toggleOptionPreview(btn, tracks) {
  if (!optPreviewMixer || !tracks || tracks.length === 0) return;
  if (optPreviewActiveBtn === btn) {
    stopOptionPreview();
    return;
  }
  if (isPlaying) {
    isPlaying = false;
    if (mixer) mixer.setPlaying(false);
    if (fallbackAudio) fallbackAudio.pause();
    updatePlaybackUI();
  }
  stopOptionPreview();

  optPreviewActiveBtn = btn;
  var reqId = optPreviewReqId;
  var itemEl = btn.closest ? btn.closest(".qa-opt-item") : btn.parentNode;
  if (itemEl) itemEl.classList.add("previewing");
  btn.classList.add("playing");

  optPreviewMixer._ensureContext();
  var allCached = true;
  for (var i = 0; i < tracks.length; i++) {
    if (!optPreviewMixer.buffers[tracks[i].path]) { allCached = false; break; }
  }
  btn.textContent = allCached ? "❚❚" : "…";

  optPreviewMixer.preloadTracks(tracks).then(function() {
    if (reqId !== optPreviewReqId || optPreviewActiveBtn !== btn) return;
    optPreviewMixer.syncTracks(tracks);
    optPreviewMixer.setMasterVolume(0.92);
    optPreviewMixer.setPlaying(true);
    btn.textContent = "❚❚";
  }).catch(function() {
    if (reqId !== optPreviewReqId) return;
    stopOptionPreview();
  });
}

function buildOptionItemsHtml(opts, questionText) {
  var html = "";
  var previewList = [];
  for (var i = 0; i < opts.length; i++) {
    var txt = opts[i];
    var pTracks = optPreviewMixer ? resolveOptionPreviewTracks(txt, questionText) : [];
    previewList.push(pTracks);
    var subNames = [];
    for (var j = 0; j < pTracks.length; j++) {
      var m = ySoundMeta(pTracks[j].path);
      if (m && m.name) subNames.push(m.name);
    }
    var subHtml = subNames.length ? '<span class="qa-opt-sub">试听 · ' + yEscape(subNames.join(" + ")) + '</span>' : '';
    var prevBtnHtml = pTracks.length
      ? '<button type="button" class="qa-opt-preview" data-idx="' + i + '" title="先听一下这段声音" aria-label="试听声音">▶</button>'
      : '';
    html +=
      '<div class="qa-opt-item">' +
        '<button type="button" class="qa-opt-btn" data-opt="' + yEscape(txt) + '">' +
          '<span>' + yEscape(txt) + '</span>' +
          subHtml +
        '</button>' +
        prevBtnHtml +
      '</div>';
  }
  return { html: html, previewList: previewList };
}

function bindOptionPreviewButtons(box, previewList) {
  if (!optPreviewMixer) return;
  var preloadAll = [];
  var pBtns = box.querySelectorAll(".qa-opt-preview");
  for (var i = 0; i < pBtns.length; i++) {
    (function(btn) {
      var idx = parseInt(btn.getAttribute("data-idx"), 10);
      var trs = previewList[idx] || [];
      for (var k = 0; k < trs.length; k++) preloadAll.push(trs[k]);
      btn.onclick = function(e) {
        if (e && e.stopPropagation) e.stopPropagation();
        toggleOptionPreview(btn, trs);
      };
    })(pBtns[i]);
  }
  if (preloadAll.length > 0) {
    optPreviewMixer.preloadTracks(preloadAll).catch(function() {});
  }
}

function lockPreviousAskBoxes(pickedOption) {
  stopOptionPreview();
  var boxes = chatStream.querySelectorAll(".msg-ask-box");
  for (var i = 0; i < boxes.length; i++) {
    var btns = boxes[i].querySelectorAll(".qa-opt-btn");
    for (var j = 0; j < btns.length; j++) {
      var itemEl = btns[j].closest ? btns[j].closest(".qa-opt-item") : btns[j].parentNode;
      if (pickedOption && btns[j].getAttribute("data-opt") === pickedOption && i === boxes.length - 1) {
        btns[j].classList.add("picked");
        if (itemEl) itemEl.classList.add("picked-item");
      }
      if (itemEl) itemEl.classList.add("locked-item");
      btns[j].disabled = true;
    }
    var pBtns = boxes[i].querySelectorAll(".qa-opt-preview");
    for (var p = 0; p < pBtns.length; p++) {
      pBtns[p].disabled = true;
    }
    var skips = boxes[i].querySelectorAll(".qa-skip-btn");
    for (var k = 0; k < skips.length; k++) {
      skips[k].disabled = true;
    }
  }
}

function clearOldFollowups() {
  var olds = chatStream.querySelectorAll(".followup-strip");
  for (var i = 0; i < olds.length; i++) {
    if (olds[i].parentNode) olds[i].parentNode.removeChild(olds[i]);
  }
}

function renderConfirmedPillsHtml(collected) {
  var c = collected || {};
  var html = "";
  for (var i = 0; i < COLLECTED_LABELS.length; i++) {
    var item = COLLECTED_LABELS[i];
    var val = c[item.key];
    if (val) {
      html += '<span class="col-pill">✓ ' + yEscape(val) + '</span>';
    }
  }
  return html;
}

// ===== 核心：发起一轮自然对话或微调 =====
function sendTurn(rawSay, forceCompose) {
  var say = String(rawSay || "").trim();
  if (!say || isSending) {
    if (!say) {
      setStatus("打字说说你想要什么声音，或哪里需要调整", true);
      sayInput.focus();
    }
    return;
  }

  if (!initialPrompt && versions.length === 0) {
    initialPrompt = say;
  }

  isSending = true;
  unlockAudioContexts();
  inConversation = true;
  genBtn.disabled = true;
  sayInput.value = "";
  autoResizeSay();
  setStatus("");
  updatePlaybackUI();

  appendUserBubble(say, false);
  var thinker = createThinkingBubble(versions.length === 0 && !forceCompose);

  var curVer = getActiveVersion() || (versions.length > 0 ? versions[versions.length - 1] : null);
  var currentTracksPayload = curVer ? curVer.tracks : [];
  var currentLineageId = curVer ? (curVer.lineageId || "") : "";

  bgContext = { say: say, forceCompose: !!forceCompose };
  bgThinker = thinker;

  yPost("/api/task/submit", {
    say: say,
    initial_prompt: initialPrompt,
    qa_round: qaRound,
    force_compose: !!forceCompose,
    current_tracks: currentTracksPayload,
    lineage_id: currentLineageId,
    history: chatHistory.slice(-6),
    seconds: 30
  })
  .then(function(r) {
    if (r.status === 404) {
      clearBgTask();
      return yPost("/api/agent_chat", {
        say: say,
        initial_prompt: initialPrompt,
        qa_round: qaRound,
        force_compose: !!forceCompose,
        current_tracks: currentTracksPayload,
        lineage_id: currentLineageId,
        history: chatHistory.slice(-6),
        seconds: 30
      }).then(function(r2) { return r2.json(); }).then(function(d2) { handleGenResult(d2); });
    }
    return r.json().then(function(s) {
      if (!s.ok || !s.taskId) throw new Error(s.error || "提交任务失败");
      bgTaskId = s.taskId;
      try { localStorage.setItem(BG_TASK_KEY, bgTaskId); } catch (e) {}
      pollBgTask();
    });
  })
  .catch(function(e) {
    if (bgThinker) bgThinker.stop();
    isSending = false;
    genBtn.disabled = false;
    setStatus("连接本地服务失败（" + e.message + "）", true);
  });
}

function applyQuotaUI(q) {
  var badge = document.getElementById("quotaBadge");
  if (!badge || !q || typeof q !== "object") return;
  badge.classList.add("show");
  badge.classList.remove("empty");
  if (q.unlimited) {
    badge.textContent = "不限次生成";
    return;
  }
  var fl = typeof q.free_left === "number" ? q.free_left : 0;
  var flim = typeof q.free_limit === "number" ? q.free_limit : 2;
  var pl = typeof q.paid_left === "number" ? q.paid_left : 0;
  var tl = typeof q.total_left === "number" ? q.total_left : (fl + pl);
  if (tl <= 0) {
    badge.textContent = "次数已用完 · 付费 +3 次";
    badge.classList.add("empty");
  } else if (fl > 0 && pl > 0) {
    badge.textContent = "剩余 " + tl + " 次（免费 " + fl + " + 付费 " + pl + "）";
  } else if (pl > 0) {
    badge.textContent = "已购剩 " + pl + " 次";
  } else {
    badge.textContent = "今日免费剩 " + fl + "/" + flim + " 次";
  }
}

function loadQuota() {
  var badge = document.getElementById("quotaBadge");
  if (badge) {
    badge.onclick = function() {
      if (typeof yexiPayWall === "function") yexiPayWall("trial3");
    };
  }
  yGet("/api/quota")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d && d.ok) applyQuotaUI(d);
    })
    .catch(function() {});
}

function handleGenResult(d) {
  var say = bgContext ? bgContext.say : "";
  if (!say) say = (d && (d.final_prompt || d.title)) || "";
  var thinker = bgThinker;
  if (thinker) thinker.stop();
  isSending = false;
  genBtn.disabled = false;
  inConversation = true;
  clearBgTask();
  setStatus("");
  if (d && d.quota) applyQuotaUI(d.quota);

  if (!d || d.error) {
    if (d && d.action === "blocked") {
      appendBlockedCard(d, false);
      updatePlaybackUI();
      return;
    }
    if (d && d.action === "quota") {
      setStatus(d.error || "次数用完了", true);
      updatePlaybackUI();
      if (typeof yexiPayWall === "function") yexiPayWall(d.product_id || "trial3");
      return;
    }
    setStatus((d && d.error) || "编排失败，请再试一次", true);
    updatePlaybackUI();
    return;
  }

  if (d.action === "blocked") {
    appendBlockedCard(d, false);
    updatePlaybackUI();
    return;
  }

  if (d.action === "ask" && versions.length === 0) {
    chatHistory.push({ role: "user", content: say });
    chatHistory.push({ role: "assistant", content: d.question || "" });
    qaRound += 1;
    appendAskCard(d, false);
    updatePlaybackUI();
    saveConvState();
    return;
  }

  var tracks = enrichTracks(d.tracks || []);
  if (tracks.length === 0) {
    setStatus("没找到合适声轨，换个说法再试试", true);
    updatePlaybackUI();
    return;
  }

  var fbUrl = d.audio ? (API + d.audio + (d.audio.indexOf("?") === -1 ? "?" : "&") + "t=" + Date.now()) : (API + "/api/audio?t=" + Date.now());
  fallbackAudio = new Audio(fbUrl);
  fallbackAudio.loop = true;

  var isAiPowered = typeof d.ai_powered === "boolean" ? d.ai_powered : (
    String(d.source || "").indexOf("Qwen") !== -1 || String(d.source || "").indexOf("本地") !== -1
  );

  var editsLeftNum = typeof d.free_edits_left === "number" ? d.free_edits_left : 0;
  var activeLineageId = d.lineage_id || "";
  var ver = {
    verNum: versions.length + 1,
    say: say,
    title: d.title || "夜息声景",
    reply: d.reply || "已为你配好这版夜色。",
    aiPowered: isAiPowered,
    fullAccess: !!d.full_access,
    catalogDowngraded: !!d.catalog_downgraded,
    finalPrompt: d.final_prompt || initialPrompt || say,
    collected: d.collected || {},
    intent: d.intent || {},
    tracks: tracks,
    followups: d.followups || ["再轻柔一点", "加点夜风", "稳一点"],
    lineageId: activeLineageId,
    freeEditsLeft: editsLeftNum,
    kept: false
  };
  if (activeLineageId) {
    for (var vi = 0; vi < versions.length; vi++) {
      if (versions[vi].lineageId === activeLineageId) {
        versions[vi].freeEditsLeft = editsLeftNum;
      }
    }
  }
  versions.push(ver);
  chatHistory.push({ role: "user", content: say });
  chatHistory.push({ role: "assistant", content: ver.reply });

  appendAiTurnCard(ver, versions.length - 1, false);
  playVersion(versions.length - 1);

  var msg = "";
  var q = d.quota;
  var tl = (q && typeof q === "object")
    ? (typeof q.total_left === "number" ? q.total_left : q.left)
    : null;
  var srcLabel = d.consumed_from === "free" ? "免费" : (
    (d.consumed_from === "local_paid" || d.consumed_from === "nowpay") ? "付费" : ""
  );

  if (q && q.unlimited) {
    msg = "不限次权益生效中";
  } else if (d.billing_mode === "free_edit") {
    msg = editsLeftNum > 0
      ? ("免费修改（不扣次数）· 本段还可改 " + editsLeftNum + " 次")
      : "本段免费修改已用完，下次继续改将扣 1 次换 2 次修改";
    if (typeof tl === "number") msg += " · 剩余 " + tl + " 次机会";
  } else if (d.billing_mode === "refill_edit") {
    msg = "已扣 1 次" + (srcLabel ? ("（" + srcLabel + "）") : "") + "换 2 次修改 · 本段还可再改 " + editsLeftNum + " 次";
    if (typeof tl === "number") msg += " · 剩余 " + tl + " 次机会";
  } else {
    msg = (srcLabel ? ("已扣 1 次（" + srcLabel + "）") : "已生成") +
      (typeof tl === "number" ? ("，剩余 " + tl + " 次") : "") +
      " · 本段附带 " + editsLeftNum + " 次免费修改";
  }
  if (msg) {
    setStatus(msg);
    setTimeout(function() {
      if (statusEl.textContent === msg) setStatus("");
    }, 5000);
  }
}

function clearBgTask() {
  bgTaskId = "";
  bgContext = null;
  bgThinker = null;
  if (bgPollTimer) { clearTimeout(bgPollTimer); bgPollTimer = null; }
  try { localStorage.removeItem(BG_TASK_KEY); } catch (e) {}
}

function pollBgTask() {
  if (!bgTaskId) return;
  yGet("/api/task/status?id=" + encodeURIComponent(bgTaskId))
  .then(function(r) {
    if (r.status === 404) {
      clearBgTask();
      setStatus("生成任务已失效，请重新发送", true);
      isSending = false;
      genBtn.disabled = false;
      return;
    }
    return r.json().then(function(s) {
      if (!s.ok) throw new Error(s.error || "查询失败");
      if (s.state === "queued" || s.state === "running") {
        bgPollTimer = setTimeout(pollBgTask, 1500);
        return;
      }
      if (s.state === "failed") {
        var failedResult = s.result || {};
        if (failedResult.action === "quota" || failedResult.action === "blocked") {
          handleGenResult(failedResult);
        } else {
          if (bgThinker) bgThinker.stop();
          clearBgTask();
          setStatus((s.error || "生成失败") + "，请重试", true);
          isSending = false;
          genBtn.disabled = false;
        }
        return;
      }
      var result = s.result || {};
      handleGenResult(result);
    });
  })
  .catch(function() {
    bgPollTimer = setTimeout(pollBgTask, 2000);
  });
}

function saveFeedbackGood(verIdx, btn) {
  var ver = versions[verIdx];
  if (!ver) return;
  btn.classList.add("on");
  btn.textContent = "已收藏";
  yPost("/api/feedback", {
    feedback: "满意",
    items: ver.tracks,
    say: ver.finalPrompt || ver.say || ver.title
  })
  .then(function(r) { return r.json(); })
  .then(function() {
    ver.kept = true;
    saveConvState();
    setStatus("已记入你的耳朵档案", false);
    loadMemory();
  })
  .catch(function() {
    btn.classList.remove("on");
    btn.textContent = "收藏配方";
    setStatus("本地服务未连接，未能保存", true);
  });
}

function openFullPlayer(ver) {
  yPost("/api/play", { items: ver.tracks, title: ver.title })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.error) { setStatus(d.error, true); return; }
      sessionStorage.setItem("yezi_play", JSON.stringify({
        title: ver.title,
        audio: d.audio,
        items: d.items || ver.tracks
      }));
      pauseAll();
      location.href = "player.html";
    })
    .catch(function() {
      setStatus("本地服务未连接，无法进入全屏助眠页", true);
    });
}

document.getElementById("earBadgeLink").addEventListener("click", function(e) {
  if (yNeedLogin("开启听觉图鉴", "ear_test.html")) {
    e.preventDefault();
  }
});

// ===== 耳朵档案与记忆 =====
function applyEarProfileUI(prof, goodCount) {
  var link = document.getElementById("earBadgeLink");
  var tag = document.getElementById("profileHintTag");
  if (prof && prof.archetype_name && link) {
    link.textContent = prof.archetype_name;
  }
  if (tag) {
    var parts = [];
    if (prof && prof.archetype_name) parts.push(prof.archetype_name);
    if (goodCount > 0) parts.push("已记 " + goodCount + " 次偏爱");
    tag.textContent = parts.length ? ("· " + parts.join(" · ")) : "";
  }
}

function loadMemory() {
  var localProf = null;
  try {
    var raw = localStorage.getItem("yezi_ear_profile_v1");
    if (raw) localProf = JSON.parse(raw);
  } catch (e) {}
  if (localProf) applyEarProfileUI(localProf, 0);

  yGet("/api/memory")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d && d.ear_profile === null) {
        localProf = null;
        try { localStorage.removeItem("yezi_ear_profile_v1"); } catch (e) {}
      }
      var prof = (d && d.ear_profile) ? d.ear_profile : localProf;
      if (d && d.ear_profile) {
        try { localStorage.setItem("yezi_ear_profile_v1", JSON.stringify(d.ear_profile)); } catch (e) {}
      }
      applyEarProfileUI(prof, d.good_count || 0);
    })
    .catch(function() {});
}

// ===== 定时 / 熄灯 / 播放控制 =====
function clearSleepTimer() {
  if (sleepTimerId) {
    clearInterval(sleepTimerId);
    sleepTimerId = null;
  }
  fadeFactor = 1.0;
  syncEngine();
}

var timerLabelEl = document.getElementById("timerLabel");
function setTimerLabel(txt) {
  if (timerLabelEl) timerLabelEl.textContent = txt;
}

timerBtn.onclick = function() {
  timerStepIdx = (timerStepIdx + 1) % TIMER_STEPS.length;
  var mins = TIMER_STEPS[timerStepIdx];
  clearSleepTimer();

  if (mins <= 0) {
    setTimerLabel("定时");
    timerBtn.classList.remove("on");
    document.getElementById("lightsOutTimer").textContent = "轻触任意处唤醒";
    setStatus("已关闭睡眠定时", false);
    return;
  }

  timerBtn.classList.add("on");
  sleepEndAt = Date.now() + mins * 60 * 1000;
  if (!isPlaying && versions.length > 0) {
    playVersion(activeVersionIdx >= 0 ? activeVersionIdx : versions.length - 1);
  }

  var tick = function() {
    var left = Math.max(0, (sleepEndAt - Date.now()) / 1000);
    fadeFactor = left <= 60 ? Math.max(0, left / 60) : 1.0;
    syncEngine();

    var m = Math.floor(left / 60);
    var s = Math.floor(left % 60);
    var label = m + ":" + (s < 10 ? "0" : "") + s;
    setTimerLabel(label);
    document.getElementById("lightsOutTimer").textContent = "将在 " + label + " 后渐弱熄声";

    if (left <= 0) {
      clearSleepTimer();
      pauseAll();
      timerStepIdx = 0;
      setTimerLabel("定时");
      timerBtn.classList.remove("on");
      document.getElementById("lightsOutTimer").textContent = "晚安，已轻轻停下";
    }
  };
  tick();
  sleepTimerId = setInterval(tick, 1000);
};

document.getElementById("lightsOutBtn").onclick = function() {
  if (!isPlaying && versions.length > 0) {
    playVersion(activeVersionIdx >= 0 ? activeVersionIdx : versions.length - 1);
  }
  document.body.classList.add("lights-out");
};
document.getElementById("lightsOutOverlay").onclick = function() {
  document.body.classList.remove("lights-out");
};

miniPlayBtn.onclick = function() {
  if (isPlaying) {
    pauseAll();
  } else if (versions.length > 0) {
    playVersion(activeVersionIdx >= 0 ? activeVersionIdx : versions.length - 1);
  }
};

document.getElementById("masterVol").oninput = function() {
  var val = parseInt(this.value, 10) || 0;
  masterVolume = val / 100;
  document.getElementById("masterVolPct").textContent = val + "%";
  syncEngine();
};

function resetConversation() {
  pauseAll();
  clearSleepTimer();
  clearBgTask();
  clearConvState();
  timerStepIdx = 0;
  setTimerLabel("定时");
  timerBtn.classList.remove("on");
  versions = [];
  chatHistory = [];
  chatItems = [];
  initialPrompt = "";
  qaRound = 0;
  inConversation = false;
  activeVersionIdx = -1;
  isSending = false;
  genBtn.disabled = false;
  chatStream.innerHTML = "";
  setStatus("");
  updatePlaybackUI();
  sayInput.focus();
}
newChatBtn.onclick = resetConversation;

genBtn.onclick = function() { sendTurn(sayInput.value, false); };
sayInput.addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendTurn(this.value, false);
  }
});

function restoreConvState() {
  try {
    var raw = sessionStorage.getItem(CONV_KEY);
    if (!raw) return false;
    var saved = JSON.parse(raw);
    if (!saved || !Array.isArray(saved.chatItems) || saved.chatItems.length === 0) return false;
    if (saved.hadToken && !yToken()) {
      clearConvState();
      return false;
    }
    versions = Array.isArray(saved.versions) ? saved.versions : [];
    chatHistory = Array.isArray(saved.chatHistory) ? saved.chatHistory : [];
    chatItems = saved.chatItems;
    initialPrompt = saved.initialPrompt || "";
    qaRound = saved.qaRound || 0;
    activeVersionIdx = typeof saved.activeVersionIdx === "number" ? saved.activeVersionIdx : (versions.length - 1);
    inConversation = true;

    for (var i = 0; i < chatItems.length; i++) {
      var item = chatItems[i];
      if (!item) continue;
      if (item.type === "user") appendUserBubble(item.text || "", true);
      else if (item.type === "ask") appendAskCard(item.data || {}, true);
      else if (item.type === "blocked") appendBlockedCard(item.data || {}, true);
      else if (item.type === "ver" && versions[item.verIdx]) {
        appendAiTurnCard(versions[item.verIdx], item.verIdx, true);
      }
    }
    // 恢复末尾版本号的快捷微调芯片
    if (versions.length > 0) {
      var lastVer = versions[versions.length - 1];
      var cols = chatStream.querySelectorAll(".msg-ai-col");
      var lastCol = cols.length ? cols[cols.length - 1] : null;
      if (lastCol && lastVer.followups && lastVer.followups.length > 0) {
        var fStrip = document.createElement("div");
        fStrip.className = "followup-strip";
        for (var fi = 0; fi < lastVer.followups.length; fi++) {
          (function(txt) {
            var chip = document.createElement("button");
            chip.type = "button";
            chip.className = "y-chip";
            chip.textContent = txt;
            chip.onclick = function() { sendTurn(txt, true); };
            fStrip.appendChild(chip);
          })(lastVer.followups[fi]);
        }
        lastCol.appendChild(fStrip);
      }
    }
    return true;
  } catch (e) {
    return false;
  }
}

// 初始化
renderStarters();
restoreConvState();
updatePlaybackUI();
autoResizeSay();
loadMemory();
loadQuota();

// 页面加载时：如果有未完成的后台任务，保持对话态并恢复轮询
try {
  var savedTask = localStorage.getItem(BG_TASK_KEY);
  if (savedTask) {
    bgTaskId = savedTask;
    bgContext = { say: "", forceCompose: false };
    inConversation = true;
    updatePlaybackUI();
    setStatus("正在取回后台生成结果…");
    genBtn.disabled = true;
    isSending = true;
    pollBgTask();
  }
} catch (e) {}

var params = new URLSearchParams(location.search);
var fromQuery = params.get("say");
if (fromQuery) {
  if (params.get("auto") === "1") {
    initialPrompt = fromQuery;
    sendTurn(fromQuery, false);
  } else {
    sayInput.value = fromQuery;
    autoResizeSay();
    sayInput.focus();
  }
}
</script>
