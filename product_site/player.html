<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>夜息 · 正在播放</title>
<link rel="stylesheet" href="theme.css?v=13">
<style>
  html,body{height:100%}
  body{
    overflow:hidden;
    background:#07050d;
  }
  /* 夜底：暖月光晕 + 水面，随时间慢慢暗下去 */
  .stage{
    position:fixed;inset:0;transition:opacity 0.8s var(--y-ease);
    background-image:
      radial-gradient(circle at 50% 28%, rgba(var(--y-warm-rgb), 0.16), transparent 46%),
      radial-gradient(120% 80% at 20% 100%, rgba(142, 116, 232, 0.14), transparent 60%),
      linear-gradient(180deg, #100b1d 0%, #07050d 72%);
  }
  .moon{
    position:absolute;left:50%;top:19%;transform:translateX(-50%);
    width:118px;height:118px;border-radius:50%;
    background:radial-gradient(circle at 36% 34%, #fbf3e6 0%, #e9cfa6 48%, rgba(233, 183, 131, 0.25) 78%, transparent 82%);
    box-shadow:0 0 64px 18px rgba(var(--y-warm-rgb), 0.26);
    animation:breathe 6.5s ease-in-out infinite;
  }
  .water{
    position:absolute;left:0;right:0;bottom:0;height:42%;
    background:linear-gradient(180deg, rgba(var(--y-warm-rgb), 0.04), rgba(7, 5, 13, 0.94));
    border-top:1px solid rgba(255, 255, 255, 0.06);
  }
  @keyframes breathe{
    0%,100%{opacity:.78;transform:translateX(-50%) scale(0.98)}
    50%{opacity:1;transform:translateX(-50%) scale(1.05)}
  }

  /* 内容层：控件会随时间淡出 */
  .ui{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
    padding:22px 20px max(24px,env(safe-area-inset-bottom));transition:opacity 0.7s var(--y-ease)}
  .top{display:flex;align-items:center;justify-content:space-between;padding:0}
  .back{color:var(--y-text-sub);text-decoration:none;font-size:13px;letter-spacing:.08em;background:rgba(255,255,255,.065);
    border:none;border-radius:999px;padding:7px 14px;transition:background .5s ease,color .5s ease}
  .back:hover{background:rgba(var(--y-warm-rgb),.16);color:#fff}
  .mode-chip{font-size:12px;letter-spacing:.08em;color:var(--y-text-sub);border:none;
    border-radius:999px;padding:7px 14px;background:rgba(255,255,255,.065);cursor:pointer;transition:background .5s ease,color .5s ease}
  .mode-chip:hover{background:rgba(var(--y-warm-rgb),.16);color:#fff}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;margin-top:-36px;transition:opacity 0.6s ease}
  .title{font-family:var(--y-serif);font-size:clamp(24px,4vw,32px);font-weight:300;letter-spacing:.16em;color:#fbf7ff}
  .subtitle{font-size:13.5px;letter-spacing:.06em;color:var(--y-text-sub);margin-top:10px}
  .timer-left{font-size:12.5px;letter-spacing:.12em;color:var(--y-warm);margin-top:18px;min-height:18px}

  .controls{display:flex;flex-direction:column;gap:12px;transition:opacity 0.6s ease}
  .ctrl-row{display:flex;gap:12px;justify-content:center;align-items:center}
  .btn{border:none;background:rgba(255,255,255,.065);
    color:var(--y-text-sub);border-radius:999px;padding:12px 20px;font-size:13.5px;letter-spacing:.08em;cursor:pointer;
    font-family:inherit;min-height:46px;transition:color .5s ease,background .5s ease}
  .btn:hover{background:rgba(var(--y-warm-rgb),.16);color:#fff}
  .btn.pause{width:64px;height:64px;border-radius:50%;padding:0;font-size:18px;
    border:1px solid rgba(var(--y-warm-rgb),.45);background:radial-gradient(circle at 38% 32%,rgba(255,246,232,.22),rgba(255,255,255,.04) 60%),rgba(20,14,30,.45);
    color:#fff8ee;box-shadow:0 0 28px rgba(var(--y-warm-rgb),.22)}
  .timers{display:none;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
  .timers.open{display:flex}
  .timer{border:none;background:rgba(255,255,255,.055);
    color:var(--y-text-sub);border-radius:999px;padding:8px 15px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:background .45s ease,color .45s ease}
  .timer.on{background:rgba(var(--y-warm-rgb),.22);color:#fff7eb}
  .hint{font-size:11.5px;letter-spacing:.1em;color:var(--y-text-muted);text-align:center;margin-top:6px;line-height:1.6;min-height:16px}

  .goodnight{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;background:#07050d;z-index:50;transition:opacity 0.8s ease}
  .goodnight.show{display:flex}
  .goodnight .g-moon{width:88px;height:88px;border-radius:50%;font-size:0;color:transparent;
    border:1px solid rgba(var(--y-warm-rgb),.45);background:radial-gradient(circle,rgba(var(--y-warm-rgb),.16),transparent 70%);
    box-shadow:0 0 42px rgba(var(--y-warm-rgb),.22)}
  .goodnight .g-t{font-family:var(--y-serif);font-weight:300;font-size:24px;letter-spacing:.4em;color:#fbf7ff;margin-top:24px}
  .goodnight .g-back{margin-top:36px;padding:11px 26px;border:1px solid rgba(var(--y-warm-rgb),.45);
    border-radius:999px;background:rgba(var(--y-warm-rgb),.10);color:#f3e6d6;
    font-family:inherit;font-size:13px;letter-spacing:.08em;cursor:pointer}
  .goodnight .g-back:active{background:rgba(var(--y-warm-rgb),.22)}

  audio{display:none}
  @media(prefers-reduced-motion:reduce){
    .moon{animation:none}
    .stage,.ui,.goodnight{transition:none}
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="moon"></div>
  <div class="water"></div>
  <div class="ambient-grain"></div>
</div>

<div class="ui" id="ui">
  <div class="top">
    <a class="back" href="javascript:history.back()">‹ 返回</a>
    <div class="mode-chip" id="modeChip">☾ 睡眠模式</div>
  </div>

  <div class="center" id="center">
    <div class="title" id="trackTitle">正在播放</div>
    <div class="subtitle" id="trackSub">真实录音 · 零处理</div>
    <div class="timer-left" id="timerLeft"></div>
  </div>

  <div class="controls" id="controls">
    <div class="timers" id="timers">
      <button class="timer" data-min="15">15 分钟</button>
      <button class="timer" data-min="30" id="t30">30 分钟</button>
      <button class="timer" data-min="60">60 分钟</button>
      <button class="timer" data-min="0" id="t0">不限时</button>
    </div>
    <div class="ctrl-row">
      <button class="btn" id="timerBtn">⏱ 定时</button>
      <button class="btn pause" id="pauseBtn" aria-label="暂停">❚❚</button>
      <button class="btn" id="backBtn">↩ 返回</button>
    </div>
    <div class="hint" id="hint">音量用手机侧键调节 · 锁屏后声音继续</div>
  </div>
</div>

<div class="goodnight" id="goodnight">
  <div class="g-moon">☾</div>
  <div class="g-t">晚安</div>
  <!-- 以前这里只有月亮和字，全屏盖住后没有任何出口，只能清后台。
       给一个明确的返回按钮，点屏幕任意处也能退出。 -->
  <button class="g-back" id="goodnightBack" type="button">回到夜息 ›</button>
</div>

<audio id="audio" loop preload="auto"></audio>

<script>
// 只调播放音量和界面明暗，不对音频素材做任何处理（铁律 2）
var API="";
var audio=document.getElementById("audio");
var play=sessionStorage.getItem("yezi_play");

if(play){
  try{
    var info=JSON.parse(play);
    document.getElementById("trackTitle").textContent=info.title||"正在播放";
    var names=[];
    for(var i=0;i<info.items.length;i++) names.push(info.items[i].path);
    document.getElementById("trackSub").textContent=names.join(" + ")+" · 真实录音 零处理";
    audio.src=API+info.audio;
    audio.play().catch(function(){});
    // 锁屏界面显示配方名和暂停键
    if("mediaSession" in navigator){
      navigator.mediaSession.metadata=new MediaMetadata({
        title:info.title||"夜息",artist:"夜息",album:"助眠声音"
      });
      navigator.mediaSession.setActionHandler("play",function(){audio.play();});
      navigator.mediaSession.setActionHandler("pause",function(){audio.pause();});
    }
  }catch(e){}
}

// 22:00-06:00 预选 30 分钟，其他时间不限时
var hour=new Date().getHours();
var isNight=hour>=22||hour<6;
var timerMin=isNight?30:0;
var mode="sleep";
var fadeTimer=null;
var fadeStart=0;
var fadeFrom=1;

function applyTimerPreset(){
  var t30=document.getElementById("t30");
  var t0=document.getElementById("t0");
  t30.classList.toggle("on",isNight);
  t0.classList.toggle("on",!isNight);
}
applyTimerPreset();

document.getElementById("pauseBtn").onclick=function(){
  if(audio.paused){audio.play();this.textContent="❚❚";}
  else{audio.pause();this.textContent="▶";}
};
audio.onplay=function(){document.getElementById("pauseBtn").textContent="❚❚";};
audio.onpause=function(){document.getElementById("pauseBtn").textContent="▶";};

document.getElementById("timerBtn").onclick=function(){
  document.getElementById("timers").classList.toggle("open");
};
var timerBtns=document.querySelectorAll(".timer");
for(var i=0;i<timerBtns.length;i++){
  timerBtns[i].onclick=function(){
    for(var j=0;j<timerBtns.length;j++) timerBtns[j].classList.remove("on");
    this.classList.add("on");
    timerMin=parseInt(this.getAttribute("data-min"));
    startTimer();
  };
}

function startTimer(){
  if(fadeTimer){clearInterval(fadeTimer);fadeTimer=null;}
  document.getElementById("timerLeft").textContent="";
  if(mode!=="sleep"||timerMin<=0) return;
  var total=timerMin*60;
  var endAt=Date.now()+total*1000;
  fadeTimer=setInterval(function(){
    var left=Math.max(0,(endAt-Date.now())/1000);
    if(left<=60){
      // 最后 60 秒：只线性降低播放音量，不碰素材
      audio.volume=Math.max(0,left/60);
    }
    var m=Math.floor(left/60),s=Math.floor(left%60);
    document.getElementById("timerLeft").textContent=
      (timerMin>=60?("还剩 "+m+" 分钟"):("还剩 "+m+":"+(s<10?"0":"")+s));
    if(left<=0){
      clearInterval(fadeTimer);fadeTimer=null;
      audio.pause();
      document.getElementById("goodnight").classList.add("show");
    }
  },1000);
}
if(timerMin>0) startTimer();

// 睡眠模式：2 分钟后控件淡出、画面变暗；专注模式保持
document.getElementById("modeChip").onclick=function(){
  if(mode==="sleep"){
    mode="focus";
    this.textContent="✦ 专注模式";
    document.getElementById("ui").style.opacity="1";
    document.getElementById("stage").style.opacity="1";
    if(fadeTimer){clearInterval(fadeTimer);fadeTimer=null;}
    document.getElementById("timerLeft").textContent="";
  }else{
    mode="sleep";
    this.textContent="☾ 睡眠模式";
  }
};

setTimeout(function(){
  if(mode!=="sleep") return;
  document.getElementById("controls").style.opacity="0";
  document.getElementById("center").style.opacity="0";
  document.getElementById("stage").style.opacity=".55";
  setTimeout(function(){
    document.getElementById("ui").style.pointerEvents="none";
  },1300);
},120000);

// 任意触摸重新唤出控件
document.addEventListener("touchstart",function(){
  if(mode!=="sleep") return;
  document.getElementById("controls").style.opacity="1";
  document.getElementById("center").style.opacity="1";
  document.getElementById("stage").style.opacity="1";
  document.getElementById("ui").style.pointerEvents="auto";
},false);

document.getElementById("backBtn").onclick=function(){history.back();};

// 晚安界面：定时结束后全屏盖住，必须能退出（之前只能清后台）
function leavePlayer(){
  // 有上一页就返回，没有就直接回首页，避免按了没反应
  if(history.length>1) history.back(); else location.replace("home.html");
}
var gn=document.getElementById("goodnight");
var gnBack=document.getElementById("goodnightBack");
if(gnBack) gnBack.onclick=function(e){ e.stopPropagation(); leavePlayer(); };
if(gn) gn.onclick=leavePlayer;  // 点月亮/空白处也能退
// 键盘 Esc / 安卓物理返回键：直接退，不等浏览器默认行为
document.addEventListener("keydown",function(e){
  if(gn && gn.classList.contains("show") && e.key==="Escape") leavePlayer();
});
</script>
</body>
</html>
