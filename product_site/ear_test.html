<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>夜息 · 听觉图鉴</title>
<link rel="stylesheet" href="theme.css?v=12">
<style>
  .wrap-test {
    position: relative;
    z-index: 1;
    max-width: 920px;
    margin: 0 auto;
    padding: 0 clamp(18px, 4vw, 32px) 124px;
  }
  @media (min-width: 720px) {
    .wrap-test {
      padding-bottom: 72px;
    }
  }

  .progress-wrap {
    margin-bottom: 18px;
  }
  .progress-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--y-text-sub);
    margin-bottom: 8px;
  }
  .progress-track {
    height: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 25%;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(var(--y-warm-rgb), 0.65), var(--y-warm));
    box-shadow: 0 0 14px rgba(var(--y-warm-rgb), 0.5);
    transition: width 0.5s var(--y-ease);
  }

  .round-title {
    font-family: var(--y-serif);
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: #fbf7ff;
    margin: 0 0 4px;
  }
  .round-sub {
    font-size: 13.5px;
    color: var(--y-text-sub);
    margin: 0 0 14px;
  }

  .ab-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
  }
  @media (min-width: 580px) {
    .ab-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  .ab-item {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }

  /* 两张卡就是两块画面，点击画面即试听 */
  .ab-card {
    position: relative;
    aspect-ratio: 5 / 4;
    border-radius: 6px;
    overflow: hidden;
    background: #110d1a;
    cursor: pointer;
    box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.85);
    transition: box-shadow 0.8s var(--y-ease);
  }
  .ab-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    filter: saturate(0.55) brightness(0.6) contrast(1.05) sepia(0.14);
    transform: scale(1.02);
    transition: transform 6s var(--y-ease), filter 0.8s ease;
  }
  .ab-card:hover .ab-bg {
    transform: scale(1.08);
    filter: saturate(0.7) brightness(0.72) contrast(1.05) sepia(0.12);
  }
  .ab-card.playing {
    box-shadow: 0 24px 64px -18px rgba(var(--y-warm-rgb), 0.45);
  }
  .ab-card.playing .ab-bg {
    transform: scale(1.06);
    filter: saturate(0.72) brightness(0.7) contrast(1.05) sepia(0.12);
  }
  .ab-shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(7, 5, 13, 0) 34%, rgba(7, 5, 13, 0.92) 100%);
  }
  .ab-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 2;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: #fff3e2;
    background: rgba(var(--y-warm-rgb), 0.22);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 999px;
    padding: 3px 9px;
  }
  .ab-text {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 14px;
    z-index: 2;
  }
  .ab-name {
    font-family: var(--y-serif);
    font-size: 19px;
    font-weight: 400;
    letter-spacing: 0.12em;
    line-height: 1.4;
    color: #fbf6ff;
  }
  .ab-desc {
    margin-top: 5px;
    font-size: 13px;
    line-height: 1.6;
    color: rgba(236, 228, 248, 0.7);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .ab-row {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .ab-play {
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.07em;
    color: var(--y-text-sub);
    cursor: pointer;
    transition: color 0.45s ease;
  }
  .ab-play:hover {
    color: #fff;
  }
  .ab-pick {
    background: none;
    border: none;
    padding: 0;
    margin-left: auto;
    font-family: inherit;
    font-size: 13.5px;
    letter-spacing: 0.08em;
    color: var(--y-warm);
    cursor: pointer;
    transition: color 0.45s ease;
  }
  .ab-pick:hover {
    color: #ffe9cd;
  }

  .round-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    font-size: 13px;
    color: var(--y-text-muted);
  }
  .back-step-btn {
    background: transparent;
    border: none;
    color: #cdb8ff;
    font-size: 13.5px;
    cursor: pointer;
    font-family: inherit;
    padding: 4px 2px;
  }
  .back-step-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  /* 耳朵人格报告结果页 */
  /* 结果页：不套卡片，报告直接落在夜色上 */
  .result-hero {
    position: relative;
    padding: 8px 0 0;
    text-align: center;
    background: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    box-shadow: none;
    border-radius: 0;
    overflow: visible;
  }
  .result-bg {
    position: absolute;
    left: 50%;
    top: -30px;
    width: 460px;
    height: 330px;
    margin-left: -230px;
    background-size: cover;
    background-position: center;
    opacity: 0.16;
    filter: blur(34px) saturate(0.9);
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }
  /* 同样垫一层没有边缘的墨，免得字压在雨丝上发灰 */
  .result-hero::before {
    content: "";
    position: absolute;
    left: -12%;
    right: -12%;
    top: -70px;
    bottom: -50px;
    background: radial-gradient(58% 56% at 50% 40%,
      rgba(7, 5, 13, 0.74) 0%,
      rgba(7, 5, 13, 0.42) 56%,
      rgba(7, 5, 13, 0) 82%);
    pointer-events: none;
    z-index: 0;
  }
  .result-body {
    position: relative;
    z-index: 1;
  }
  .result-orb {
    width: 68px;
    height: 68px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 1px solid rgba(var(--y-warm-rgb), 0.4);
    background: radial-gradient(circle at 36% 34%, rgba(251, 243, 230, 0.24), rgba(var(--y-warm-rgb), 0.12) 65%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    box-shadow: 0 0 40px rgba(var(--y-warm-rgb), 0.22);
  }
  .result-kicker {
    font-size: 12.5px;
    color: rgba(var(--y-warm-rgb), 0.85);
    letter-spacing: 0.26em;
  }
  .result-title {
    margin: 12px 0 12px;
    font-family: var(--y-serif);
    font-size: clamp(30px, 4.2vw, 40px);
    font-weight: 300;
    color: #fbf7ff;
    letter-spacing: 0.16em;
  }
  .result-tagline {
    font-size: 14.5px;
    color: var(--y-text-sub);
    max-width: 30em;
    margin: 0 auto 6px;
    line-height: 1.85;
  }

  /* 四条维度：不再是卡片里的小卡片，直接排成四行 */
  .dim-card {
    background: none;
    border: none;
    border-radius: 0;
    padding: 0;
    margin: 34px auto 0;
    max-width: 560px;
    text-align: left;
  }
  .dim-row + .dim-row {
    margin-top: 15px;
  }
  .dim-top {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--y-text-sub);
    margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
  }
  .dim-bar {
    height: 2px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  .dim-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(var(--y-warm-rgb), 0.6), var(--y-warm));
    transition: width 0.6s var(--y-ease);
  }

  /* 配方：一条细线分隔，暖色只标在"专属"两个字上 */
  .recipe-box {
    background: none;
    border: none;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 0;
    padding: 18px 0 0;
    margin: 34px auto 0;
    max-width: 560px;
    text-align: left;
  }
  .recipe-box-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .recipe-box-title {
    font-size: 12.5px;
    font-weight: 400;
    letter-spacing: 0.16em;
    color: var(--y-text-sub);
  }
  .recipe-box-head .y-btn-ghost {
    background: none;
    padding: 0;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--y-warm);
    border-radius: 0;
  }
  .recipe-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .recipe-pill {
    font-size: 12px;
    color: var(--y-text-sub);
    background: rgba(255, 255, 255, 0.05);
    border: none;
    border-radius: 999px;
    padding: 3px 9px;
  }

  .result-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    margin-top: 40px;
  }
  .result-actions .y-btn-primary {
    min-width: 210px;
    padding: 12px 26px;
    font-size: 14.5px;
  }
  .result-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 26px;
  }
  .result-link {
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
    font-size: 13.5px;
    letter-spacing: 0.06em;
    color: var(--y-text-muted);
    cursor: pointer;
    transition: color 0.45s ease;
  }
  .result-link:hover {
    color: var(--y-text);
  }

  .result-status {
    margin-top: 10px;
    font-size: 13px;
    color: #d6c2ff;
    min-height: 18px;
  }
</style>
</head>
<body>
<div class="ambient-stage" id="ambientStage"></div>

<div class="wrap-test">
  <div class="top">
    <a class="brand" href="home.html">
      <div class="moon"></div>
      <div class="name">夜息</div>
    </a>
  </div>

  <!-- 盲测进行中视图 -->
  <div id="quizView">
    <header class="page-hero">
      <div class="ph-row">
        <h1>听觉图鉴</h1>
      </div>
      <p class="ph-sub">听两段，选更舒服的那段，5 组盲测描绘你的声音偏好。</p>
    </header>

    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="stepLabel">第 1 / 5 组</span>
        <span id="roundDimLabel">雨幕质感</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="round-box">
      <h2 class="round-title" id="roundTitle">哪一种雨声更让你松弛？</h2>
      <div class="round-sub" id="roundSub">各听几秒，凭第一直觉点「选这段」即可</div>

      <div class="ab-grid" id="abGrid"></div>

      <div class="round-foot">
        <button type="button" class="back-step-btn" id="prevBtn">‹ 上一组</button>
        <span id="previewHint">真实 CC0 录音 · 零音质篡改</span>
      </div>
    </div>
  </div>

  <!-- 耳朵人格报告结果视图 -->
  <div id="resultView" style="display:none">
    <div class="result-hero">
      <div class="result-bg" id="resultBg"></div>
      <div class="result-body">
        <div class="result-orb" id="resultIcon">🌧</div>
        <div class="result-kicker">☾ 你的夜息听觉图鉴</div>
        <h1 class="result-title" id="resultTitle">屋檐避雨型</h1>
        <div class="result-tagline" id="resultTagline"></div>

        <div class="dim-card" id="dimCard"></div>

        <div class="recipe-box">
          <div class="recipe-box-head">
            <span class="recipe-box-title">✦ 专属起眠声景配方</span>
            <button type="button" class="y-btn-ghost" id="playReportBtn" style="padding:5px 12px;font-size:13px;">▶ 试听专属声景</button>
          </div>
          <div class="recipe-pills" id="resultRecipePills"></div>
        </div>

        <div class="result-actions">
          <button type="button" class="y-btn-primary" id="toAgentBtn">✦ 按档案 AI 配声</button>
          <div class="result-links">
            <button type="button" class="result-link" id="toDiyBtn">带进 DIY 精调</button>
            <button type="button" class="result-link" id="savePosterBtn">保存耳朵人格海报</button>
            <button type="button" class="result-link" id="retestBtn">重新测试</button>
          </div>
        </div>
        <div class="result-status" id="resultStatus"></div>
      </div>
    </div>
  </div>

  <div class="foot">测出的偏好会自动写入你的耳朵档案 · 让 AI 和调音台越来越懂你</div>
</div>

<div class="tabbar"></div>

<script src="auth_ui.js"></script>
<script src="yexi_shell.js"></script>
<script src="yexi_catalog.js"></script>
<script src="yexi_mixer.js?v=13"></script>

var currentStep = 0;
var answers = [];
var previewAudio = new Audio();
previewAudio.loop = true;
var playingSide = "";
var previewReqId = 0;
var currentProfile = null;
var reportMixer = null;
var reportPlaying = false;

if (typeof YexiMixer !== "undefined" && YexiMixer.isSupported()) {
  reportMixer = new YexiMixer({ apiBase: API });
}

function preloadRoundAudio(stepIdx) {
  if (!reportMixer) return;
  var targets = [];
  if (ROUNDS[stepIdx]) {
    targets.push({ path: ROUNDS[stepIdx].a.path }, { path: ROUNDS[stepIdx].b.path });
  }
  if (ROUNDS[stepIdx + 1]) {
    targets.push({ path: ROUNDS[stepIdx + 1].a.path }, { path: ROUNDS[stepIdx + 1].b.path });
  }
  if (targets.length) {
    reportMixer.preloadTracks(targets).catch(function() {});
  }
}

function stopAbPreview() {
  previewReqId += 1;
  previewAudio.pause();
  previewAudio.removeAttribute("src");
  if (reportMixer && !reportPlaying) {
    reportMixer.setPlaying(false);
    reportMixer.syncTracks([]);
  }
  playingSide = "";
  var cards = document.querySelectorAll(".ab-card");
  for (var i = 0; i < cards.length; i++) {
    cards[i].classList.remove("playing");
  }
  var btns = document.querySelectorAll(".ab-play-btn");
  for (var j = 0; j < btns.length; j++) {
    btns[j].textContent = "▶ 试听";
  }
}

function stopReportPreview() {
  reportPlaying = false;
  if (reportMixer) reportMixer.setPlaying(false);
  var btn = document.getElementById("playReportBtn");
  if (btn) btn.textContent = "▶ 试听专属声景";
}

function toggleAbPreview(side, opt) {
  var meta = ySoundMeta(opt.path);
  if (playingSide === side) {
    stopAbPreview();
    ySetAmbient(meta.img, meta.accent, false);
    document.getElementById("previewHint").textContent = "已暂停试听";
    return;
  }
  stopAbPreview();
  playingSide = side;
  var reqId = previewReqId;

  var card = document.getElementById("abCard_" + side);
  var btn = document.getElementById("abPlay_" + side);
  if (card) card.classList.add("playing");
  ySetAmbient(meta.img, meta.accent, true);

  // 走 YexiMixer 播放：自动对齐响度（修复夜营微火/乡村小雨等轻录音音量过小像没声音的问题）+ 预加载秒播
  if (reportMixer) {
    reportMixer._ensureContext();
    var ready = !!reportMixer.buffers[opt.path];
    if (!ready) {
      if (btn) btn.textContent = "加载中…";
      document.getElementById("previewHint").textContent = "正在载入「" + opt.title + "」…";
    }
    reportMixer.loadBuffer(opt.path).then(function() {
      if (reqId !== previewReqId || playingSide !== side) return;
      reportMixer.syncTracks([{ path: opt.path, weight: 1, pan: 0, mode: "loop", density: 0.4 }]);
      reportMixer.setMasterVolume(0.95);
      reportMixer.setPlaying(true);
      if (btn) btn.textContent = "❚❚ 暂停";
      document.getElementById("previewHint").textContent = "正在试听「" + opt.title + "」";
    }).catch(function() {
      if (reqId !== previewReqId || playingSide !== side) return;
      if (btn) btn.textContent = "▶ 试听";
      if (card) card.classList.remove("playing");
      playingSide = "";
      document.getElementById("previewHint").textContent = "音频加载失败，请重试";
    });
    return;
  }

  previewAudio.src = API + "/api/asset?name=" + encodeURIComponent(opt.path);
  previewAudio.play().catch(function() {});
  if (btn) btn.textContent = "❚❚ 暂停";
  document.getElementById("previewHint").textContent = "正在试听「" + opt.title + "」";
}

function renderRound() {
  stopAbPreview();
  preloadRoundAudio(currentStep);
  var r = ROUNDS[currentStep];
  document.getElementById("stepLabel").textContent = "第 " + (currentStep + 1) + " / " + ROUNDS.length + " 组";
  document.getElementById("roundDimLabel").textContent = r.dim;
  document.getElementById("progressFill").style.width = (((currentStep + 1) / ROUNDS.length) * 100) + "%";
  document.getElementById("roundTitle").textContent = r.title;
  document.getElementById("roundSub").textContent = r.sub;
  document.getElementById("prevBtn").disabled = currentStep === 0;
  document.getElementById("previewHint").textContent = "真实 CC0 录音 · 零音质篡改";

  var grid = document.getElementById("abGrid");
  grid.innerHTML = "";

  var sides = ["a", "b"];
  for (var i = 0; i < sides.length; i++) {
    (function(side) {
      var opt = r[side];
      var meta = ySoundMeta(opt.path);
      var card = document.createElement("div");
      var wrap = document.createElement("div");
      wrap.className = "ab-item";
      card.className = "ab-card";
      card.id = "abCard_" + side;
      card.innerHTML =
        '<div class="ab-bg" style="background-image:url(' + meta.img + ')"></div>' +
        '<div class="ab-shade"></div>' +
        '<span class="ab-badge">' + yEscape(opt.badge) + '</span>' +
        '<div class="ab-text">' +
          '<div class="ab-name">' + yEscape(opt.title) + '</div>' +
          '<div class="ab-desc">' + yEscape(opt.desc) + '</div>' +
        '</div>';
      wrap.innerHTML =
        '<div class="ab-row">' +
          '<button type="button" class="y-btn-ghost ab-play ab-play-btn" id="abPlay_' + side + '">▶ 试听</button>' +
          '<button type="button" class="ab-pick" id="abPick_' + side + '">选这段 ›</button>' +
        '</div>';
      wrap.insertBefore(card, wrap.firstChild);
      grid.appendChild(wrap);

      card.onclick = function() {
        toggleAbPreview(side, opt);
      };
      document.getElementById("abPlay_" + side).onclick = function() {
        toggleAbPreview(side, opt);
      };
      document.getElementById("abPick_" + side).onclick = function() {
        pickOption(side);
      };
    })(sides[i]);
  }
}

function computeProfile(ans) {
  var c0 = ans[0] || "a";
  var c1 = ans[1] || "a";
  var c2 = ans[2] || "a";
  var c3 = ans[3] || "a";
  var c4 = ans[4] || "a";

  var warmth = 30 + (c0 === "a" ? 25 : 0) + (c1 === "a" ? 18 : 0) + (c3 === "a" ? 24 : 0);
  var crisp  = 28 + (c0 === "b" ? 28 : 0) + (c2 === "b" ? 14 : 0) + (c3 === "b" ? 24 : 0);
  var space  = 32 + (c1 === "b" ? 36 : 0) + (c2 === "a" ? 24 : 0);
  var nature = 30 + (c0 === "b" ? 20 : 0) + (c2 === "b" ? 30 : 0) + (c3 === "b" ? 16 : 0);
  var immersion = 24 + (c4 === "b" ? 56 : 6) + (c0 === "b" ? 10 : 0) + (c2 === "b" ? 10 : 0);

  var archKey = "eaves_rain";
  if (c4 === "b") {
    // 偏好无人声轻情境：偏暖柔平稳 -> 午夜疗愈馆型；偏清脆颗粒/生活感 -> 雨夜书房型
    if ((c0 === "a" && c3 === "a") || c2 === "a") {
      archKey = "midnight_spa";
    } else {
      archKey = "rainy_study";
    }
  } else if (c0 === "a" && c1 === "a" && c3 === "a") {
    archKey = "warm_blanket";
  } else if (c0 === "a" && c1 === "a" && c3 === "b") {
    archKey = "eaves_rain";
  } else if (c1 === "b" && c2 === "a" && c3 === "a") {
    archKey = "deep_ocean";
  } else if (c1 === "b" && c2 === "b" && c3 === "a") {
    archKey = "deep_ocean";
  } else if (c2 === "b") {
    archKey = "summer_yard";
  } else if (c0 === "b" && c2 === "a") {
    archKey = "forest_drops";
  } else {
    archKey = "mountain_stream";
  }

  var arch = ARCHETYPES[archKey];
  return {
    archetype_id: arch.id,
    archetype_name: arch.name,
    icon: arch.icon,
    tagline: arch.tagline,
    prompt: arch.prompt,
    intent: arch.intent,
    img: arch.img,
    accent: arch.accent,
    scores: {
      warmth: Math.min(100, warmth),
      crisp: Math.min(100, crisp),
      space: Math.min(100, space),
      nature: Math.min(100, nature),
      immersion: Math.min(100, immersion)
    },
    tracks: arch.tracks
  };
}

function pickOption(side) {
  stopAbPreview();
  answers[currentStep] = side;
  if (currentStep + 1 < ROUNDS.length) {
    currentStep += 1;
    renderRound();
    return;
  }
  var profile = computeProfile(answers);
  saveAndShowReport(profile);
}

function saveLocalProfile(p) {
  try {
    localStorage.setItem(EAR_PROFILE_KEY, JSON.stringify(p));
  } catch (e) {}
}

function saveAndShowReport(profile) {
  currentProfile = profile;
  saveLocalProfile(profile);
  showReport(profile, "正在写入你的耳朵档案…");

  yPost("/api/ear_profile", profile)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d && d.ok && d.ear_profile) {
        currentProfile = mergeVisualMeta(d.ear_profile);
        saveLocalProfile(currentProfile);
        document.getElementById("resultStatus").textContent = "已写入你的夜息耳朵档案 · AI 配声与推荐将自动参考此偏好";
      }
    })
    .catch(function() {
      document.getElementById("resultStatus").textContent = "已暂存在本机浏览器，后续可直接带进 DIY 或保存海报";
    });
}

function mergeVisualMeta(prof) {
  if (!prof) return null;
  var arch = ARCHETYPES[prof.archetype_id];
  var lead = (prof.tracks && prof.tracks.length) ? ySoundMeta(prof.tracks[0].path) : ySoundMeta("");
  prof.img = prof.img || (arch ? arch.img : lead.img);
  prof.accent = prof.accent || (arch ? arch.accent : lead.accent);
  return prof;
}

function showReport(profile, statusMsg) {
  stopAbPreview();
  stopReportPreview();
  currentProfile = mergeVisualMeta(profile);

  document.getElementById("quizView").style.display = "none";
  document.getElementById("resultView").style.display = "block";
  document.getElementById("resultIcon").textContent = currentProfile.icon || "☾";
  document.getElementById("resultTitle").textContent = currentProfile.archetype_name || "夜息聆听者";
  document.getElementById("resultTagline").textContent = currentProfile.tagline || "";
  document.getElementById("resultBg").style.backgroundImage = "url(" + (currentProfile.img || "img/moon-water.jpg") + ")";
  document.getElementById("resultStatus").textContent = statusMsg || "已同步你的耳朵档案";

  ySetAmbient(currentProfile.img || "img/moon-water.jpg", currentProfile.accent || "#8e74e8", false);

  var DIMS = [
    { key: "warmth", label: "暖厚包裹" },
    { key: "crisp", label: "清脆颗粒" },
    { key: "space", label: "空间开阔" },
    { key: "nature", label: "自然生机" },
    { key: "immersion", label: "情境触发" }
  ];
  var scores = currentProfile.scores || {};
  var dimHtml = "";
  for (var i = 0; i < DIMS.length; i++) {
    var val = Math.max(0, Math.min(100, parseInt(scores[DIMS[i].key], 10) || 50));
    dimHtml +=
      '<div class="dim-row">' +
        '<div class="dim-top"><span>' + DIMS[i].label + '</span><span>' + val + '%</span></div>' +
        '<div class="dim-bar"><div class="dim-fill" style="width:' + val + '%"></div></div>' +
      '</div>';
  }
  document.getElementById("dimCard").innerHTML = dimHtml;

  var list = currentProfile.tracks || [];
  var pillsHtml = "";
  for (var j = 0; j < list.length; j++) {
    var m = ySoundMeta(list[j].path);
    var suffix = list[j].mode === "intermittent" ? ("偶发 " + Math.round((list[j].density || 0.4) * 100) + "%") : (Math.round((list[j].weight || 0) * 100) + "%");
    pillsHtml += '<span class="recipe-pill">' + m.icon + ' ' + yEscape(m.name) + ' · ' + suffix + '</span>';
  }
  document.getElementById("resultRecipePills").innerHTML = pillsHtml;
}

document.getElementById("prevBtn").onclick = function() {
  if (currentStep > 0) {
    currentStep -= 1;
    renderRound();
  }
};

document.getElementById("playReportBtn").onclick = function() {
  if (!currentProfile || !currentProfile.tracks || !reportMixer) return;
  if (reportPlaying) {
    stopReportPreview();
    ySetAmbient(currentProfile.img, currentProfile.accent, false);
    return;
  }
  reportPlaying = true;
  reportMixer.syncTracks(currentProfile.tracks);
  reportMixer.setMasterVolume(0.85);
  reportMixer.setPlaying(true);
  if (reportMixer.ctx && reportMixer.ctx.state === "suspended") {
    reportMixer.ctx.resume().catch(function() {});
  }
  this.textContent = "❚❚ 暂停试听";
  ySetAmbient(currentProfile.img, currentProfile.accent, true);
};

document.getElementById("toDiyBtn").onclick = function() {
  if (!currentProfile) return;
  stopReportPreview();
  var code = yEncodeMix({ title: currentProfile.archetype_name + "专属", tracks: currentProfile.tracks });
  if (code) {
    location.href = "index.html#mix=" + encodeURIComponent(code);
  } else {
    location.href = "index.html";
  }
};

document.getElementById("toAgentBtn").onclick = function() {
  if (!currentProfile) return;
  stopReportPreview();
  var p = currentProfile.prompt || "睡不着，想要让我放松的自然声音";
  location.href = "agent.html?say=" + encodeURIComponent(p) + "&auto=1";
};

document.getElementById("savePosterBtn").onclick = function() {
  if (!currentProfile) return;
  var st = document.getElementById("resultStatus");
  st.textContent = "正在生成耳朵人格海报…";
  yRenderEarReportPng(currentProfile, function() {
    st.textContent = "已下载「" + currentProfile.archetype_name + "_耳朵人格报告.png」";
  });
};

document.getElementById("retestBtn").onclick = function() {
  stopReportPreview();
  stopAbPreview();
  currentStep = 0;
  answers = [];
  document.getElementById("resultView").style.display = "none";
  document.getElementById("quizView").style.display = "block";
  renderRound();
};

// 初始化：若有已存档案（且未传 ?retest=1），直接展示报告；否则从第 1 组开始
var forceRetest = new URLSearchParams(location.search).get("retest") === "1";
renderRound();

if (!forceRetest) {
  var localSaved = null;
  try {
    var rawLocal = localStorage.getItem(EAR_PROFILE_KEY);
    localSaved = rawLocal ? JSON.parse(rawLocal) : null;
  } catch (e) {}

  yGet("/api/ear_profile")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var prof = (d && d.ear_profile && d.ear_profile.archetype_id) ? d.ear_profile : localSaved;
      if (prof && prof.archetype_id && currentStep === 0 && answers.length === 0) {
        saveLocalProfile(prof);
        showReport(prof, "这是你上次测出的耳朵档案 · 点「重新测试」可再测一次");
      }
    })
    .catch(function() {
      if (localSaved && localSaved.archetype_id && currentStep === 0 && answers.length === 0) {
        showReport(localSaved, "这是你上次测出的耳朵档案 · 点「重新测试」可再测一次");
      }
    });
}
