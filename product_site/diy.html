<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>夜息 · DIY</title>
<link rel="stylesheet" href="theme.css?v=12">
<style>
  /* app 式布局：tab 壳固定顶部，内容区占满剩余屏幕自己滚。
     这样嵌入视图里的 fixed 抽屉才是贴屏幕底，而不是贴一张很高的 iframe 底。 */
  html, body { height: 100%; }
  body {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 顶部 tab 壳：两个视图常驻，切换只改显示，不重新加载 */
  .diy-top {
    flex: 0 0 auto;
    position: relative;
    z-index: 5;
    background: rgba(7, 5, 13, 0.72);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .diy-top .wrap-wide { padding-bottom: 12px; }

  .diy-seg {
    display: inline-flex;
    gap: 4px;
    padding: 4px;
    max-width: 100%;
    border-radius: 999px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .diy-seg-btn {
    min-width: 104px;
    padding: 8px 18px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--y-text-muted);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .diy-seg-btn.on {
    background: rgba(233,183,131,0.14);
    color: var(--y-warm);
  }
  .diy-caption {
    margin: 10px 0 2px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--y-text-muted);
  }

  /* 创作路径：四步常驻，点一步就跳到对应控件；不是教程，不挡内容 */
  .diy-path {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .diy-path::-webkit-scrollbar { display: none; }
  .diy-step {
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.12);
    background: transparent;
    color: var(--y-text-muted);
    font-family: inherit;
    font-size: 11.5px;
    white-space: nowrap;
    cursor: pointer;
  }
  .diy-step .n {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    font-size: 10px;
  }
  /* 当前步：暖色实心 + 明显外发光，肉眼一眼能看到 */
  .diy-step.on {
    border: 1.5px solid #ffd39a;
    color: #ffe0b4;
    background: rgba(233,183,131,0.24);
    box-shadow: 0 0 18px rgba(255,190,120,0.45);
    animation: diy-step-breathe 2s ease-in-out infinite;
  }
  .diy-step.on .n {
    border-color: #ffd39a;
    background: rgba(255,198,130,0.32);
    color: #ffe6c6;
    font-weight: 700;
  }
  @keyframes diy-step-breathe {
    0%, 100% { box-shadow: 0 0 12px rgba(255,190,120,0.35); }
    50% { box-shadow: 0 0 28px rgba(255,190,120,0.8); }
  }
  .diy-step.done { color: #b9e6d6; border-color: rgba(94,196,168,0.45); }
  .diy-step.done .n { border-color: #5ec4a8; color: #5ec4a8; background: rgba(94,196,168,0.16); }
  /* 完成的步骤显示对勾，不靠数字猜进度 */
  .diy-step.done .n { font-size: 0; }
  .diy-step.done .n::after { content: "✓"; font-size: 11px; font-weight: 700; }
  /* 刚做完那一步：一次明显的暖光扫过，不是彩带、不是弹窗 */
  .diy-step.flash::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(100deg, transparent 10%, rgba(255,230,190,0.85) 50%, transparent 90%);
    animation: diy-step-glint 1.1s ease-out 1;
  }
  @keyframes diy-step-glint {
    from { transform: translateX(-120%); }
    to { transform: translateX(120%); }
  }
  .diy-path.finished .diy-step.done {
    color: #ffd39a;
    border-color: rgba(255,198,130,0.6);
    background: rgba(233,183,131,0.12);
  }
  .diy-step-arrow { flex: 0 0 auto; font-size: 10px; color: var(--y-text-muted); }
  .diy-path-hint {
    margin: 6px 0 0;
    font-size: 11px;
    color: var(--y-text-muted);
    line-height: 1.5;
  }
  .diy-path-hint.finished { color: #ffd39a; }
  /* 测试按钮：看一遍高光 / 重置进度 */
  .diy-path-tests { display: flex; gap: 14px; margin-top: 5px; }
  .diy-path-test {
    padding: 0;
    border: 0;
    border-bottom: 1px dashed rgba(255,255,255,0.18);
    background: transparent;
    color: var(--y-text-muted);
    font-family: inherit;
    font-size: 10.5px;
    line-height: 1.5;
    cursor: pointer;
  }
  .diy-path-test.primary { color: #ffd39a; border-bottom-color: rgba(255,198,130,0.6); }
  .diy-path-test:disabled { opacity: 0.45; cursor: default; }
  /* 引导条：贴着路径下面，讲这一步做什么；不遮播放器、不弹窗 */
  .diy-guide-bar {
    display: flex; align-items: center; gap: 8px;
    margin-top: 8px; padding: 8px 10px;
    border: 1px solid rgba(255,198,130,0.45);
    border-radius: 8px;
    background: rgba(233,183,131,0.12);
    font-size: 11.5px; line-height: 1.5;
  }
  .diy-guide-bar.hide { display: none; }
  .diy-guide-bar .g-step { color: #ffd39a; flex: 0 0 auto; font-weight: 400; }
  .diy-guide-bar .g-text { flex: 1 1 auto; color: #e9dcc7; }
  .diy-guide-bar .g-next, .diy-guide-bar .g-close {
    flex: 0 0 auto; border: 0; background: transparent;
    color: #ffd39a; font-family: inherit; font-size: 11px; cursor: pointer;
    padding: 0 2px;
  }
  .diy-guide-bar .g-next.hide { display: none; }
  .diy-guide-bar .g-close { color: #8f8a9c; font-size: 15px; }
  body.guide-locked .diy-panes { cursor: not-allowed; }
  @media (prefers-reduced-motion: reduce) {
    .diy-step.on { animation: none; box-shadow: 0 0 18px rgba(255,190,120,0.6); }
    .diy-step.flash::before { animation: none; background: none; }
  }

  .diy-panes {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    z-index: 1;
  }
  .diy-pane {
    position: absolute;
    inset: 0;
    display: none;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
  }
  .diy-pane.on { display: block; }

  @media (max-width: 420px) {
    .diy-seg-btn { min-width: 92px; padding: 8px 12px; font-size: 12.5px; }
  }
</style>
</head>
<body>
<div class="ambient-stage" id="ambientStage"></div>

<div class="diy-top">
  <div class="wrap-wide">
    <div class="top">
      <a class="brand" href="home.html">
        <div class="moon"><svg class="y-ico-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></div>
        <div class="name">夜息</div>
      </a>
    </div>
    <div class="diy-seg" role="tablist" aria-label="DIY 功能切换">
      <button type="button" class="diy-seg-btn on" data-pane="mix" role="tab" aria-selected="true" aria-controls="paneMix">做底层</button>
      <button type="button" class="diy-seg-btn" data-pane="stitch" role="tab" aria-selected="false" aria-controls="paneStitch">做拼接</button>
    </div>
    <p class="diy-caption" id="diyCaption">叠几层声音，拖出远近左右。</p>
    <div class="diy-path" id="diyPath" role="list" aria-label="创作路径">
      <button type="button" class="diy-step on" data-step="base" role="listitem"><span class="n">1</span>铺底</button>
      <span class="diy-step-arrow">›</span>
      <button type="button" class="diy-step" data-step="make" role="listitem"><span class="n">2</span>创作</button>
      <span class="diy-step-arrow">›</span>
      <button type="button" class="diy-step" data-step="save" role="listitem"><span class="n">3</span>保存</button>
      <span class="diy-step-arrow">›</span>
      <button type="button" class="diy-step" data-step="publish" role="listitem"><span class="n">4</span>发广场</button>
    </div>
    <p class="diy-path-hint" id="diyPathHint">先选一套，或者直接用已经给你铺好的。点任一步，直接跳到那里。</p>
    <div class="diy-path-tests">
      <button type="button" class="diy-path-test primary" id="diyGuideBtn">▶ 带着我做</button>
      <button type="button" class="diy-path-test" id="diyExplainBtn">高亮讲解</button>
      <button type="button" class="diy-path-test" id="diyResetBtn">重置进度</button>
    </div>
    <div class="diy-guide-bar hide" id="diyGuideBar" role="status" aria-live="polite">
      <span class="g-step" id="guideStepNo">1 / 4</span>
      <span class="g-text" id="guideText"></span>
      <button type="button" class="g-next hide" id="guideNext">下一步 ›</button>
      <button type="button" class="g-close" id="guideClose" aria-label="退出引导">×</button>
    </div>
  </div>
</div>

<div class="diy-panes" id="diyPanes">
  <iframe id="paneMix" class="diy-pane on" src="index.html?embed=1" title="做底层" aria-hidden="false"></iframe>
  <iframe id="paneStitch" class="diy-pane" src="stitch.html?embed=1" title="做拼接" aria-hidden="true"></iframe>
</div>

<div class="tabbar"></div>

<script src="auth_ui.js"></script>
<script src="yexi_shell.js"></script>
<script src="yexi_catalog.js?v=44"></script>
<script>
initAuthBar("diy.html");
initYexiTabbar("diy.html");
initAmbientStage("img/night-lake-stars.jpg", "#e9b783");

var paneMix = document.getElementById("paneMix");
var paneStitch = document.getElementById("paneStitch");
var panes = { mix: paneMix, stitch: paneStitch };
var captions = {
  mix: "叠几层声音，拖出远近左右。",
  stitch: "几段声音接成一整夜，点哪段就从哪段听。"
};
var currentPane = "mix";

function switchPane(name) {
  if (!panes[name]) return;
  if (name !== currentPane) {
    // 离开的那个先停声，避免两个视图同时出声
    try { panes[currentPane].contentWindow.postMessage({ type: "yexi-pause" }, "*"); } catch (e) {}
    currentPane = name;
    for (var k in panes) {
      if (!Object.prototype.hasOwnProperty.call(panes, k)) continue;
      panes[k].classList.toggle("on", k === name);
      panes[k].setAttribute("aria-hidden", k === name ? "false" : "true");
    }
    var allBtns = document.querySelectorAll(".diy-seg-btn");
    for (var i = 0; i < allBtns.length; i++) {
      var on = allBtns[i].getAttribute("data-pane") === name;
      allBtns[i].classList.toggle("on", on);
      allBtns[i].setAttribute("aria-selected", on ? "true" : "false");
    }
    document.getElementById("diyCaption").textContent = captions[name];
    try { history.replaceState(null, "", "diy.html?pane=" + name); } catch (e) {}
    // 布局是壳固定 + 视图内部滚动，所以滚回顶要滚 iframe 自己
    try { panes[name].contentWindow.scrollTo(0, 0); } catch (e) {}
  }
  // 重新量一次高度（刚显示出来时 iframe 尺寸可能刚变化）
  try { panes[name].contentWindow.postMessage({ type: "yexi-measure" }, "*"); } catch (e) {}
}

var segBtns = document.querySelectorAll(".diy-seg-btn");
for (var b = 0; b < segBtns.length; b++) {
  segBtns[b].onclick = function() { switchPane(this.getAttribute("data-pane")); };
}

// 视图高度现在由 CSS 撑满剩余屏幕，不再按内容长高，
// 否则 iframe 比屏幕还高，里面的 fixed 抽屉就会飘在半空、盖住声场。
// 子页面报上来的高度忽略即可。

paneMix.addEventListener("load", function() {
  try { paneMix.contentWindow.postMessage({ type: "yexi-measure" }, "*"); } catch (e) {}
});
paneStitch.addEventListener("load", function() {
  try { paneStitch.contentWindow.postMessage({ type: "yexi-measure" }, "*"); } catch (e) {}
});

// ?pane=stitch 可直接落在做拼接；其余参数和 #mix= 透传给「做底层」子页面
var diyParams = new URLSearchParams(location.search);
var wanted = diyParams.get("pane");
diyParams.delete("pane");
diyParams.set("embed", "1");
var mixSrc = "index.html?" + diyParams.toString() + (location.hash || "");
if (paneMix.getAttribute("src") !== mixSrc) {
  paneMix.src = mixSrc;
}
if (wanted === "stitch") switchPane("stitch");

// ===== 创作路径引导：四步常驻，点一下跳到对应控件 =====
var STEP_KEY = "yexi_diy_path_v1";
var STEPS = [
  { key: "base", hint: "先选一套，或者直接用已经给你铺好的。", pane: null },
  { key: "make", hint: "改一改：拖声音的远近，或拖段落的长短。", pane: null },
  { key: "save", hint: "存到「我的作品」，下次回来还能听。", pane: "mix" },
  { key: "publish", hint: "想给别人听？写一句话寄到广场。", pane: "stitch" }
];
var stepState = { base: false, make: false, save: false, publish: false };
try {
  var savedStep = JSON.parse(localStorage.getItem(STEP_KEY) || "{}");
  if (savedStep && typeof savedStep === "object") {
    for (var sk in stepState) {
      if (Object.prototype.hasOwnProperty.call(savedStep, sk)) stepState[sk] = !!savedStep[sk];
    }
  }
} catch (e) {}

function persistSteps() {
  try { localStorage.setItem(STEP_KEY, JSON.stringify(stepState)); } catch (e) {}
}

function currentStepKey() {
  for (var i = 0; i < STEPS.length; i++) {
    if (!stepState[STEPS[i].key]) return STEPS[i].key;
  }
  return "publish";
}

function allStepsDone() {
  for (var i = 0; i < STEPS.length; i++) {
    if (!stepState[STEPS[i].key]) return false;
  }
  return true;
}

// 演示高光时为真：只改视觉，不写进度、不被真实事件覆盖
var demoing = false;

function renderPath() {
  if (demoing) return;
  var active = currentStepKey();
  var btns = document.querySelectorAll(".diy-step");
  for (var i = 0; i < btns.length; i++) {
    var k = btns[i].getAttribute("data-step");
    btns[i].classList.toggle("on", k === active);
    btns[i].classList.toggle("done", !!stepState[k]);
  }
  var finished = allStepsDone();
  document.getElementById("diyPath").classList.toggle("finished", finished);
  document.getElementById("diyPathHint").classList.toggle("finished", finished);
  var hint = "";
  for (var j = 0; j < STEPS.length; j++) {
    if (STEPS[j].key === active) { hint = finished ? "都做完了，想再改就点上面的步骤。" : STEPS[j].hint; break; }
  }
  document.getElementById("diyPathHint").textContent = hint;
}

function markStepDone(key) {
  if (!stepState.hasOwnProperty(key) || stepState[key]) return;
  stepState[key] = true;
  persistSteps();
  if (demoing) return;
  renderPath();
  // 刚完成的那一步扫一次淡光；完成后不弹窗、不遮播放
  var doneBtn = document.querySelector('.diy-step[data-step="' + key + '"]');
  if (doneBtn) {
    doneBtn.classList.remove("flash");
    void doneBtn.offsetWidth;
    doneBtn.classList.add("flash");
    setTimeout(function() { doneBtn.classList.remove("flash"); }, 950);
  }
  var hintEl = document.getElementById("diyPathHint");
  if (allStepsDone()) {
    hintEl.textContent = "都做完了，想再改就点上面的步骤。";
  } else {
    var next = currentStepKey();
    for (var i = 0; i < STEPS.length; i++) {
      if (STEPS[i].key === next) { hintEl.textContent = "下一步：" + STEPS[i].hint; break; }
    }
  }
}

var stepBtns = document.querySelectorAll(".diy-step");
for (var si = 0; si < stepBtns.length; si++) {
  stepBtns[si].onclick = function() {
    var key = this.getAttribute("data-step");
    for (var i = 0; i < STEPS.length; i++) {
      if (STEPS[i].key === key && STEPS[i].pane && STEPS[i].pane !== currentPane) {
        switchPane(STEPS[i].pane);
      }
    }
    // 让对应视图滚过去并闪一下控件
    try { panes[currentPane].contentWindow.postMessage({ type: "yexi-goto-step", step: key }, "*"); } catch (e) {}
  };
}
renderPath();

// ===== 真引导：带着我做（做完才推进）/ 高亮讲解（自己点下一步） =====
// 不自动播放、不演戏。高亮的是真实控件，讲的是这一步真正要做的动作。
var guideBtn = document.getElementById("diyGuideBtn");
var explainBtn = document.getElementById("diyExplainBtn");
var resetBtn = document.getElementById("diyResetBtn");
var guideBar = document.getElementById("diyGuideBar");
var guideStepNo = document.getElementById("guideStepNo");
var guideText = document.getElementById("guideText");
var guideNext = document.getElementById("guideNext");
var guideClose = document.getElementById("guideClose");

var GUIDE_TEXT = {
  base: "先挑一套铺底。已经帮你铺好一套了，想换就点模板。",
  make: "把声音拖近拖远、左右摆一摆，或者在拼接页拖段落的长短。",
  save: "点这里存到「我的作品」，下次回来还能接着听。",
  publish: "想给别人听，就点这里写一句话寄到广场。"
};
var DONE_TEXT = {
  base: "铺好了。下一步：让它更像你要的夜。",
  make: "改好了。下一步：把它存下来。",
  save: "存好了。最后一步：要不要寄到广场？",
  publish: "四步都走完了，这条夜色是你自己做出来的。"
};
var guideMode = "";       // "do" | "tell" | ""
var guideIndex = 0;

// 「带着我做」时锁住其它入口：只能点这一步指定的控件，退出按钮永远可用
function setGuideLock(on) {
  var segs = document.querySelectorAll(".diy-seg-btn");
  var i;
  for (i = 0; i < segs.length; i++) segs[i].disabled = on;
  var steps = document.querySelectorAll(".diy-step");
  for (i = 0; i < steps.length; i++) steps[i].disabled = on;
  guideBtn.disabled = on;
  explainBtn.disabled = on;
  resetBtn.disabled = on;
  document.body.classList.toggle("guide-locked", on);
  try { panes.mix.contentWindow.postMessage({ type: on ? "yexi-guide-lock" : "yexi-guide-unlock", step: STEPS[guideIndex].key }, "*"); } catch (e) {}
  try { panes.stitch.contentWindow.postMessage({ type: on ? "yexi-guide-lock" : "yexi-guide-unlock", step: STEPS[guideIndex].key }, "*"); } catch (e) {}
}

function guideStart(mode) {
  guideMode = mode;
  guideIndex = 0;
  for (var i = 0; i < STEPS.length; i++) {
    if (!stepState[STEPS[i].key]) { guideIndex = i; break; }
    guideIndex = i; // 全做完了就从最后一步回顾
  }
  guideNext.classList.toggle("hide", mode !== "tell");
  guideBar.classList.remove("hide");
  setGuideLock(mode === "do"); // 带着我做才锁；高亮讲解随便点
  guideShow();
}

function guideShow() {
  var step = STEPS[guideIndex];
  var key = step.key;
  guideStepNo.textContent = (guideIndex + 1) + " / " + STEPS.length;
  guideText.textContent = GUIDE_TEXT[key] + (guideMode === "do" ? "（其它按钮暂时锁住了，先做这一步）" : "");
  guideNext.textContent = guideIndex === STEPS.length - 1 ? "完成 ›" : "下一步 ›";
  // 高亮必须落在这一步真正所在的 tab 和控件上
  if (step.pane && step.pane !== currentPane) switchPane(step.pane);
  var pane = panes[currentPane];
  try { pane.contentWindow.postMessage({ type: "yexi-goto-step", step: key, hold: true }, "*"); } catch (e) {}
  if (guideMode === "do") {
    try { panes.mix.contentWindow.postMessage({ type: "yexi-guide-lock", step: key }, "*"); } catch (e) {}
    try { panes.stitch.contentWindow.postMessage({ type: "yexi-guide-lock", step: key }, "*"); } catch (e) {}
  }
  var btn = document.querySelector('.diy-step[data-step="' + key + '"]');
  if (btn) {
    btn.classList.remove("flash");
    void btn.offsetWidth;
    btn.classList.add("flash");
    setTimeout(function() { btn.classList.remove("flash"); }, 1100);
  }
}

function guideEnd() {
  setGuideLock(false);
  guideMode = "";
  guideBar.classList.add("hide");
  try { panes[currentPane].contentWindow.postMessage({ type: "yexi-guide-clear" }, "*"); } catch (e) {}
  try { panes.mix.contentWindow.postMessage({ type: "yexi-guide-clear" }, "*"); } catch (e) {}
  try { panes.stitch.contentWindow.postMessage({ type: "yexi-guide-clear" }, "*"); } catch (e) {}
}

function guideAdvance() {
  var key = STEPS[guideIndex].key;
  guideText.textContent = DONE_TEXT[key] || "好了。";
  if (guideIndex >= STEPS.length - 1) { setTimeout(guideEnd, 1600); return; }
  guideIndex += 1;
  setTimeout(guideShow, 900); // 先让"刚做完"这句话被看见，再指下一个控件
}

guideBtn.onclick = function() { guideStart("do"); };
explainBtn.onclick = function() { guideStart("tell"); };
guideNext.onclick = function() {
  if (guideMode !== "tell") return;
  guideAdvance();
};
guideClose.onclick = guideEnd;

resetBtn.onclick = function() {
  try { localStorage.removeItem(STEP_KEY); } catch (e) {}
  location.reload();
};

// 子视图消息桥接：步骤进度 + 「做底层」配方导入「做拼接」
window.addEventListener("message", function(e) {
  if (!e.data || typeof e.data !== "object") return;
  if (e.data.type === "yexi-step-done") {
    markStepDone(e.data.step);
    // 「带着我做」：只有用户真的做完这一步才推进，点下一步没用
    if (guideMode === "do" && e.data.step === STEPS[guideIndex].key) guideAdvance();
  } else if (e.data.type === "yexi-request-mix") {
    try { paneMix.contentWindow.postMessage({ type: "yexi-get-mix" }, "*"); } catch (err) {}
  } else if (e.data.type === "yexi-mix-reply") {
    try {
      paneStitch.contentWindow.postMessage({
        type: "yexi-mix-data",
        title: e.data.title || "做底层配方",
        tracks: Array.isArray(e.data.tracks) ? e.data.tracks : []
      }, "*");
    } catch (err) {}
  }
});
</script>
