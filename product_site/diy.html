<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>夜息 · DIY</title>
<link rel="stylesheet" href="theme.css?v=13">
<style>
  /* app 式布局：tab 壳固定顶部，内容区占满剩余屏幕自己滚。
     这样嵌入视图里的 fixed 抽屉才是贴屏幕底，而不是贴一张很高的 iframe 底。 */
  html, body { height: 100%; }
  body {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 顶部 tab 壳：两个视图常驻，切换只改显示，不重新加载 */
  .diy-top {
    flex: 0 0 auto;
    position: relative;
    z-index: 5;
    background: linear-gradient(180deg, rgba(7, 5, 13, 0.88) 0%, rgba(7, 5, 13, 0.62) 100%);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: none;
  }
  .diy-top .wrap-wide { padding-bottom: 12px; }

  .diy-seg {
    display: inline-flex;
    gap: 4px;
    padding: 4px;
    max-width: 100%;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.055);
    border: none;
  }
  .diy-seg-btn {
    min-width: 104px;
    padding: 8px 18px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--y-text-muted);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .diy-seg-btn.on {
    background: rgba(233, 183, 131, 0.16);
    color: #fce5c8;
  }
  /* 引导要用户点「做拼接」时，把真 tab 高亮出来（不是假按钮） */
  .diy-seg-btn.yexi-step-focus,
  .diy-seg-btn.yexi-step-hold {
    outline: 3px solid #ffd39a !important;
    outline-offset: 3px !important;
    background: rgba(233,183,131,0.32) !important;
    color: #fff0d8 !important;
    box-shadow: 0 0 0 5px rgba(255,190,120,0.3),
                0 0 28px rgba(255,190,120,0.75) !important;
    animation: diy-step-breathe 1.8s ease-in-out infinite !important;
    position: relative;
    z-index: 2;
  }
  .diy-caption-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .diy-caption {
    margin: 10px 0 2px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--y-text-muted);
  }
  /* 完成或收起后：顶部新手条退场，说明行右侧留一个很轻的「看教程」入口 */
  .diy-help-btn {
    flex: 0 0 auto;
    margin-top: 8px;
    padding: 4px 11px;
    border: none;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--y-text-sub);
    font-family: inherit;
    font-size: 10.5px;
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .diy-help-btn:hover {
    background: rgba(233, 183, 131, 0.15);
    color: var(--y-warm);
  }
  .diy-help-btn.hide { display: none; }
  body.guide-active .diy-help-btn,
  body:not(.tutorial-done) .diy-help-btn { display: none; }

  /* 首次进入未完成/未收起时：仅占一行的轻提示条 */
  .diy-intro-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 8px;
    padding: 7px 10px;
    border: 1px solid rgba(255, 198, 130, 0.28);
    border-radius: 10px;
    background: rgba(233, 183, 131, 0.08);
    font-size: 11.5px;
    line-height: 1.4;
  }
  .diy-intro-bar.hide { display: none; }
  body.guide-active .diy-intro-bar,
  body.tutorial-done .diy-intro-bar { display: none; }
  .diy-intro-text {
    color: #e9dcc7;
    min-width: 0;
  }
  .diy-intro-acts {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .diy-intro-start {
    padding: 4px 11px;
    border: 1px solid rgba(255, 198, 130, 0.58);
    border-radius: 999px;
    background: rgba(233, 183, 131, 0.18);
    color: #ffd39a;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  .diy-intro-start:hover {
    background: rgba(233, 183, 131, 0.28);
  }
  .diy-intro-dismiss {
    border: 0;
    background: transparent;
    color: #8f8a9c;
    font-family: inherit;
    font-size: 15px;
    line-height: 1;
    padding: 2px 4px;
    cursor: pointer;
  }

  /* 引导条：贴在说明行下面，不遮播放器、不弹窗、不锁页面 */
  .diy-guide-bar {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 8px;
    padding: 9px 11px;
    border: 2px solid rgba(255, 198, 130, 0.9);
    border-radius: 10px;
    background: rgba(233, 183, 131, 0.16);
    box-shadow: 0 0 18px rgba(255, 190, 120, 0.3), inset 0 0 12px rgba(255, 190, 120, 0.12);
    font-size: 11.5px;
    line-height: 1.55;
  }
  .diy-guide-bar.hide { display: none; }
  .diy-guide-bar .g-head {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }
  .diy-guide-bar .g-step {
    color: #ffd39a;
    flex: 0 0 auto;
    font-weight: 600;
  }
  .diy-guide-bar .g-title {
    color: #fce5c8;
    font-size: 12px;
    font-weight: 600;
    min-width: 0;
  }
  .diy-guide-bar .g-seen {
    flex: 0 0 auto;
    padding: 1px 8px;
    border-radius: 999px;
    border: 1px solid rgba(94, 196, 168, 0.45);
    background: rgba(94, 196, 168, 0.18);
    color: #b9e6d6;
    font-size: 10.5px;
    line-height: 1.4;
  }
  .diy-guide-bar .g-seen.hide { display: none; }
  .diy-guide-bar .g-close {
    margin-left: auto;
    flex: 0 0 auto;
    border: 0;
    background: transparent;
    color: #8f8a9c;
    font-family: inherit;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 0 2px;
  }
  .diy-guide-bar .g-text {
    color: #e9dcc7;
    width: 100%;
  }
  /* 每步一句「为什么要这么做」，跟操作句分开，读起来不闷 */
  .diy-guide-bar .g-tip {
    width: 100%;
    padding-left: 8px;
    border-left: 2px solid rgba(255, 198, 130, 0.55);
    color: #bfb2a0;
    font-size: 11px;
    line-height: 1.5;
  }
  .diy-guide-bar .g-tip.hide { display: none; }
  .diy-guide-bar .g-actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    width: 100%;
    margin-top: 2px;
  }
  .diy-guide-bar .g-prev {
    flex: 0 0 auto;
    border: 0;
    background: transparent;
    color: var(--y-text-sub);
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    padding: 3px 4px;
  }
  .diy-guide-bar .g-prev.hide { display: none; }
  .diy-guide-bar .g-next-btn {
    flex: 0 0 auto;
    border: 2px solid rgba(255, 198, 130, 0.85);
    border-radius: 999px;
    background: rgba(255, 198, 130, 0.22);
    color: #ffd39a;
    font-family: inherit;
    font-size: 11px;
    padding: 3px 12px;
    cursor: pointer;
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }
  .diy-guide-bar .g-next-btn.ready {
    background: rgba(255, 198, 130, 0.3);
    box-shadow: 0 0 12px rgba(255, 190, 120, 0.35);
    color: #ffe6c6;
  }
  @keyframes diy-step-breathe {
    0%, 100% {
      outline-color: rgba(255,211,154,0.9);
      box-shadow: 0 0 0 4px rgba(255,190,120,0.22), 0 0 20px rgba(255,190,120,0.6);
    }
    50% {
      outline-color: #fff0d8;
      box-shadow: 0 0 0 7px rgba(255,190,120,0.45), 0 0 40px rgba(255,190,120,0.95);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .diy-seg-btn.yexi-step-focus, .diy-seg-btn.yexi-step-hold {
      animation: none;
      outline: 3px solid #ffd39a !important;
      outline-offset: 3px !important;
    }
  }

  .diy-panes {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    z-index: 1;
  }
  .diy-pane {
    position: absolute;
    inset: 0;
    display: none;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
  }
  .diy-pane.on { display: block; }

  @media (max-width: 420px) {
    .diy-seg-btn { min-width: 92px; padding: 8px 12px; font-size: 12.5px; }
  }
</style>
</head>
<body>
<div class="ambient-stage" id="ambientStage"></div>

<div class="diy-top">
  <div class="wrap-wide">
    <div class="top">
      <a class="brand" href="home.html">
        <div class="moon"><svg class="y-ico-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></div>
        <div class="name">夜息</div>
      </a>
    </div>
    <div class="diy-seg" role="tablist" aria-label="DIY 功能切换">
      <button type="button" class="diy-seg-btn on" data-pane="mix" role="tab" aria-selected="true" aria-controls="paneMix">做底层</button>
      <button type="button" class="diy-seg-btn" data-pane="stitch" role="tab" aria-selected="false" aria-controls="paneStitch">做拼接</button>
    </div>
    <div class="diy-caption-row">
      <p class="diy-caption" id="diyCaption">叠几层声音，拖出远近左右。</p>
      <button type="button" class="diy-help-btn hide" id="diyHelpBtn">看教程</button>
    </div>
    <div class="diy-intro-bar" id="diyIntroBar">
      <span class="diy-intro-text">第一次来？10 步带你从铺底走到拼接，一步一个动作</span>
      <span class="diy-intro-acts">
        <button type="button" class="diy-intro-start" id="diyGuideBtn">开始教程</button>
        <button type="button" class="diy-intro-dismiss" id="diyDismissBtn" aria-label="暂不需要">×</button>
      </span>
    </div>
    <div class="diy-guide-bar hide" id="diyGuideBar" role="status" aria-live="polite">
      <div class="g-head">
        <span class="g-step" id="guideStepNo">1 / 6</span>
        <span class="g-title" id="guideTitle"></span>
        <span class="g-seen hide" id="guideSeen">✓ 已试过</span>
        <button type="button" class="g-close" id="guideClose" aria-label="退出引导">×</button>
      </div>
      <div class="g-text" id="guideText"></div>
      <div class="g-tip" id="guideTip"></div>
      <div class="g-actions">
        <button type="button" class="g-prev hide" id="guidePrev">‹ 上一步</button>
        <button type="button" class="g-next-btn" id="guideNext">下一步 ›</button>
      </div>
    </div>
  </div>
</div>

<div class="diy-panes" id="diyPanes">
  <iframe id="paneMix" class="diy-pane on" src="index.html?embed=1&v=4" title="做底层" aria-hidden="false"></iframe>
  <iframe id="paneStitch" class="diy-pane" src="stitch.html?embed=1&v=4" title="做拼接" aria-hidden="true"></iframe>
</div>

<div class="tabbar"></div>

<script src="auth_ui.js"></script>
<script src="yexi_shell.js"></script>
<script src="yexi_catalog.js?v=44"></script>
<script>
initAuthBar("diy.html");
initYexiTabbar("diy.html");
initAmbientStage("img/night-lake-stars.jpg", "#e9b783");

var paneMix = document.getElementById("paneMix");
var paneStitch = document.getElementById("paneStitch");
var panes = { mix: paneMix, stitch: paneStitch };
var captions = {
  mix: "叠几层声音，拖出远近左右。",
  stitch: "几段声音接成一整夜，点哪段就从哪段听。"
};
var currentPane = "mix";

function switchPane(name) {
  if (!panes[name]) return;
  if (name !== currentPane) {
    // 离开的那个先停声，避免两个视图同时出声
    try { panes[currentPane].contentWindow.postMessage({ type: "yexi-pause" }, "*"); } catch (e) {}
    currentPane = name;
    for (var k in panes) {
      if (!Object.prototype.hasOwnProperty.call(panes, k)) continue;
      panes[k].classList.toggle("on", k === name);
      panes[k].setAttribute("aria-hidden", k === name ? "false" : "true");
    }
    var allBtns = document.querySelectorAll(".diy-seg-btn");
    for (var i = 0; i < allBtns.length; i++) {
      var on = allBtns[i].getAttribute("data-pane") === name;
      allBtns[i].classList.toggle("on", on);
      allBtns[i].setAttribute("aria-selected", on ? "true" : "false");
    }
    document.getElementById("diyCaption").textContent = captions[name];
    try { history.replaceState(null, "", "diy.html?pane=" + name); } catch (e) {}
    // 布局是壳固定 + 视图内部滚动，所以滚回顶要滚 iframe 自己
    try { panes[name].contentWindow.scrollTo(0, 0); } catch (e) {}
  }
  // 重新量一次高度（刚显示出来时 iframe 尺寸可能刚变化）
  try { panes[name].contentWindow.postMessage({ type: "yexi-measure" }, "*"); } catch (e) {}
}

var segBtns = document.querySelectorAll(".diy-seg-btn");
for (var b = 0; b < segBtns.length; b++) {
  segBtns[b].onclick = function() { switchPane(this.getAttribute("data-pane")); };
}

// 视图高度现在由 CSS 撑满剩余屏幕，不再按内容长高，
// 否则 iframe 比屏幕还高，里面的 fixed 抽屉就会飘在半空、盖住声场。
// 子页面报上来的高度忽略即可。

paneMix.addEventListener("load", function() {
  try { paneMix.contentWindow.postMessage({ type: "yexi-measure" }, "*"); } catch (e) {}
  if (guideActive && GUIDE_STEPS[guideIndex] && GUIDE_STEPS[guideIndex].pane === "mix") {
    guideShow();
  }
});
paneStitch.addEventListener("load", function() {
  try { paneStitch.contentWindow.postMessage({ type: "yexi-measure" }, "*"); } catch (e) {}
  if (guideActive && GUIDE_STEPS[guideIndex] && GUIDE_STEPS[guideIndex].pane === "stitch") {
    guideShow();
  }
});

// ?pane=stitch 可直接落在做拼接；其余参数和 #mix= 透传给「做底层」子页面
var diyParams = new URLSearchParams(location.search);
var wanted = diyParams.get("pane");
diyParams.delete("pane");
diyParams.set("embed", "1");
diyParams.set("v", "4");
var mixSrc = "index.html?" + diyParams.toString() + (location.hash || "");
if (paneMix.getAttribute("src") !== mixSrc) {
  paneMix.src = mixSrc;
}
if (wanted === "stitch") switchPane("stitch");

// ===== 10 步引导：先「做底层」一层层铺，再「做拼接」一段段接 =====
// 每一步只讲一个动作，配一句「为什么要这么做」，控件持续高亮等用户做完。
var STEP_KEY = "yexi_diy_path_v2";
var GUIDE_STEPS = [
  {
    id: "drawer",
    pane: "mix",
    title: "做底层 · 先把抽屉拉起来",
    focusStep: "drawer",
    actionKeys: ["drawer"],
    text: function() {
      if (window.innerWidth <= 619) {
        return "加声音全靠屏幕最下面那条「选声音 · 调参数 · 作品」。轻点它一下，抽屉就升起来；按住把手上下拖能自己定露多高，再点一下收回。";
      }
      return "加声音全靠右边这块面板。它顶上三个页签：「选声音」找素材、「调参数」改这一层、「作品」翻你存过的。";
    },
    tip: "抽屉里的声音分三类：底幕打底、纹理加细节、点缀偶尔响一下。下面三步一类一个，别一次点一堆。"
  },
  {
    id: "bed",
    pane: "mix",
    title: "第 1 类 · 底幕选一个",
    focusStep: "layerBed",
    actionKeys: ["layer:bed", "base"],
    text: "先看「底幕」这一格（已经替你切好了）。在下面的素材里点 1 个：雨声、海浪、溪流、炉火都在这层，它整晚垫在最底下。",
    tip: "点一下变亮打勾就是选中，声场里会多出一个圆点；点错了再点一次就取消。"
  },
  {
    id: "texture",
    pane: "mix",
    title: "第 2 类 · 纹理选一个",
    focusStep: "layerTexture",
    actionKeys: ["layer:texture"],
    text: "切到「纹理」，再挑 1 个：采耳、梳发、翻书这类带动作感的声音，给耳朵一点可以跟着走的细节。",
    tip: "0~2 层就够。叠太多会互相盖住，反而听不清谁是谁。"
  },
  {
    id: "accent",
    pane: "mix",
    title: "第 3 类 · 点缀选一个",
    focusStep: "layerAccent",
    actionKeys: ["layer:accent"],
    text: "最后切「点缀」，挑 1 个：羽毛、轻敲、虫鸣——它们只在偶尔响一下，负责提神，不抢戏。",
    tip: "只想要纯雨声的话，这一步可以直接跳过；后面随时能回来补。"
  },
  {
    id: "make",
    pane: "mix",
    title: "把每一层拖到该在的位置",
    focusStep: "make",
    actionKeys: ["make"],
    closeMixDrawer: true,
    text: "看中间的声场：每层声音是一个圆点。按住圆点拖——左右决定偏哪只耳朵，上下决定远还是近。",
    tip: "轻点某个圆点会打开「调参数」，在那儿改音量、循环、偶发频率，或把这一层删掉。"
  },
  {
    id: "save",
    pane: "mix",
    title: "存下来，或现在就听着睡",
    focusStep: "save",
    actionKeys: ["save"],
    closeMixDrawer: true,
    text: "听着顺耳了就点「保存」，它会进「我的作品」；想现在就睡，点旁边的「定时入睡」，到点自动淡出。",
    tip: "保存后去底栏「我的」→「今晚听这个」，也能直接在首页睡前播。"
  },
  {
    id: "stitch_drawer",
    pane: "stitch",
    title: "做拼接 · 先认识控制台",
    focusStep: "stitchDrawer",
    actionKeys: ["drawer"],
    flashStitchTab: true,
    text: function() {
      if (window.innerWidth <= 819) {
        return "切到「做拼接」了。先看最下面那条抽屉：轻点把手升起来，按住能拖高。里面两个页签——「选声音」给这一段加声，「调这段」管音量、过渡和时长。";
      }
      return "切到「做拼接」了。右边那块设置卡片就是控制台：上半截加这一段的声层，下半截管这一段播多久、怎么跟下一段过渡。";
    },
    tip: "拼接是把几段不同的夜接成一整晚：段与段之间平滑交叉，不改原始录音音色。"
  },
  {
    id: "stitch_sound",
    pane: "stitch",
    title: "建第一段，给它配声",
    focusStep: "stitchSound",
    actionKeys: ["stitchSound", "base", "make"],
    text: "点「+ 加一段」建出第一段，再拉抽屉「选声音」给它挑 1~4 层；嫌麻烦就点「导入做底层配方」，把刚配好的那套整段搬过来。",
    tip: "每段建议 2~4 层：一层底幕托住，再叠 1~2 层纹理或点缀，太少会显得空。"
  },
  {
    id: "stitch_timeline",
    pane: "stitch",
    title: "排顺序、改时长、听衔接",
    focusStep: "make",
    actionKeys: ["make"],
    closeStitchDrawer: true,
    text: "时间线可以左右滑。按住某一段左右拖能改顺序，拖它的右边缘能改时长，点两段中间「试听衔接」听听过渡顺不顺。",
    tip: "右上角「+ 加一段」随时能补段落；先排顺序再改时长，比反过来省事。"
  },
  {
    id: "stitch_finish",
    pane: "stitch",
    title: "保存拼接 · 可选发广场",
    focusStep: "stitchFinish",
    actionKeys: ["save", "publish"],
    closeStitchDrawer: true,
    text: "拼好点「保存」，会列在上方方便下次载入；想给别人听点「发广场」（需登录，发出后可撤回）；只想自己听，点「完成」就行。",
    tip: "发广场前记得先试听整条时间线——它按顺序连着播，不是各段各放一遍。"
  }
];

function readTutorialDone() {
  try {
    var saved = JSON.parse(localStorage.getItem(STEP_KEY) || "{}");
    if (saved && typeof saved === "object") {
      if (saved.done === true) return true;
      if (saved.base && saved.make && saved.save && saved.publish) return true;
    }
  } catch (e) {}
  return false;
}
function writeTutorialDone(done) {
  try { localStorage.setItem(STEP_KEY, JSON.stringify({ done: !!done })); } catch (e) {}
}

var tutorialDone = readTutorialDone();
var guideActive = false;
var guideIndex = 0;
var stepTried = {};
var guideTimer = null;
var stitchTabTimer = null;

var introBar = document.getElementById("diyIntroBar");
var helpBtn = document.getElementById("diyHelpBtn");
var guideBtn = document.getElementById("diyGuideBtn");
var dismissBtn = document.getElementById("diyDismissBtn");
var guideBar = document.getElementById("diyGuideBar");
var guideStepNo = document.getElementById("guideStepNo");
var guideTitle = document.getElementById("guideTitle");
var guideSeen = document.getElementById("guideSeen");
var guideText = document.getElementById("guideText");
var guideTip = document.getElementById("guideTip");
var guidePrev = document.getElementById("guidePrev");
var guideNext = document.getElementById("guideNext");
var guideClose = document.getElementById("guideClose");

function syncTutorialChrome() {
  document.body.classList.toggle("guide-active", guideActive);
  document.body.classList.toggle("tutorial-done", tutorialDone && !guideActive);
  if (introBar) introBar.classList.toggle("hide", guideActive || tutorialDone);
  if (helpBtn) helpBtn.classList.toggle("hide", guideActive || !tutorialDone);
  if (guideBar) guideBar.classList.toggle("hide", !guideActive);
}

function clearGuideTimers() {
  if (guideTimer) { clearTimeout(guideTimer); guideTimer = null; }
  if (stitchTabTimer) { clearTimeout(stitchTabTimer); stitchTabTimer = null; }
}

function clearTabFocus() {
  var segs = document.querySelectorAll(".diy-seg-btn.yexi-step-focus");
  for (var i = 0; i < segs.length; i++) segs[i].classList.remove("yexi-step-focus");
}

function updateGuideSeenUI(step) {
  var tried = !!stepTried[step.id];
  if (guideSeen) guideSeen.classList.toggle("hide", !tried);
  if (guideNext) guideNext.classList.toggle("ready", tried);
}

function guideStart(startIdx) {
  clearGuideTimers();
  guideActive = true;
  guideIndex = (typeof startIdx === "number" && startIdx >= 0 && startIdx < GUIDE_STEPS.length) ? startIdx : 0;
  stepTried = {};
  try { panes.mix.contentWindow.postMessage({ type: "yexi-guide-unlock" }, "*"); } catch (e) {}
  try { panes.stitch.contentWindow.postMessage({ type: "yexi-guide-unlock" }, "*"); } catch (e) {}
  syncTutorialChrome();
  guideShow();
}

function guideShow() {
  if (!guideActive) return;
  clearGuideTimers();
  clearTabFocus();

  var step = GUIDE_STEPS[guideIndex];
  guideStepNo.textContent = (guideIndex + 1) + " / " + GUIDE_STEPS.length;
  guideTitle.textContent = step.title;
  guideText.textContent = (typeof step.text === "function") ? step.text() : step.text;
  if (guideTip) {
    var tipText = (typeof step.tip === "function") ? step.tip() : (step.tip || "");
    guideTip.textContent = tipText;
    guideTip.classList.toggle("hide", !tipText);
  }
  guidePrev.classList.toggle("hide", guideIndex === 0);
  guideNext.textContent = (guideIndex === GUIDE_STEPS.length - 1) ? "完成" : "下一步 ›";
  updateGuideSeenUI(step);

  if (step.pane && step.pane !== currentPane) switchPane(step.pane);

  if (step.closeMixDrawer) {
    try { panes.mix.contentWindow.postMessage({ type: "yexi-drawer-close" }, "*"); } catch (e) {}
  }
  if (step.closeStitchDrawer) {
    try { panes.stitch.contentWindow.postMessage({ type: "yexi-drawer-close" }, "*"); } catch (e) {}
  }

  if (step.flashStitchTab) {
    var stitchTab = document.querySelector('.diy-seg-btn[data-pane="stitch"]');
    if (stitchTab) {
      stitchTab.classList.remove("yexi-step-focus");
      void stitchTab.offsetWidth;
      stitchTab.classList.add("yexi-step-focus");
      stitchTabTimer = setTimeout(clearTabFocus, 1800);
    }
  }

  var otherPane = (step.pane === "mix") ? panes.stitch : panes.mix;
  var activePane = panes[step.pane] || panes[currentPane];
  try { otherPane.contentWindow.postMessage({ type: "yexi-guide-clear" }, "*"); } catch (e) {}
  try { activePane.contentWindow.postMessage({ type: "yexi-goto-step", step: step.focusStep, hold: true }, "*"); } catch (e) {}
}

function guideEnd() {
  clearGuideTimers();
  clearTabFocus();
  guideActive = false;
  syncTutorialChrome();
  try { panes.mix.contentWindow.postMessage({ type: "yexi-guide-clear" }, "*"); } catch (e) {}
  try { panes.stitch.contentWindow.postMessage({ type: "yexi-guide-clear" }, "*"); } catch (e) {}
}

function guideGo(delta) {
  if (!guideActive) return;
  var nextIdx = guideIndex + delta;
  if (nextIdx < 0) return;
  if (nextIdx >= GUIDE_STEPS.length) {
    tutorialDone = true;
    writeTutorialDone(true);
    guideEnd();
    return;
  }
  guideIndex = nextIdx;
  guideShow();
}

if (guideBtn) guideBtn.onclick = function() { guideStart(0); };
if (helpBtn) helpBtn.onclick = function() { guideStart(0); };
if (dismissBtn) {
  dismissBtn.onclick = function() {
    tutorialDone = true;
    writeTutorialDone(true);
    syncTutorialChrome();
  };
}
if (guidePrev) guidePrev.onclick = function() { guideGo(-1); };
if (guideNext) guideNext.onclick = function() { guideGo(1); };
if (guideClose) guideClose.onclick = guideEnd;

syncTutorialChrome();

// 子视图消息桥接：步骤轻反馈 + 「做底层」配方导入「做拼接」
window.addEventListener("message", function(e) {
  if (!e.data || typeof e.data !== "object") return;
  if (e.data.type === "yexi-step-done") {
    if (!guideActive) return;
    var step = GUIDE_STEPS[guideIndex];
    if (!step) return;
    var expectedWin = (step.pane === "stitch") ? paneStitch.contentWindow : paneMix.contentWindow;
    if (e.source && expectedWin && e.source !== expectedWin) return;
    if (step.actionKeys && step.actionKeys.indexOf(e.data.step) >= 0) {
      stepTried[step.id] = true;
      updateGuideSeenUI(step);
    }
  } else if (e.data.type === "yexi-request-mix") {
    try { paneMix.contentWindow.postMessage({ type: "yexi-get-mix" }, "*"); } catch (err) {}
  } else if (e.data.type === "yexi-mix-reply") {
    try {
      paneStitch.contentWindow.postMessage({
        type: "yexi-mix-data",
        title: e.data.title || "做底层配方",
        tracks: Array.isArray(e.data.tracks) ? e.data.tracks : []
      }, "*");
    } catch (err) {}
  }
});
</script>
</body>
</html>
