<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>登录 · 夜息</title>
<link rel="stylesheet" href="theme.css?v=13">
<style>
  .auth-wrap {
    position: relative;
    z-index: 1;
    max-width: 420px;
    margin: 0 auto;
    padding: 0 20px 64px;
  }
  .back {
    display: inline-block;
    color: var(--y-text-sub);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.08em;
    padding: 24px 0 10px;
    transition: color 0.5s ease;
  }
  .back:hover { color: var(--y-warm); }
  .head { text-align: center; padding: 12px 0 28px; }
  .head .moon {
    width: 56px;
    height: 56px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 36% 34%, #fbf3e6 0%, #e9cfa6 46%, rgba(233, 183, 131, 0.16) 74%, transparent 78%);
    font-size: 0;
    color: transparent;
    box-shadow: 0 0 36px rgba(var(--y-warm-rgb), 0.34);
  }
  .head h1 {
    font-family: var(--y-serif);
    font-size: 26px;
    font-weight: 300;
    letter-spacing: 0.16em;
    margin: 0;
    color: #fbf7ff;
  }
  .head p {
    font-size: 13px;
    color: var(--y-text-sub);
    letter-spacing: 0.05em;
    margin: 8px 0 0;
  }
  .card {
    background: var(--y-glass);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: none;
    border-radius: 22px;
    padding: 24px;
    box-shadow: 0 24px 56px rgba(0, 0, 0, 0.48);
  }
  .switch {
    display: flex;
    background: rgba(7, 5, 13, 0.52);
    border: none;
    border-radius: 999px;
    padding: 4px;
    margin-bottom: 22px;
  }
  .switch button {
    flex: 1;
    padding: 9px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--y-text-muted);
    font-size: 13.5px;
    letter-spacing: 0.1em;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.45s ease, color 0.45s ease;
  }
  .switch button.on {
    background: rgba(var(--y-warm-rgb), 0.18);
    color: #fff7eb;
    font-weight: 500;
  }
  label {
    display: block;
    font-size: 12.5px;
    letter-spacing: 0.06em;
    color: var(--y-text-sub);
    margin: 0 0 8px;
  }
  input {
    width: 100%;
    background: rgba(5, 3, 10, 0.56);
    border: none;
    border-radius: 13px;
    color: var(--y-text);
    padding: 13px 14px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    margin-bottom: 16px;
    transition: background 0.5s ease, box-shadow 0.5s ease;
  }
  input:focus {
    background: rgba(5, 3, 10, 0.72);
    box-shadow: 0 0 0 2px rgba(var(--y-warm-rgb), 0.32);
  }
  input::placeholder { color: var(--y-text-muted); }
  .submit {
    width: 100%;
    background: linear-gradient(135deg, #f3e2c8, #e4b682);
    color: #1d120a;
    border: none;
    border-radius: 999px;
    padding: 13px;
    font-size: 14.5px;
    font-weight: 500;
    letter-spacing: 0.12em;
    cursor: pointer;
    font-family: inherit;
    margin-top: 4px;
    box-shadow: 0 8px 26px rgba(var(--y-warm-rgb), 0.24);
    transition: filter 0.45s ease, transform 0.25s ease;
  }
  .submit:hover { filter: brightness(1.05); }
  .submit:disabled { opacity: .5; cursor: wait; }
  .msg { font-size: 12px; color: var(--y-warm); min-height: 18px; margin: -4px 0 10px; line-height: 1.6; }
  .tip { font-size: 12px; color: var(--y-text-muted); line-height: 1.85; margin: 18px 0 0; text-align: center; }
  .foot { text-align: center; color: rgba(226, 216, 244, 0.32); font-size: 11px; letter-spacing: 0.1em; margin-top: 26px; line-height: 1.9; }
  @media(max-width:380px){ .head h1 { font-size: 22px; } }
</style>
</head>
<body>
<div class="ambient-stage" id="ambientStage"></div>
<div class="auth-wrap">
  <a class="back" id="backLink" href="home.html">‹ 先不登录</a>

  <div class="head">
    <div class="moon"></div>
    <h1 id="title">欢迎回来</h1>
    <p id="sub">登录后，你的耳朵档案会跟着账号走</p>
  </div>

  <div class="card">
    <div class="switch">
      <button id="tabLogin" class="on">登录</button>
      <button id="tabReg">注册</button>
    </div>

    <label for="username">用户名</label>
    <input id="username" type="text" autocomplete="username" placeholder="2-32 位，字母数字下划线">

    <label for="password">密码</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="至少 8 位">

    <div class="msg" id="msg"></div>
    <button class="submit" id="submitBtn">登录</button>

    <p class="tip" id="tip">没有账号？点上面的「注册」<br>现在的声音不用登录也能听</p>
  </div>

  <div class="foot">只存用户名和加密后的密码 · 不存明文<br>忘记密码功能还在做，先别用常用密码</div>
</div>

<script src="auth_ui.js"></script>
<script src="yexi_catalog.js"></script>
<script>
initAmbientStage("img/night-lake-stars.jpg", "#e9b783");
var mode = "login";
var msg = document.getElementById("msg");
var submitBtn = document.getElementById("submitBtn");

// 登录后回到来源页，只允许本站页面名，防止跳到别的网站
var from = new URLSearchParams(location.search).get("from") || "home.html";
if (!/^[A-Za-z0-9_-]+\.html$/.test(from)) from = "home.html";
document.getElementById("backLink").href = from;
// 从门闸点「先不登录」= 选游客，写个标记，别再弹门闸
document.getElementById("backLink").onclick = function() {
  try { localStorage.setItem("yezi_guest", "1"); } catch (e) {}
  // 从听觉图鉴来的，别退回测试页（那里会再弹登录，成死循环）
  if (new URLSearchParams(location.search).get("reason") === "ear_test") {
    document.getElementById("backLink").href = "home.html";
  }
};
// 从听觉图鉴跳来登录的，把话说清楚
if (new URLSearchParams(location.search).get("reason") === "ear_test") {
  document.getElementById("sub").textContent = "登录后就能生成你的专属听觉图鉴，结果会存进账号";
}

function showMsg(text) {
  msg.textContent = text;
}

function setMode(next) {
  mode = next;
  var isLogin = mode === "login";
  document.getElementById("tabLogin").className = isLogin ? "on" : "";
  document.getElementById("tabReg").className = isLogin ? "" : "on";
  document.getElementById("title").textContent = isLogin ? "欢迎回来" : "开始自己的耳朵档案";
  document.getElementById("sub").textContent = isLogin ?
    "登录后，你的耳朵档案会跟着账号走" : "存下你喜欢的声音，下次不用重新找";
  document.getElementById("tip").innerHTML = isLogin ?
    '没有账号？点上面的「注册」<br>现在的声音不用登录也能听' :
    '已经有账号？点上面的「登录」<br>注册后会自动帮你登录';
  submitBtn.textContent = isLogin ? "登录" : "注册并登录";
  document.getElementById("password").autocomplete =
    isLogin ? "current-password" : "new-password";
  showMsg("");
}

document.getElementById("tabLogin").onclick = function() { setMode("login"); };
document.getElementById("tabReg").onclick = function() { setMode("reg"); };

function doLogin(username, password, after) {
  yPost("/api/login", { username: username, password: password })
    .then(function(r) { return r.json(); }).then(function(d) {
      if (!d.ok) {
        showMsg(d.message || "登录失败");
        submitBtn.disabled = false;
        return;
      }
      ySetToken(d.token);
      showMsg("正在整理你的耳朵档案…");
      // 迁移游客档案：失败也不能挡住登录
      yPost("/api/migrate", {}).catch(function() {}).then(function() {
        location.href = after || from;
      });
    }).catch(function(e) {
      showMsg("连接后端失败：" + e.message);
      submitBtn.disabled = false;
    });
}

submitBtn.onclick = function() {
  var username = document.getElementById("username").value.trim();
  var password = document.getElementById("password").value;
  if (!username || !password) {
    showMsg("请填好用户名和密码");
    return;
  }
  submitBtn.disabled = true;
  showMsg("");

  if (mode === "reg") {
    yPost("/api/register", { username: username, password: password })
      .then(function(r) { return r.json(); }).then(function(d) {
        if (!d.ok) {
          showMsg(d.message || "注册失败");
          submitBtn.disabled = false;
          return;
        }
        // 新用户注册后直接进入听觉图鉴，先认识自己的耳朵
        showMsg("注册好了，听 5 组盲测生成你的听觉图鉴…");
        doLogin(username, password, "ear_test.html");
      }).catch(function(e) {
        showMsg("连接后端失败：" + e.message);
        submitBtn.disabled = false;
      });
  } else {
    doLogin(username, password);
  }
};

document.getElementById("password").addEventListener("keydown", function(e) {
  if (e.key === "Enter") submitBtn.click();
});
</script>
</body>
</html>
